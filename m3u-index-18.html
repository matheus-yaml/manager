<!--
  ========================= ESQUEMA DO BANCO (IndexedDB "iptv_db") =========================

  listas                 catálogo — 1 linha por lista (inclui os DICIONÁRIOS)
    { nome, origem, bytes, blocos_crus, data, processada, formato: 3,
      total:[aoVivo, filmes, episodios], series, blocos:[n0,n1,n2], blocos_series,
      grupos: [ [ [grupo, qtd], ... ] × 3 tipos ]   ← id do grupo = posição no array
      bases:  [ "http://host:80/series/user/pass/", ... ]  ← id da base = posição }

  lista_<nome_servidor>  UMA TABELA POR SERVIDOR com a m3u CRUA
    chave 0..n-1 → texto (~1 MB, cortado antes de "#EXTINF"); concatenar = arquivo original

  conteudos              TABELA ESTRUTURADA
    chave [lista, tipo, bloco]   tipo: 0 ao vivo | 1 filme | 2 episódio
    valor: TEXTO, até 2000 linhas (1 item por linha), colunas separadas por TAB:
      0 nome | 1 id_grupo | 2 id_base | 3 fim_url | 4 logo | 5 tvg_id | 6 xui_id
      só episódios: 7 id_serie | 8 temporada | 9 episodio   (logo vazio = usa o logo da série)
    url = bases[id_base] + fim_url

  busca                  índice de busca (só ao vivo e filmes), mesma chave de "conteudos"
    valor: texto, 1 linha por item na mesma posição: "nome_normalizado\tid_grupo"

  series                 chave [lista, bloco] → array de [nome, id_grupo, logo, qtd_eps, [blocos], nome_normalizado]
    id_serie = bloco * 2000 + posição

  Dicionários (grupo, base da URL, logo da série) evitam repetir o mesmo texto em
  centenas de milhares de linhas: menos bytes gravados = muito menos tempo em disco lento.

  Download, gravação e processamento rodam num Web Worker. Ao terminar, o worker é
  encerrado (terminate) e toda a memória que ele usou é devolvida ao sistema.
-->

<script id="shared-src" type="text/plain">
// ---- código comum (worker + página) ----
var ACC = { 'à':'a','á':'a','â':'a','ã':'a','ä':'a','å':'a','è':'e','é':'e','ê':'e','ë':'e','ì':'i','í':'i','î':'i','ï':'i',
  'ò':'o','ó':'o','ô':'o','õ':'o','ö':'o','ù':'u','ú':'u','û':'u','ü':'u','ç':'c','ñ':'n','ý':'y','ÿ':'y' };
var ACC_RE = /[àáâãäåèéêëìíîïòóôõöùúûüçñýÿ]/g, NON_ASCII = /[^\x00-\x7f]/;
function accRep(c) { return ACC[c]; }
function norm(s) {                        // minúsculas sem acento (tabela direta: bem mais barato que normalize NFD)
  s = s.toLowerCase();
  return NON_ASCII.test(s) ? s.replace(ACC_RE, accRep) : s;
}
</script>

<script id="worker-src" type="text/plain">
'use strict';
var DBN = 'iptv_db', CH = 1 << 20, BLOCO = 2000, RW = { durability: 'relaxed' };
var criar = null, apagar = null, db = null;

function req(r) { return new Promise(function (ok, ko) { r.onsuccess = function () { ok(r.result); }; r.onerror = function () { ko(r.error); }; }); }
function txDone(tx) { return new Promise(function (ok, ko) { tx.oncomplete = ok; tx.onerror = tx.onabort = function () { ko(tx.error); }; }); }
function post(m) { self.postMessage(m); }
function mb(n) { return (n / 1048576).toFixed(1) + ' MB'; }
function faixa(lista) { return IDBKeyRange.bound([lista], [lista, []]); }   // todas as chaves [lista, ...]

function baseSchema(d) {
  if (!d.objectStoreNames.contains('listas')) d.createObjectStore('listas', { keyPath: 'nome' });
  ['conteudos', 'busca', 'series'].forEach(function (n) { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); });
}
function open(v) {
  return new Promise(function (ok, ko) {
    var r = v ? indexedDB.open(DBN, v) : indexedDB.open(DBN);
    r.onupgradeneeded = function () {
      var d = r.result; baseSchema(d);
      if (criar && !d.objectStoreNames.contains(criar)) d.createObjectStore(criar);
      if (apagar && d.objectStoreNames.contains(apagar)) d.deleteObjectStore(apagar);
    };
    r.onblocked = function () { post({ status: 'Aguardando o banco ser liberado...' }); };
    r.onsuccess = function () { ok(r.result); };
    r.onerror = function () { ko(r.error); };
  });
}
// criar/apagar tabela exige subir a versão do banco
async function alterarSchema(nomeCriar, nomeApagar) {
  if (db) db.close();
  db = await open();
  var precisa = (nomeCriar && !db.objectStoreNames.contains(nomeCriar)) ||
                (nomeApagar && db.objectStoreNames.contains(nomeApagar));
  if (!precisa) return;
  var v = db.version + 1; db.close();
  criar = nomeCriar; apagar = nomeApagar;
  db = await open(v);
  criar = apagar = null;
}

/* ================= 1) baixar e gravar CRU em lista_<servidor> ================= */
async function importar(src, nome) {
  var next, total, rd = null, file = src.file, fr = null, off = 0, origem = src.url || (file && file.name) || 'arquivo';
  if (src.url) {
    var resp = await fetch(src.url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    rd = resp.body.getReader();
    total = +resp.headers.get('content-length') || 0;
    next = function () { return rd.read(); };
    resp = null;
  } else {
    fr = new FileReaderSync(); total = file.size;
    next = function () {
      if (off >= file.size) return Promise.resolve({ done: true });
      var b = fr.readAsArrayBuffer(file.slice(off, off + CH)); off += CH;
      return Promise.resolve({ done: false, value: new Uint8Array(b) });
    };
  }
  await alterarSchema(nome, null);
  var tx0 = db.transaction(nome, 'readwrite', RW); tx0.objectStore(nome).clear(); await txDone(tx0);

  var dec = new TextDecoder(), buf = '', n = 0, bytes = 0, last = 0;
  async function put(s) {
    var tx = db.transaction(nome, 'readwrite', RW);
    tx.objectStore(nome).put(s, n++);
    await txDone(tx);                 // só lê mais rede/arquivo depois de gravar: RAM estável
  }
  for (;;) {
    var c = await next();
    if (c.done) break;
    bytes += c.value.byteLength;
    buf += dec.decode(c.value, { stream: true });
    c = null;
    while (buf.length >= CH) {
      var cut = buf.lastIndexOf('\n#EXTINF', CH);
      if (cut <= 0) cut = buf.indexOf('\n#EXTINF', CH);
      if (cut < 0) break;
      await put(buf.slice(0, cut + 1));
      buf = buf.slice(cut + 1);
    }
    if (Date.now() - last > 300) {
      last = Date.now();
      post({ status: 'Gravando ' + nome + '... ' + mb(bytes) + (total ? ' / ' + mb(total) + ' (' + Math.round(bytes / total * 100) + '%)' : '') });
    }
  }
  buf += dec.decode();
  if (buf) await put(buf);
  buf = dec = rd = next = file = fr = src = null;   // solta tudo do download

  var tx = db.transaction('listas', 'readwrite', RW);
  tx.objectStore('listas').put({ nome: nome, origem: origem, bytes: bytes, blocos_crus: n, data: Date.now(), processada: false });
  await txDone(tx);
  post({ status: 'Lista crua gravada: ' + mb(bytes) + ' em ' + n + ' blocos.' });
}

/* ================= 2) processar lista crua → conteudos / busca / series ================= */
var SE_RE = /^(.*?)[\s._\-|]*S(\d{1,3})[\s._]*E(\d{1,4})/i;
var MOVIE_G = /filme|movie|vod|cinema|lancamento/;
var SERIE_G = /serie|novela|temporada|anime|desenho/;
var VID_RE = /\.(mp4|mkv|avi)(\?|$)/i;
var TABNL = /[\t\n\r]/g;
function attr(line, key) {
  var i = line.indexOf(key); if (i < 0) return '';
  var s = i + key.length, e = line.indexOf('"', s);
  return e < 0 ? '' : line.slice(s, e);
}
function limpa(s) { return s.indexOf('\t') >= 0 || s.indexOf('\r') >= 0 ? s.replace(TABNL, ' ') : s; }

async function processar(lista) {
  if (!db) db = await open();
  var meta = await req(db.transaction('listas').objectStore('listas').get(lista));
  if (!meta) throw new Error('Lista não encontrada: ' + lista);
  var t0 = Date.now(), tLer = 0, tProc = 0, tGravar = 0, bytesGrav = 0;

  var itens = [[], [], []], linhas = [[], [], []], nb = [0, 0, 0], cnt = [0, 0, 0];
  // dicionários
  var gIdx = [new Map(), new Map(), new Map()], gArr = [[], [], []];   // grupo → id (por tipo)
  var ginfo = new Map();                                               // grupo → classificação (1x por grupo)
  var bIdx = new Map(), bArr = [];                                     // base da url → id
  var sIdx = new Map(), sArr = [];                                     // série → id
  var pend = null;                                                     // 1 gravação em andamento

  async function flush(t) {
    if (!itens[t].length) return;
    var k = [lista, t, nb[t]++], a = itens[t].join('\n'), b = t < 2 ? linhas[t].join('\n') : null;
    itens[t] = []; linhas[t] = [];
    bytesGrav += a.length + (b ? b.length : 0);
    if (pend) { var w = Date.now(); await pend; tGravar += Date.now() - w; }
    var tx = db.transaction(['conteudos', 'busca'], 'readwrite', RW);   // sobrescreve (put): sem apagar antes
    tx.objectStore('conteudos').put(a, k);
    if (b !== null) tx.objectStore('busca').put(b, k);
    pend = txDone(tx);
  }
  function add(inf, url) {
    var q = inf.lastIndexOf('"'), c = inf.indexOf(',', q < 0 ? 8 : q);
    var nome = c >= 0 ? inf.slice(c + 1).trim() : '';
    if (!nome) nome = attr(inf, 'tvg-name="') || url;
    nome = limpa(nome);
    var grupo = attr(inf, 'group-title="') || 'Sem grupo';
    var gi = ginfo.get(grupo);
    if (!gi) { var gk = norm(grupo); ginfo.set(grupo, gi = { g: limpa(grupo), s: SERIE_G.test(gk), m: MOVIE_G.test(gk) }); }
    var t, se = null;
    if (url.indexOf('/movie/') > 0) t = 1;
    else if (url.indexOf('/series/') > 0) t = 2;
    else if (gi.s || (se = SE_RE.exec(nome))) t = 2;
    else t = gi.m || VID_RE.test(url) ? 1 : 0;

    var gid = gIdx[t].get(gi.g);
    if (gid === undefined) { gid = gArr[t].length; gIdx[t].set(gi.g, gid); gArr[t].push([gi.g, 0]); }
    gArr[t][gid][1]++;
    var cut = url.lastIndexOf('/') + 1, base = url.slice(0, cut), bid = bIdx.get(base);
    if (bid === undefined) { bid = bArr.length; bIdx.set(base, bid); bArr.push(base); }
    var logo = attr(inf, 'tvg-logo="');
    var pre = nome + '\t' + gid + '\t' + bid + '\t' + url.slice(cut) + '\t';
    var pos = '\t' + attr(inf, 'tvg-id="') + '\t' + attr(inf, 'xui-id="');

    if (t === 2) {
      if (!se) se = SE_RE.exec(nome);
      var sn = se ? (se[1].trim() || nome) : nome, sid = sIdx.get(sn), s;
      if (sid === undefined) { sid = sArr.length; sIdx.set(sn, sid); sArr.push(s = [sn, gid, logo, 0, [], norm(sn)]); }
      else s = sArr[sid];
      s[3]++;
      if (s[4][s[4].length - 1] !== nb[2]) s[4].push(nb[2]);
      itens[2].push(pre + (logo === s[2] ? '' : logo) + pos + '\t' + sid + '\t' + (se ? +se[2] : 0) + '\t' + (se ? +se[3] : 0));
    } else {
      itens[t].push(pre + logo + pos);
      linhas[t].push(norm(nome) + '\t' + gid);
    }
    cnt[t]++;
    return t;
  }
  function lerBruto(i) { return req(db.transaction(lista).objectStore(lista).get(i)); }

  var prox = meta.blocos_crus ? lerBruto(0) : null;
  for (var i = 0; i < meta.blocos_crus; i++) {
    var w = Date.now();
    var s = await prox;
    tLer += Date.now() - w;
    prox = i + 1 < meta.blocos_crus ? lerBruto(i + 1) : null;   // pede o próximo enquanto processa este
    var p0 = Date.now(), p = 0, L = s.length, inf = null;
    while (p < L) {
      var e = s.indexOf('\n', p); if (e < 0) e = L;
      var line = s.slice(p, e).trim(); p = e + 1;
      if (!line) continue;
      if (line.charCodeAt(0) === 35) { if (line.lastIndexOf('#EXTINF', 0) === 0) inf = line; continue; }
      if (!inf) continue;
      var t = add(inf, line); inf = null;
      if (itens[t].length >= BLOCO) { tProc += Date.now() - p0; await flush(t); p0 = Date.now(); }
    }
    tProc += Date.now() - p0;
    s = null;
    post({ status: 'Processando ' + lista + '... bloco ' + (i + 1) + '/' + meta.blocos_crus });
  }
  await flush(0); await flush(1); await flush(2);
  if (pend) { var w2 = Date.now(); await pend; tGravar += Date.now() - w2; pend = null; }

  // séries + limpeza só das sobras de um processamento anterior
  var tF = Date.now(), nsb = 0;
  var txs = db.transaction(['series', 'conteudos', 'busca'], 'readwrite', RW);
  var ss = txs.objectStore('series'), cs = txs.objectStore('conteudos'), bs = txs.objectStore('busca');
  for (var j = 0; j < sArr.length; j += BLOCO) ss.put(sArr.slice(j, j + BLOCO), [lista, nsb++]);
  ss.delete(IDBKeyRange.bound([lista, nsb], [lista, Infinity]));
  for (var tt = 0; tt < 3; tt++) {
    cs.delete(IDBKeyRange.bound([lista, tt, nb[tt]], [lista, tt, Infinity]));
    bs.delete(IDBKeyRange.bound([lista, tt, tt < 2 ? nb[tt] : 0], [lista, tt, Infinity]));
  }
  await txDone(txs);

  meta.processada = true; meta.formato = 3; meta.total = cnt; meta.series = sArr.length;
  meta.blocos = nb; meta.blocos_series = nsb; meta.grupos = gArr; meta.bases = bArr;
  sArr = sIdx = gIdx = bIdx = ginfo = itens = linhas = null;
  var tx2 = db.transaction('listas', 'readwrite', RW); tx2.objectStore('listas').put(meta); await txDone(tx2);
  tF = Date.now() - tF;
  post({ status: 'Processada em ' + ((Date.now() - t0) / 1000).toFixed(1) + 's: ' + cnt[0].toLocaleString() + ' ao vivo, ' +
    cnt[1].toLocaleString() + ' filmes, ' + cnt[2].toLocaleString() + ' episódios (' + meta.series.toLocaleString() + ' séries)' +
    '\nTempo: processamento ' + (tProc / 1000).toFixed(1) + 's · espera leitura ' + (tLer / 1000).toFixed(1) +
    's · espera gravação ' + (tGravar / 1000).toFixed(1) + 's · finalização ' + (tF / 1000).toFixed(1) + 's · gravado ' + mb(bytesGrav * 2) });
}

/* ================= 3) excluir lista ================= */
async function excluir(lista) {
  if (!db) db = await open();
  var tx = db.transaction(['conteudos', 'busca', 'series', 'listas'], 'readwrite', RW);
  tx.objectStore('conteudos').delete(faixa(lista));
  tx.objectStore('busca').delete(faixa(lista));
  tx.objectStore('series').delete(faixa(lista));
  tx.objectStore('listas').delete(lista);
  await txDone(tx);
  await alterarSchema(null, lista);
  post({ status: 'Lista ' + lista + ' excluída.' });
}

self.onmessage = async function (ev) {
  var m = ev.data;
  try {
    if (m.cmd === 'importar') { await importar(m.src, m.nome); await processar(m.nome); }
    else if (m.cmd === 'processar') await processar(m.nome);
    else if (m.cmd === 'excluir') await excluir(m.nome);
    if (db) db.close(); db = null;
    post({ fim: true });
  } catch (e) {
    if (db) db.close(); db = null;
    post({ erro: String(e && e.message || e) });
  }
};
</script>

<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };
(0, eval)($('shared-src').textContent);        // norm() comum com o worker
var DBN = 'iptv_db', LIMIT = 200, FORMATO = 3;
var db = null, lista = '', meta = null, curType = 0, cur = [], curKind = 'item', busy = false, token = 0, st = null;

/* ---------- utilidades ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function status(m) { $('status').textContent = m; }
function mb(n) { return (n / 1048576).toFixed(1) + ' MB'; }
function req(r) { return new Promise(function (ok, ko) { r.onsuccess = function () { ok(r.result); }; r.onerror = function () { ko(r.error); }; }); }
function nomeTabela(s) { s = norm(s).replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); return 'lista_' + (s || 'sem_nome'); }
function heap() { return performance.memory ? mb(performance.memory.usedJSHeapSize) : null; }

// linha do bloco → objeto legível (resolve os dicionários)
function item(l, t, serie) {
  var c = l.split('\t');
  var o = { nome: c[0], grupo: meta.grupos[t][+c[1]][0], url: meta.bases[+c[2]] + c[3], logo: c[4], tvg_id: c[5], xui_id: c[6] };
  if (t === 2) { o.temporada = +c[8]; o.episodio = +c[9]; if (!o.logo && serie) o.logo = serie[2]; }
  return o;
}

/* ---------- banco (thread principal: só leitura) ---------- */
function getDB() {
  if (db) return Promise.resolve(db);
  return new Promise(function (ok, ko) {
    var r = indexedDB.open(DBN);
    r.onupgradeneeded = function () {
      var d = r.result;
      if (!d.objectStoreNames.contains('listas')) d.createObjectStore('listas', { keyPath: 'nome' });
      ['conteudos', 'busca', 'series'].forEach(function (n) { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); });
    };
    r.onsuccess = function () {
      db = r.result;
      db.onversionchange = function () { db.close(); db = null; };   // libera para o worker criar/apagar tabelas
      ok(db);
    };
    r.onerror = function () { ko(r.error); };
  });
}
async function get(store, key) { return req((await getDB()).transaction(store).objectStore(store).get(key)); }

/* ---------- worker: faz o pesado e é destruído no fim ---------- */
function rodarWorker(msg) {
  if (busy) return; busy = true; setBusy(true);
  if (db) { db.close(); db = null; }
  var antes = heap();
  var url = URL.createObjectURL(new Blob([$('shared-src').textContent, '\n', $('worker-src').textContent], { type: 'text/javascript' }));
  var w = new Worker(url);
  function fim(txt) {
    w.terminate(); w = null;             // encerra o worker: toda a RAM dele é liberada
    URL.revokeObjectURL(url); url = null;
    msg = null;
    $('file').value = '';                // solta a referência ao arquivo escolhido
    busy = false; setBusy(false);
    carregarListas().then(function () {
      status(txt + '\nWorker encerrado — memória do download/processamento liberada.' +
        (antes ? ' Heap da página: ' + antes + ' antes → ' + heap() + ' agora.' : ''));
    });
  }
  w.onmessage = function (e) {
    var d = e.data;
    if (d.status) status(d.status);
    else if (d.erro) fim('Erro: ' + d.erro + '\n(Se for URL: verifique CORS ou use o botão de arquivo.)');
    else if (d.fim) fim($('status').textContent);
  };
  w.onerror = function (e) { fim('Erro no worker: ' + e.message); };
  w.postMessage(msg);
}
function setBusy(b) { ['btnUrl', 'btnProc', 'btnDel', 'file'].forEach(function (id) { $(id).disabled = b; }); }

/* ---------- listas ---------- */
async function carregarListas() {
  var todas = await req((await getDB()).transaction('listas').objectStore('listas').getAll());
  if (!todas.some(function (l) { return l.nome === lista; })) lista = todas.length ? todas[0].nome : '';
  var h = todas.length ? '' : '<option value="">(nenhuma lista)</option>';
  meta = null;
  todas.forEach(function (l) {
    if (l.nome === lista) meta = l;
    h += '<option value="' + esc(l.nome) + '"' + (l.nome === lista ? ' selected' : '') + '>' + esc(l.nome) + ' — ' + mb(l.bytes) +
      (l.processada ? ' — ' + l.total[0] + ' ao vivo / ' + l.total[1] + ' filmes / ' + l.series + ' séries' : ' — não processada') + '</option>';
  });
  todas = null;
  $('lista').innerHTML = h;
  loadGroups(); await search();
}

function loadGroups() {
  var h = '<option value="">Todos os grupos</option>';
  if (meta && meta.formato === FORMATO) {
    var gs = meta.grupos[curType].map(function (g, id) { return [g[0], g[1], id]; });
    gs.sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; });
    for (var i = 0; i < gs.length; i++) h += '<option value="' + gs[i][2] + '">' + esc(gs[i][0]) + ' (' + gs[i][1] + ')</option>';
  }
  $('grp').innerHTML = h;
}

/* ---------- consultas ---------- */
// Varre blocos em ordem, guardando posição (st) para "Carregar mais". token cancela buscas velhas.
async function search(more) {
  var my = ++token, t0 = performance.now();
  if (!more) st = { b: 0, i: 0 };
  if (!meta || !meta.processada) { render([], 'item', false); if (!busy) status(lista ? 'Lista não processada.' : 'Nenhuma lista. Cole uma URL ou escolha um arquivo.'); return; }
  if (meta.formato !== FORMATO) { render([], 'item', false); if (!busy) status('Lista no formato antigo: clique em Reprocessar.'); return; }
  var q = norm($('q').value.trim()), g = $('grp').value, out = [], t = curType;
  var series = t === 2, nb = series ? meta.blocos_series : meta.blocos[t];

  while (st.b < nb && out.length < LIMIT) {
    var i = st.i, n;
    if (series) {
      var sr = await get('series', [lista, st.b]); if (my !== token) return;
      for (n = sr.length; i < n && out.length < LIMIT; i++) {
        var s = sr[i];
        if ((!g || s[1] === +g) && (!q || s[5].indexOf(q) >= 0)) out.push({ s: s, id: st.b * 2000 + i });
      }
    } else if (!q && !g) {
      var rows = (await get('conteudos', [lista, t, st.b])).split('\n'); if (my !== token) return;
      for (n = rows.length; i < n && out.length < LIMIT; i++) out.push(item(rows[i], t));
    } else {
      var linhas = (await get('busca', [lista, t, st.b])).split('\n'), hits = []; if (my !== token) return;
      for (n = linhas.length; i < n && out.length + hits.length < LIMIT; i++) {
        var L = linhas[i], tab = L.indexOf('\t');
        if (g && L.slice(tab + 1) !== g) continue;
        if (q) { var k = L.indexOf(q); if (k < 0 || k + q.length > tab) continue; }
        hits.push(i);
      }
      linhas = null;
      if (hits.length) {
        var rw = (await get('conteudos', [lista, t, st.b])).split('\n'); if (my !== token) return;
        for (var j = 0; j < hits.length; j++) out.push(item(rw[hits[j]], t));
      }
    }
    if (i >= n) { st.b++; st.i = 0; } else st.i = i;
  }
  var tem = st.b < nb;
  render(out, series ? 'series' : 'item', tem, more);
  if (!busy) status(cur.length + (tem ? '+' : '') + ' resultados em ' + (performance.now() - t0).toFixed(0) + ' ms');
}

async function openSeries(s, pos) {
  var my = ++token, eps = [];
  // id da série = bloco * 2000 + posição; procuramos a coluna 7 == id
  var sid = String(pos), chave = '\t' + sid + '\t';
  for (var i = 0; i < s[4].length; i++) {
    var rows = (await get('conteudos', [lista, 2, s[4][i]])).split('\n'); if (my !== token) return;
    for (var j = 0; j < rows.length; j++) {
      if (rows[j].indexOf(chave) < 0) continue;
      var c = rows[j].split('\t');
      if (c[7] === sid) eps.push(item(rows[j], 2, s));
    }
  }
  eps.sort(function (a, b) { return a.temporada - b.temporada || a.episodio - b.episodio; });
  render(eps, 'ep', false);
  status(s[0] + ': ' + eps.length + ' episódios');
}

/* ---------- render ---------- */
function render(rows, kind, tem, append) {
  curKind = kind;
  if (!append) cur = [];
  var logos = $('logos').checked, base = cur.length, h = '';
  if (kind === 'ep') h += '<div class="it" tabindex="0" data-back="1">← Voltar</div>';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i], titulo, sub, logo;
    if (kind === 'series') { titulo = r.s[0]; sub = r.s[3] + ' episódios — ' + meta.grupos[2][r.s[1]][0]; logo = r.s[2]; }
    else { titulo = r.nome; sub = kind === 'ep' && r.temporada ? 'T' + r.temporada + ' E' + r.episodio : r.grupo; logo = r.logo; }
    var img = logos && logo ? '<img loading="lazy" src="' + esc(logo) + '" onerror="this.style.visibility=\'hidden\'">' : '';
    h += '<div class="it" tabindex="0" data-i="' + (base + i) + '">' + img + '<div>' + esc(titulo) + '<small>' + esc(sub) + '</small></div></div>';
  }
  cur = cur.concat(rows);
  if (tem) h += '<div class="it" id="more" tabindex="0" data-more="1">Carregar mais…</div>';
  var old = $('more'); if (old) old.remove();
  if (append) $('list').insertAdjacentHTML('beforeend', h); else $('list').innerHTML = h;
}

function activate(el) {
  if (!el) return;
  if (el.dataset.back) { search(); return; }
  if (el.dataset.more) { search(true); return; }
  var r = cur[+el.dataset.i]; if (!r) return;
  if (curKind === 'series') { openSeries(r.s, r.id); return; }
  $('player').style.display = 'block';
  $('vid').src = r.url;
  $('vlink').href = r.url; $('vlink').textContent = r.nome + ' — ' + r.url;
}
/* ---------- eventos ---------- */
$('list').addEventListener('click', function (e) { activate(e.target.closest('.it')); });
$('list').addEventListener('keydown', function (e) {
  var el = e.target.closest('.it'); if (!el) return;
  if (e.key === 'Enter') activate(el);
  else if (e.key === 'ArrowDown' && el.nextElementSibling) { el.nextElementSibling.focus(); e.preventDefault(); }
  else if (e.key === 'ArrowUp' && el.previousElementSibling) { el.previousElementSibling.focus(); e.preventDefault(); }
});
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
  b.onclick = function () {
    document.querySelector('.tab.on').classList.remove('on'); b.classList.add('on');
    curType = +b.dataset.t; loadGroups(); search();
  };
});
var deb;
$('q').oninput = function () { clearTimeout(deb); deb = setTimeout(search, 250); };
$('grp').onchange = function () { search(); };
$('lista').onchange = function () { lista = this.value; carregarListas(); };
$('logos').onchange = function () { search(); };

$('btnUrl').onclick = function () {
  var u = $('url').value.trim(); if (!u) return;
  var host; try { host = new URL(u).hostname; } catch (e) { status('URL inválida'); return; }
  lista = nomeTabela($('nome').value.trim() || host);
  rodarWorker({ cmd: 'importar', src: { url: u }, nome: lista });
};
$('file').onchange = function () {
  var f = this.files[0]; if (!f) return;
  lista = nomeTabela($('nome').value.trim() || f.name.replace(/\.[^.]+$/, ''));
  rodarWorker({ cmd: 'importar', src: { file: f }, nome: lista });
};
$('btnProc').onclick = function () { if (lista) rodarWorker({ cmd: 'processar', nome: lista }); };
$('btnDel').onclick = function () {
  if (lista && confirm('Excluir ' + lista + ' (tabela crua e conteúdos)?')) rodarWorker({ cmd: 'excluir', nome: lista });
};
$('btnClose').onclick = function () { var v = $('vid'); v.pause(); v.removeAttribute('src'); v.load(); $('player').style.display = 'none'; };

(async function () {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  await carregarListas();
})();
</script>
</body>
