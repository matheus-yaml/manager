<!--
  ========================= ESQUEMA DO BANCO (IndexedDB "iptv_db") =========================

  listas                 catálogo — 1 linha por lista
    { nome, origem, bytes, blocos_crus, data, processada, formato: 6, comp,
      total:[aoVivo, filmes, episodios], series, blocos_series,
      blocos: [ [blocos crus com ao vivo], [..com filmes], [] ],
      grupos: [ [[grupo, qtd itens]...], [[grupo, qtd itens]...], [[grupo, qtd SÉRIES]...] ] }

  lista_<nome_servidor>  UMA TABELA POR SERVIDOR com a m3u CRUA
    chave 0..n-1 → bytes UTF-8 exatamente como vieram do servidor (~1 MB, cortados antes de "#EXTINF")
    concatenar os blocos em ordem = arquivo original, byte a byte

  conteudos              TABELA ESTRUTURADA de AO VIVO e FILMES
    chave [lista, tipo, nº do bloco cru]   tipo: 0 ao vivo | 1 filme
    valor: bytes UTF-8 (ou deflate, se "compactar") de um texto:
      1ª linha: dicionário do bloco em JSON  {"g":[grupos], "b":[bases de url], "l":[bases de logo]}
      demais linhas (1 item por linha, colunas por TAB):
        0 nome | 1 id_grupo | 2 id_base_url | 3 fim_url | 4 id_base_logo | 5 fim_logo | 6 tvg_id | 7 xui_id

  busca                  índice de busca de ao vivo/filmes, mesma chave, bytes UTF-8:
    1 linha por item, mesma posição da linha no bloco: "nome_normalizado\tgrupo"

  series                 TABELA ESTRUTURADA de SÉRIES
    chave [lista, bloco] → array de [nome, grupo, logo, qtd_episodios, [blocos crus onde estão], nome_normalizado]

  EPISÓDIOS SOB DEMANDA: episódios são ~93% da lista e quase nunca são todos abertos. Na importação
  eles só são contados e ligados à série (qual bloco cru contém cada série). Ao abrir uma série,
  a página lê só esses 1-2 blocos crus e interpreta ali os episódios dela (dezenas de ms).

  FLUXO DA IMPORTAÇÃO: o download NUNCA espera os workers. Cada bloco é gravado cru; se houver
  worker livre, os bytes vão direto para ele (transferência sem cópia); se não, o bloco é processado
  depois do download, lido do banco. No fim todos os workers são encerrados (terminate).
-->

<script id="shared-src">
// ---- código comum (workers + página) ----
var DBN = 'iptv_db', RW = { durability: 'relaxed' };
var ACC = { 'à':'a','á':'a','â':'a','ã':'a','ä':'a','å':'a','è':'e','é':'e','ê':'e','ë':'e','ì':'i','í':'i','î':'i','ï':'i',
  'ò':'o','ó':'o','ô':'o','õ':'o','ö':'o','ù':'u','ú':'u','û':'u','ü':'u','ç':'c','ñ':'n','ý':'y','ÿ':'y' };
var ACC_RE = /[àáâãäåèéêëìíîïòóôõöùúûüçñýÿ]/g, NON_ASCII = /[^\x00-\x7f]/;
function accRep(c) { return ACC[c]; }
function norm(s) {                        // minúsculas sem acento (tabela direta: mais barato que normalize NFD)
  s = s.toLowerCase();
  return NON_ASCII.test(s) ? s.replace(ACC_RE, accRep) : s;
}
function req(r) { return new Promise(function (ok, ko) { r.onsuccess = function () { ok(r.result); }; r.onerror = function () { ko(r.error); }; }); }
function txDone(tx) { return new Promise(function (ok, ko) { tx.oncomplete = ok; tx.onerror = tx.onabort = function () { ko(tx.error); }; }); }
function mb(n) { return (n / 1048576).toFixed(1) + ' MB'; }
function seg(ms) { return (ms / 1000).toFixed(1) + 's'; }

// texto <-> bytes (UTF-8 evita o navegador gravar 2 bytes/caractere quando há emoji no texto)
var TD = new TextDecoder(), TE = new TextEncoder();
function texto(v) { return typeof v === 'string' ? v : TD.decode(v); }
var TEM_COMP = typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined';
function compactar(s) {
  return new Response(new Blob([s]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer();
}
function lerValor(v, comp) {
  if (typeof v === 'string' || !comp) return Promise.resolve(texto(v));
  return new Response(new Blob([v]).stream().pipeThrough(new DecompressionStream('deflate'))).text();
}

// ---- lista crua: blocos no banco (bytes) OU num arquivo OPFS com índice {o: posição, l: tamanho} no banco ----
var TEM_OPFS = typeof navigator !== 'undefined' && !!(navigator.storage && navigator.storage.getDirectory) &&
  typeof FileSystemFileHandle !== 'undefined';
// arquivo OPFS da lista crua; cada importação ("geração") tem o seu — a antiga é apagada depois, em segundo plano
function arqCru(lista, gen) { return gen ? lista + '.' + gen + '.m3u' : lista + '.m3u'; }
var GEN = 1e6;                                   // chaves da geração g: g*1e6 ... g*1e6 + 999999
// pasta OPFS ou null se o navegador não permitir (ex.: página aberta por content:// ou file:// → SecurityError)
async function raizOPFS() {
  if (!TEM_OPFS) return null;
  try { return await navigator.storage.getDirectory(); } catch (e) { return null; }
}
async function arquivoCru(nomeArq) {
  var root = await raizOPFS();
  if (!root) throw new Error('Lista crua está em arquivo (OPFS), mas o navegador não permite acesso a arquivos aqui. Baixe a lista de novo.');
  return (await root.getFileHandle(nomeArq)).getFile();
}
// devolve os bytes do bloco cru i (cache = {} opcional para reaproveitar o File entre leituras)
async function lerCru(db, lista, i, cache) {
  var v = await req(db.transaction(lista).objectStore(lista).get(i));
  if (v && v.g !== undefined) {                 // modo banco em GRUPOS: bloco i está dentro do valor 'g<n>'
    var gv = cache && cache.gk === v.g ? cache.gv : await req(db.transaction(lista).objectStore(lista).get('g' + v.g));
    if (cache) { cache.gk = v.g; cache.gv = gv; }
    return gv.subarray(v.o, v.o + v.l);
  }
  if (v && v.o !== undefined) {
    var fn = v.f || arqCru(lista);
    var f = cache && cache.fn === fn ? cache.f : await arquivoCru(fn);
    if (cache) { cache.f = f; cache.fn = fn; }
    return new Uint8Array(await f.slice(v.o, v.o + v.l).arrayBuffer());
  }
  return v;
}

// ---- interpretação de uma entrada M3U (mesmas regras na importação e ao abrir série) ----
var SE_RE = /S(\d{1,3})[\s._]*E(\d{1,4})/i, SEP_FIM = /[\s._\-|]+$/;
var MOVIE_G = /filme|movie|vod|cinema|lancamento/;
var SERIE_G = /serie|novela|temporada|anime|desenho/;
var VID_RE = /\.(mp4|mkv|avi)(\?|$)/i;
var TABNL = /[\t\n\r]/g;
function attr(line, key) {
  var i = line.indexOf(key); if (i < 0) return '';
  var s = i + key.length, e = line.indexOf('"', s);
  return e < 0 ? '' : line.slice(s, e);
}
function limpa(s) { return s.indexOf('\t') >= 0 || s.indexOf('\r') >= 0 ? s.replace(TABNL, ' ') : s; }
function nomeDe(inf, url) {
  var q = inf.lastIndexOf('"'), c = inf.indexOf(',', q < 0 ? 8 : q);
  var n = c >= 0 ? inf.slice(c + 1).trim() : '';
  return limpa(n || attr(inf, 'tvg-name="') || url);
}
// nome da série a partir do nome do episódio: tudo antes de "S01E02"
function serieDe(nome, se) { return se ? (nome.slice(0, se.index).replace(SEP_FIM, '').trim() || nome) : nome; }
// info do grupo em cache (classificação calculada 1x por grupo)
function infoGrupo(cache, grupo) {
  var gi = cache.get(grupo);
  if (!gi) { var gk = norm(grupo); cache.set(grupo, gi = { g: limpa(grupo), s: SERIE_G.test(gk), m: MOVIE_G.test(gk) }); }
  return gi;
}
// tipo: 0 ao vivo | 1 filme | 2 episódio. Devolve {t, gi, se} (gi/se só quando precisou calcular)
function classifica(cache, inf, url, nome) {
  if (url.indexOf('/series/') > 0) return { t: 2, gi: null, se: null };        // caminho rápido: sem ler grupo
  if (url.indexOf('/movie/') > 0) return { t: 1, gi: null, se: null };
  var gi = infoGrupo(cache, attr(inf, 'group-title="') || 'Sem grupo'), se = null;
  if (gi.s || (se = SE_RE.exec(nome))) return { t: 2, gi: gi, se: se };
  return { t: gi.m || VID_RE.test(url) ? 1 : 0, gi: gi, se: null };
}
// percorre as entradas de um texto M3U: fn(inf, url)
function cadaEntrada(s, fn) {
  var p = 0, L = s.length, inf = null;
  while (p < L) {
    var e = s.indexOf('\n', p); if (e < 0) e = L;
    var b = e; if (b > p && s.charCodeAt(b - 1) === 13) b--;
    if (b > p) {
      if (s.charCodeAt(p) === 35) { if (s.startsWith('#EXTINF', p)) inf = s.slice(p, b); }
      else if (inf) { var url = s.slice(p, b).trim(); if (url) { fn(inf, url); inf = null; } }
    }
    p = e + 1;
  }
}
</script>

<!-- ======================= worker de PARSE (N cópias em paralelo) ======================= -->
<script id="parser-src" type="text/plain">
'use strict';
var db = null, cache = new Map(), cacheArq = {};
function abrir() {
  return new Promise(function (ok, ko) { var r = indexedDB.open(DBN); r.onsuccess = function () { ok(r.result); }; r.onerror = function () { ko(r.error); }; });
}
function novoDic() { return { m: { g: new Map(), b: new Map(), l: new Map() }, a: { g: [], b: [], l: [] }, u: { g: null, b: null, l: null }, ui: { g: 0, b: 0, l: 0 } }; }
function id(d, k, v) {
  if (v === d.u[k]) return d.ui[k];                        // igual ao anterior: sem Map
  var x = d.m[k].get(v);
  if (x === undefined) { x = d.a[k].length; d.m[k].set(v, x); d.a[k].push(v); }
  d.u[k] = v; d.ui[k] = x; return x;
}

async function bloco(lista, i, bytes, comp) {
  var T = Date.now(), tl = 0;
  if (bytes == null) { bytes = await lerCru(db, lista, i, cacheArq); tl = Date.now() - T; T = Date.now(); }
  var s = texto(bytes); bytes = null;

  var rows = [[], []], busca = [[], []], cnt = [0, 0, 0], dic = [novoDic(), novoDic()];
  var grupos = [new Map(), new Map()], series = new Map(), ultS = null, ultR = null;
  cadaEntrada(s, function (inf, url) {
    var nome = nomeDe(inf, url), c = classifica(cache, inf, url, nome), t = c.t;
    cnt[t]++;
    if (t === 2) {                                   // EPISÓDIO: só identifica a série e conta
      var sn = serieDe(nome, c.se || SE_RE.exec(nome));
      var r = sn === ultS ? ultR : series.get(sn);
      if (!r) {                                      // 1º episódio da série neste bloco: pega grupo e logo
        var g = c.gi ? c.gi.g : infoGrupo(cache, attr(inf, 'group-title="') || 'Sem grupo').g;
        series.set(sn, r = [sn, g, attr(inf, 'tvg-logo="'), 0]);
      }
      r[3]++; ultS = sn; ultR = r;
      return;
    }
    var gi = c.gi || infoGrupo(cache, attr(inf, 'group-title="') || 'Sem grupo'), d = dic[t];
    var cu = url.lastIndexOf('/') + 1, logo = attr(inf, 'tvg-logo="'), li = '', ls = '';
    if (logo) { var cl = logo.lastIndexOf('/') + 1; li = id(d, 'l', logo.slice(0, cl)); ls = logo.slice(cl); }
    rows[t].push(nome + '\t' + id(d, 'g', gi.g) + '\t' + id(d, 'b', url.slice(0, cu)) + '\t' + url.slice(cu) + '\t' +
                 li + '\t' + ls + '\t' + attr(inf, 'tvg-id="') + '\t' + attr(inf, 'xui-id="'));
    busca[t].push(norm(nome) + '\t' + gi.g);
    var gm = grupos[t]; gm.set(gi.g, (gm.get(gi.g) || 0) + 1);
  });
  s = null;
  var tp = Date.now() - T; T = Date.now();

  var val = [null, null], bus = [null, null], nbytes = 0;
  for (var k = 0; k < 2; k++) {
    if (!cnt[k]) continue;
    var txt = JSON.stringify({ g: dic[k].a.g, b: dic[k].a.b, l: dic[k].a.l }) + '\n' + rows[k].join('\n');
    val[k] = comp ? await compactar(txt) : TE.encode(txt);
    bus[k] = TE.encode(busca[k].join('\n'));
    nbytes += val[k].byteLength + bus[k].byteLength;
  }
  rows = busca = dic = null;
  var tc = Date.now() - T; T = Date.now();

  // NÃO grava aqui: devolve ao coordenador, que grava tudo numa transação só no fim (poucos MB no total)
  return {
    i: i, cnt: cnt, bytes: nbytes, tl: tl, tp: tp, tc: tc, tw: 0, val: val, bus: bus,
    grupos: grupos.map(function (g) { return Array.from(g.entries()); }),
    series: Array.from(series.values())
  };
}

self.onmessage = async function (ev) {
  var m = ev.data;
  try {
    if (!db) db = await abrir();
    var r = await bloco(m.lista, m.i, m.bytes, m.comp);
    m = null;
    var tr = [];                                      // transfere os buffers (sem cópia)
    [r.val[0], r.val[1], r.bus[0], r.bus[1]].forEach(function (x) { if (x) tr.push(x.buffer || x); });
    self.postMessage(r, tr);
  } catch (e) {
    self.postMessage({ erro: String(e && e.message || e) });
  }
};
</script>

<!-- ======================= worker COORDENADOR ======================= -->
<script id="worker-src" type="text/plain">
'use strict';
var CH = 1 << 20, BLOCO = 2000;
var criar = null, apagar = null, db = null, ultimaCalib = null, genEmCurso = 0, lixoEmCurso = [];
function post(m) { self.postMessage(m); }
function faixa(lista) { return IDBKeyRange.bound([lista], [lista, []]); }   // todas as chaves [lista, ...]

function baseSchema(d) {
  if (!d.objectStoreNames.contains('listas')) d.createObjectStore('listas', { keyPath: 'nome' });
  ['conteudos', 'busca', 'series'].forEach(function (n) { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); });
}
function open(v) {
  return new Promise(function (ok, ko) {
    var r = v ? indexedDB.open(DBN, v) : indexedDB.open(DBN);
    r.onupgradeneeded = function () {
      var d = r.result; baseSchema(d);
      if (criar && !d.objectStoreNames.contains(criar)) d.createObjectStore(criar);
      if (apagar && d.objectStoreNames.contains(apagar)) d.deleteObjectStore(apagar);
    };
    r.onblocked = function () { post({ status: 'Aguardando o banco ser liberado...' }); };
    r.onsuccess = function () { ok(r.result); };
    r.onerror = function () { ko(r.error); };
  });
}
async function alterarSchema(nomeCriar, nomeApagar) {           // criar/apagar tabela exige subir a versão
  if (db) db.close();
  db = await open();
  var precisa = (nomeCriar && !db.objectStoreNames.contains(nomeCriar)) ||
                (nomeApagar && db.objectStoreNames.contains(nomeApagar));
  if (!precisa) return;
  var v = db.version + 1; db.close();
  criar = nomeCriar; apagar = nomeApagar;
  db = await open(v);
  criar = apagar = null;
}

/* ---------- calibração: mede o disco DESTE aparelho (banco x arquivo) ---------- */
async function calibrar() {
  var MBS = 8, r = { v: 2, idb: {}, opfs: 0 }, t, i;
  var blk = new Uint8Array(CH * 8);
  for (i = 0; i < blk.length; i++) blk[i] = 65 + (i % 26);
  post({ status: 'Medindo o disco deste aparelho (uma vez só)...' });
  await alterarSchema('__calib', null);
  // banco: grava 8 MB em gravações de 1, 4 e 8 MB (até 2 em andamento), como na importação
  var tams = [1, 4, 8];
  for (var q = 0; q < tams.length; q++) {
    var G = tams[q], voando = [];
    t = Date.now();
    for (i = 0; i < MBS / G; i++) {
      var tx = db.transaction('__calib', 'readwrite', RW); tx.objectStore('__calib').put(blk.slice(0, G * CH), q * 100 + i);
      voando.push(txDone(tx)); if (voando.length >= 2) await voando.shift();
    }
    await Promise.all(voando);
    r.idb[G] = MBS / Math.max(0.001, (Date.now() - t) / 1000);
  }
  await alterarSchema(null, '__calib');
  // arquivo: escrita sequencial + 1 flush no fim
  var root = await raizOPFS();
  if (root) {
    try {
      var fh = await root.getFileHandle('__calib.bin', { create: true });
      var h = await fh.createSyncAccessHandle();
      t = Date.now();
      h.truncate(0);
      for (i = 0; i < MBS; i++) h.write(blk.subarray(0, CH), { at: i * CH });
      h.flush(); h.close();
      r.opfs = MBS / Math.max(0.001, (Date.now() - t) / 1000);
      await root.removeEntry('__calib.bin');
    } catch (e) { r.opfs = 0; }
  }
  r.grupo = 1;
  for (q = 0; q < tams.length; q++) if (r.idb[tams[q]] > r.idb[r.grupo] * 1.1) r.grupo = tams[q];   // maior só se ganhar >10%
  r.melhor = r.opfs > r.idb[r.grupo] ? 'opfs' : 'idb';
  ultimaCalib = r;
  post({ calib: r });
  return r;
}
function textoCalib(r) {
  return 'Disco deste aparelho: banco ' + [1, 4, 8].map(function (g) { return g + ' MB/gravação ' + r.idb[g].toFixed(1) + ' MB/s'; }).join(', ') +
    ' · arquivo ' + (r.opfs ? r.opfs.toFixed(1) + ' MB/s' : 'indisponível') +
    ' → usando ' + (r.melhor === 'opfs' ? 'arquivo (OPFS)' : 'banco com ' + r.grupo + ' MB por gravação');
}

/* ---------- pool de workers de parse ---------- */
function criarPool(N, src, lista, comp, onRes) {
  var url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  var FILA_MAX = 3;                                   // blocos esperando na memória (~1 MB cada)
  var ws = [], livres = [], esperando = [], filaBlocos = [], ativos = 0, erro = null, aoFim = null;
  function solta(w) {
    if (filaBlocos.length) { var b = filaBlocos.shift(); manda(w, b[0], b[1]); }   // 1º: blocos na fila de memória
    else if (esperando.length) esperando.shift()(w);
    else { livres.push(w); if (!ativos && aoFim) aoFim(); }
  }
  function manda(w, i, bytes) {
    ativos++;
    if (bytes) w.postMessage({ lista: lista, i: i, bytes: bytes, comp: comp }, [bytes.buffer]);   // transfere, sem copiar
    else w.postMessage({ lista: lista, i: i, bytes: null, comp: comp });
  }
  for (var k = 0; k < N; k++) {
    var w = new Worker(url);
    w.onmessage = function (e) {
      ativos--;
      if (e.data.erro) erro = erro || new Error(e.data.erro); else onRes(e.data);
      solta(this);
    };
    w.onerror = function (e) { ativos--; erro = erro || new Error('parser: ' + e.message); solta(this); };
    ws.push(w); livres.push(w);
  }
  return {
    // NÃO espera: worker livre → manda; senão entra na fila de memória (até FILA_MAX);
    // fila cheia → devolve false (o bloco fica para depois, lido do banco)
    tentar: function (i, bytes) {
      if (erro) throw erro;
      if (livres.length) { manda(livres.pop(), i, bytes); return true; }
      if (filaBlocos.length < FILA_MAX) { filaBlocos.push([i, bytes]); return true; }

    // espera um worker livre (usado depois do download e no reprocessamento)

/* ---------- acumulador dos resumos ---------- */
function novoAcc() {
  return { cnt: [0, 0, 0], blocos: [[], [], []], grupos: [new Map(), new Map(), new Map()], series: new Map(),
           feitos: 0, tl: 0, tp: 0, tc: 0, tw: 0, bytes: 0, estr: [] };
}
function junta(acc, d) {
  acc.feitos++; acc.tl += d.tl; acc.tp += d.tp; acc.tc += d.tc; acc.tw += d.tw; acc.bytes += d.bytes;
  for (var t = 0; t < 3; t++) acc.cnt[t] += d.cnt[t];
  for (t = 0; t < 2; t++) if (d.val[t]) acc.estr.push([t, d.i, d.val[t], d.bus[t]]);
  for (t = 0; t < 2; t++) {
    if (!d.cnt[t]) continue;
    acc.blocos[t].push(d.i);
    var gm = acc.grupos[t], ga = d.grupos[t];
    for (var j = 0; j < ga.length; j++) gm.set(ga[j][0], (gm.get(ga[j][0]) || 0) + ga[j][1]);

    var s = d.series[k], x = acc.series.get(s[0]);

      acc.grupos[2].set(s[1], (acc.grupos[2].get(s[1]) || 0) + 1);      // grupos de séries contam SÉRIES
    }

// grava séries, apaga sobras de processamentos anteriores e salva o catálogo

  var arr = Array.from(acc.series.values()); acc.series = null;
  arr.sort(porNome);
  arr.forEach(function (s) { s[4].sort(num); });
  var nsb = 0, tx = db.transaction(['series', 'conteudos', 'busca', 'listas'], 'readwrite', RW);
  var ss = tx.objectStore('series');

  ss.delete(IDBKeyRange.bound([lista, nsb], [lista, Infinity]));

  var cs = tx.objectStore('conteudos'), bs = tx.objectStore('busca');
  cs.delete(faixa(lista)); bs.delete(faixa(lista));

    var x = acc.estr[e], key = [lista, x[0], x[1]];

  meta.blocos = acc.blocos.map(function (b) { return b.sort(num); });

function resumo(meta, acc, N, comp, tF) {

    ' episódios (' + meta.series.toLocaleString() + ' séries) — ' + N + ' workers, ' + (comp ? 'compactado' : 'sem compactação') +
    '\nSoma nos workers: ' + (acc.tl ? 'leitura ' + seg(acc.tl) + ' · ' : '') + 'interpretação ' + seg(acc.tp) +
    ' · ' + (comp ? 'compactação ' : 'codificação ') + seg(acc.tc) + ' · gravação final do estruturado ' + seg(tF) +

/* --- procura o último "\n#EXTINF" em bytes, até a posição lim --- */
function corte(buf, usado, lim) {
  function ok(i) { return buf[i] === 10 && buf[i + 1] === 35 && buf[i + 2] === 69 && buf[i + 3] === 88 && buf[i + 4] === 84 && buf[i + 5] === 73 && buf[i + 6] === 78 && buf[i + 7] === 70; }
  var i;
  for (i = Math.min(lim, usado - 8); i > 0; i--) if (ok(i)) return i;
  for (i = lim; i < usado - 8; i++) if (ok(i)) return i;
  return -1;
}

/* ================= 1) baixar → gravar cru + processar, com download em PARTES PARALELAS ================= */
// Cada "segmento" é uma faixa de bytes da lista baixada por uma conexão própria. Blocos de cada segmento
// recebem chaves k*BASE + j; a "costura" entre segmentos (fim do k + começo do k+1) recebe k*BASE + BASE-1.
// Ordenando as chaves, a concatenação dos blocos é exatamente o arquivo original.
var BASE = 100000;
function primeiroCorte(buf, usado) {               // 1º "\n#EXTINF" do buffer
  for (var i = 0; i < usado - 8; i++)
    if (buf[i] === 10 && buf[i + 1] === 35 && buf[i + 2] === 69 && buf[i + 3] === 88 && buf[i + 4] === 84 && buf[i + 5] === 73 && buf[i + 6] === 78 && buf[i + 7] === 70) return i;
  return -1;
}
function junta2(a, b) { var r = new Uint8Array(a.length + b.length); r.set(a); r.set(b, a.length); return r; }

async function importar(m) {

    txa.objectStore('listas').delete(nome);

      (total ? ' / ' + mb(total) + ' (' + Math.round(bytes / total * 100) + '%)' : '') +
      ' — processados ' + acc.feitos + ', na fila ' + pool.naFila() + ', para depois ' + depois.length + (acc.previaPronta ? ' — canais já disponíveis' : '') });

    (acc.previaEm ? ' — canais disponíveis em ' + seg(acc.previaEm - t0) : '') + '\n' +

    resumo(meta, acc, N, comp, tF);

// prévia: grava o que já foi processado (ao vivo/filmes) para a lista ser usada antes do fim do download
async function gravarPrevia(nome, origem, acc, comp, modo) {
  var estr = acc.estr.slice();
  var tx = db.transaction(['conteudos', 'busca', 'listas'], 'readwrite', RW);
  var cs = tx.objectStore('conteudos'), bs = tx.objectStore('busca');
  cs.delete(faixa(nome)); bs.delete(faixa(nome));
  for (var e = 0; e < estr.length; e++) { var x = estr[e], key = [nome, x[0], x[1]]; cs.put(x[2], key); bs.put(x[3], key); }
  tx.objectStore('listas').put({
    nome: nome, origem: origem, bytes: 0, blocos_crus: 0, data: Date.now(), cru: modo, processada: true, parcial: true, gen: genEmCurso, lixo: lixoEmCurso,
    formato: 6, comp: comp, total: acc.cnt.slice(), series: 0, blocos_series: 0,
    blocos: [estr.filter(function (x) { return x[0] === 0; }).map(function (x) { return x[1]; }).sort(num),
             estr.filter(function (x) { return x[0] === 1; }).map(function (x) { return x[1]; }).sort(num), []],

/* ================= 2) reprocessar a partir da tabela crua ================= */
async function processar(m) {
  if (!db) db = await open();
  var lista = m.nome, N = m.N, comp = m.comp && TEM_COMP;
  var meta = await req(db.transaction('listas').objectStore('listas').get(lista));
  if (!meta) throw new Error('Lista não encontrada: ' + lista);
  var t0 = Date.now(), n = meta.blocos_crus, acc = novoAcc();
  var pool = criarPool(N, m.parserSrc, lista, comp, function (d) {
    junta(acc, d);
    post({ status: 'Processando ' + lista + ' com ' + N + ' workers... bloco ' + acc.feitos + '/' + n });
  });
  var chaves = meta.chaves || Array.from({ length: n }, function (_, i) { return i; });
  try { for (var i = 0; i < chaves.length; i++) await pool.enviar(chaves[i]); }      // o parser lê o bloco do banco
  finally { await pool.terminar(); }
  var tF = await finalizar(meta, acc, comp);
  return 'Processada em ' + seg(Date.now() - t0) + ': ' + resumo(meta, acc, N, comp, tF);
}

/* ================= 3) excluir lista: NA HORA, com poucas operações grandes ================= */
// Rápido porque não apaga item por item: a lista crua sai com UM clear() da tabela dela e os dados
// organizados com UM delete por faixa [lista, ...] — tudo numa transação só (durability relaxed).
async function excluir(lista) {
  if (!db) db = await open();
  var T = Date.now(), t1, t2, t3;
  var r = await req(db.transaction('listas').objectStore('listas').get(lista));
  var tam = r && r.bytes ? ' (' + mb(r.bytes) + ')' : '';
  post({ status: 'Excluindo ' + lista + '... apagando dados organizados e lista crua' + tam });
  var nomes = ['conteudos', 'busca', 'series', 'listas'], temCru = db.objectStoreNames.contains(lista);
  if (temCru) nomes.push(lista);
  var tx = db.transaction(nomes, 'readwrite', RW);
  tx.objectStore('conteudos').delete(faixa(lista));
  tx.objectStore('busca').delete(faixa(lista));
  tx.objectStore('series').delete(faixa(lista));
  tx.objectStore('listas').delete(lista);
  if (temCru) tx.objectStore(lista).clear();            // lista crua inteira (todas as gerações) de uma vez
  await txDone(tx);
  t1 = Date.now() - T;
  post({ status: 'Excluindo ' + lista + '... apagando arquivos' });
  var T2 = Date.now(), root = await raizOPFS(), narq = 0;
  if (root) {                                            // modo arquivo: 1 remoção por arquivo (1 por geração)
    var ks = []; try { for await (var k of root.keys()) ks.push(k); } catch (e) {}
    for (var i = 0; i < ks.length; i++) if (ks[i] === arqCru(lista) || ks[i].indexOf(lista + '.') === 0) { try { await root.removeEntry(ks[i]); narq++; } catch (e) {} }
  }
  t2 = Date.now() - T2;
  post({ status: 'Excluindo ' + lista + '... removendo a tabela ' + lista });
  var T3 = Date.now();
  await alterarSchema(null, lista);                      // tabela já vazia: remover é rápido
  t3 = Date.now() - T3;
  return 'Lista ' + lista + tam + ' excluída em ' + (Date.now() - T) + ' ms — dados organizados + lista crua ' + t1 + ' ms' +
    (narq ? ' · arquivos (' + narq + ') ' + t2 + ' ms' : '') + ' · tabela ' + t3 + ' ms.';
}
// importação que falhou antes de terminar: a geração nova (incompleta) vira lixo
async function marcarLixo(nome, gen) {
  try {
    if (!db) db = await open();
    var tx = db.transaction('listas', 'readwrite', RW), ls = tx.objectStore('listas');
    var r = await req(ls.get(nome));
    if (!r) ls.put({ nome: nome, excluida: true, gen: gen, lixo: [gen] });
    else if (r.gen !== gen && (r.lixo || []).indexOf(gen) < 0) { r.lixo = (r.lixo || []).concat([gen]); ls.put(r); }
    await txDone(tx);
  } catch (e) {}
}

/* ================= 5) TESTE DE EXCLUSÃO: mede, neste aparelho, cada forma de apagar ~90 MB ================= */
var TESTE_MB = 90;                                  // tamanho do teste (parecido com a lista real)
async function testeExclusao() {
  var r = [], blk = new Uint8Array(4 * CH), i, t, n4 = Math.ceil(TESTE_MB / 4), n1 = TESTE_MB;
  for (i = 0; i < blk.length; i++) blk[i] = 65 + (i % 26);
  async function enche(dbx, store, tam, n) {
    var t0 = Date.now();
    for (var j = 0; j < n; j++) { var tx = dbx.transaction(store, 'readwrite', RW); tx.objectStore(store).put(blk.slice(0, tam), j); await txDone(tx); }
    return Date.now() - t0;
  }
  function med(nome, ms, grav) { r.push(nome + ': ' + ms + ' ms' + (grav ? ' (gravar levou ' + grav + ' ms)' : '')); post({ status: 'Testando exclusão (' + TESTE_MB + ' MB)... ' + r.join(' | ') }); }
  post({ status: 'Testando exclusão (' + TESTE_MB + ' MB)... gravando dados de teste' });
  // A) clear() da tabela — valores de 4 MB
  await alterarSchema('__tx1', null);
  var g = await enche(db, '__tx1', 4 * CH, n4);
  t = Date.now(); var tx = db.transaction('__tx1', 'readwrite', RW); tx.objectStore('__tx1').clear(); await txDone(tx); med('clear ' + n4 + '×4 MB', Date.now() - t, g);
  // B) remover a tabela com os dados dentro (muda a versão do banco)
  g = await enche(db, '__tx1', 4 * CH, n4);
  t = Date.now(); await alterarSchema(null, '__tx1'); med('remover tabela ' + n4 + '×4 MB', Date.now() - t, g);
  // C) clear() da tabela — valores de 1 MB
  await alterarSchema('__tx2', null);
  g = await enche(db, '__tx2', CH, n1);
  t = Date.now(); tx = db.transaction('__tx2', 'readwrite', RW); tx.objectStore('__tx2').clear(); await txDone(tx); med('clear ' + n1 + '×1 MB', Date.now() - t, g);
  await alterarSchema(null, '__tx2');
  // D) banco de dados SEPARADO apagado inteiro (deleteDatabase)
  var aux = await new Promise(function (ok, ko) { var q = indexedDB.open('__tx_db', 1); q.onupgradeneeded = function () { q.result.createObjectStore('cru'); }; q.onsuccess = function () { ok(q.result); }; q.onerror = function () { ko(q.error); }; });
  g = await enche(aux, 'cru', 4 * CH, n4); aux.close();
  t = Date.now(); await req(indexedDB.deleteDatabase('__tx_db')); med('apagar banco separado ' + n4 + '×4 MB', Date.now() - t, g);
  // E) arquivo OPFS
  var root = await raizOPFS();
  if (root) {
    try {
      var h = await (await root.getFileHandle('__tx.bin', { create: true })).createSyncAccessHandle(), t0 = Date.now();
      for (i = 0; i < n4; i++) h.write(blk, { at: i * blk.length }); h.flush(); h.close(); g = Date.now() - t0;
      t = Date.now(); await root.removeEntry('__tx.bin'); med('apagar arquivo ' + (n4 * 4) + ' MB', Date.now() - t, g);
    } catch (e) { r.push('arquivo: indisponível'); }
  } else r.push('arquivo: indisponível neste navegador');
  return 'Teste de exclusão (~' + TESTE_MB + ' MB em cada): ' + r.join(' | ');
}

/* ================= 4) apagar versões antigas (no fim da importação, na frente do usuário) ================= */
// apaga uma faixa inteira numa operação só (e, para o formato antigo, as chaves filtradas na mesma transação)
async function apagaFaixa(store, range, filtro) {
  var ks = filtro ? (await req(db.transaction(store).objectStore(store).getAllKeys(range))).filter(filtro) : null;
  var tx = db.transaction(store, 'readwrite', RW), os = tx.objectStore(store);
  if (ks) for (var i = 0; i < ks.length; i++) os.delete(ks[i]); else os.delete(range);
  await txDone(tx);
  return 1;
}
async function apagaGeracao(nome, g) {
  var n = 0;
  if (db.objectStoreNames.contains(nome)) {
    n += await apagaFaixa(nome, IDBKeyRange.bound(g * GEN, g * GEN + GEN - 1));              // índice/blocos da geração
    if (g) n += await apagaFaixa(nome, IDBKeyRange.bound('g' + g + '_', 'g' + g + '_\uffff')); // grupos da geração
    else n += await apagaFaixa(nome, IDBKeyRange.bound('g', 'g\uffff'), function (k) { return /^g\d+$/.test(k); }); // formato antigo
  }
  var root = await raizOPFS();
  if (root) { try { await root.removeEntry(arqCru(nome, g)); n++; } catch (e) {} }
  return n;
}
async function limpar() {
  if (!db) db = await open();
  var T = Date.now(), total = 0;
  var todas = await req(db.transaction('listas').objectStore('listas').getAll());
  for (var i = 0; i < todas.length; i++) {
    var r = todas[i], lixo = (r.lixo || []).slice();
    for (var j = 0; j < lixo.length; j++) {
      total += await apagaGeracao(r.nome, lixo[j]);
      var tx = db.transaction('listas', 'readwrite', RW), ls = tx.objectStore('listas');   // tira do lixo (relendo: pode ter mudado)
      var atual = await req(ls.get(r.nome));
      if (atual && atual.lixo) { atual.lixo = atual.lixo.filter(function (x) { return x !== lixo[j]; }); ls.put(atual); }
      await txDone(tx);
    }
    var fim = await req(db.transaction('listas').objectStore('listas').get(r.nome));
    if (fim && fim.excluida && !(fim.lixo || []).length) {       // lista excluída e já vazia: some de vez (tabela incluída)
      var tx2 = db.transaction('listas', 'readwrite', RW); tx2.objectStore('listas').delete(r.nome); await txDone(tx2);
      await alterarSchema(null, r.nome);
    }
  }
  return total ? 'Versão anterior apagada em ' + (Date.now() - T) + ' ms.' : '';
}

self.onmessage = async function (ev) {
  var m = ev.data, txt;
  try {
    var cores = self.navigator.hardwareConcurrency || 2;
    m.N = m.nw > 0 ? m.nw : Math.max(1, Math.min(2, cores - 1));   // auto: até 2 (sobra CPU p/ rede, banco e tela)
    if (m.cmd === 'importar') { txt = await importar(m); if (ultimaCalib) txt += '\n' + textoCalib(ultimaCalib); }
    else if (m.cmd === 'processar') txt = await processar(m);
    else if (m.cmd === 'excluir') txt = await excluir(m.nome);
    else if (m.cmd === 'limpar') txt = await limpar();
    else if (m.cmd === 'testeExclusao') { if (!db) db = await open(); txt = await testeExclusao(); }
    else if (m.cmd === 'calibrar') txt = textoCalib(await calibrar());
    if (db) db.close(); db = null;
    post({ fim: true, status: txt });
  } catch (e) {
    if (m && m.cmd === 'importar' && genEmCurso) await marcarLixo(m.nome, genEmCurso);
    if (db) db.close(); db = null;
    post({ erro: String(e && e.message || e) });
  }
};

<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };
// norm(), classifica(), cadaEntrada(), DBN... vêm do <script id="shared-src"> acima (script normal, sem eval);
// o mesmo texto desse script é reaproveitado para montar os workers.
var LIMIT = 200, FORMATO = 6;
var db = null, lista = '', meta = null, curType = 0, cur = [], curKind = 'item', busy = false, token = 0, st = null;
var cacheGrupos = new Map();

/* ---------- utilidades ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function status(m) { $('status').textContent = m; }
function nomeTabela(s) { s = norm(s).replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); return 'lista_' + (s || 'sem_nome'); }
function heap() { return performance.memory ? mb(performance.memory.usedJSHeapSize) : null; }

// bloco (texto) → { h: dicionário, rows: linhas }
function abreBloco(txt) {
  var p = txt.indexOf('\n');
  return { h: JSON.parse(p < 0 ? txt : txt.slice(0, p)), rows: p < 0 ? [] : txt.slice(p + 1).split('\n') };
}
// linha → objeto legível (resolve o dicionário do bloco)
function item(l, h) {
  var c = l.split('\t');
  return { nome: c[0], grupo: h.g[+c[1]], url: h.b[+c[2]] + c[3], logo: c[4] !== '' ? h.l[+c[4]] + c[5] : '', tvg_id: c[6], xui_id: c[7] };
}

/* ---------- banco (thread principal: só leitura) ---------- */
function getDB() {
  if (db) return Promise.resolve(db);
  return new Promise(function (ok, ko) {
    var r = indexedDB.open(DBN);
    r.onupgradeneeded = function () {
      var d = r.result;
      if (!d.objectStoreNames.contains('listas')) d.createObjectStore('listas', { keyPath: 'nome' });
      ['conteudos', 'busca', 'series'].forEach(function (n) { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); });
    };
    r.onsuccess = function () {
      db = r.result;
      db.onversionchange = function () { db.close(); db = null; };   // libera para o worker criar/apagar tabelas
      ok(db);
    };
    r.onerror = function () { ko(r.error); };
  });
}
async function get(store, key) { return req((await getDB()).transaction(store).objectStore(store).get(key)); }
async function lerBloco(t, b) { return abreBloco(await lerValor(await get('conteudos', [lista, t, b]), meta.comp)); }

/* ---------- worker: faz o pesado e é destruído no fim ---------- */
function rodarWorker(msg) {
  if (busy) return; busy = true; setBusy(true);
  if (db) { db.close(); db = null; }
  var antes = heap(), shared = $('shared-src').textContent;
  msg.parserSrc = shared + '\n' + $('parser-src').textContent;
  msg.nw = +$('nw').value; msg.comp = $('comp').checked;
  msg.cru = $('cru').value; msg.calib = lerCalib(); msg.conexoes = +$('conx').value;
  var url = URL.createObjectURL(new Blob([shared, '\n', $('worker-src').textContent], { type: 'text/javascript' }));
  var w = new Worker(url);
  function fim(txt) {
    w.terminate(); w = null;             // encerra o coordenador (os parsers já foram encerrados por ele)
    URL.revokeObjectURL(url); url = null;
    msg = null;
    $('file').value = '';                // solta a referência ao arquivo escolhido
    busy = false; setBusy(false);
    carregarListas().then(function () {
      status(txt + '\nWorkers encerrados — memória do download/processamento liberada.' +
        (antes ? ' Heap da página: ' + antes + ' antes → ' + heap() + ' agora.' : ''));
    });
  }
  w.onmessage = function (e) {
    var d = e.data;
    if (d.calib) { salvarCalib(d.calib); return; }
    if (d.previa) { carregarListas(); return; }       // canais já podem ser usados enquanto o resto baixa
    if (d.erro) fim('Erro: ' + d.erro + '\n(Se for URL: verifique CORS ou use o botão de arquivo.)');
    else if (d.fim) fim(d.status);
    else if (d.status) status(d.status);
  };
  w.onerror = function (e) { fim('Erro no worker: ' + e.message); };
  w.postMessage(msg);
}
// resultado da calibração do disco (guardado neste aparelho; se o armazenamento local falhar, mede de novo)
function lerCalib() { try { var c = JSON.parse(localStorage.getItem('iptv_calib') || 'null'); return c && c.v === 2 && c.melhor ? c : null; } catch (e) { return null; } }
function salvarCalib(c) { try { localStorage.setItem('iptv_calib', JSON.stringify(c)); } catch (e) {} }
function setBusy(b) { ['btnUrl', 'btnProc', 'btnDel', 'btnCalib', 'btnTesteDel', 'file', 'nw', 'comp', 'cru', 'conx'].forEach(function (id) { $(id).disabled = b; }); }

/* ---------- listas ---------- */
async function carregarListas() {
  var todas = await req((await getDB()).transaction('listas').objectStore('listas').getAll());
  todas = todas.filter(function (l) { return !l.excluida; });        // excluídas (aguardando limpeza) não aparecem
  if (!todas.some(function (l) { return l.nome === lista; })) lista = todas.length ? todas[0].nome : '';
  var h = todas.length ? '' : '<option value="">(nenhuma lista)</option>';
  meta = null;
  todas.forEach(function (l) {
    if (l.nome === lista) meta = l;
    h += '<option value="' + esc(l.nome) + '"' + (l.nome === lista ? ' selected' : '') + '>' + esc(l.nome) + ' — ' + mb(l.bytes) +
      (l.processada ? ' — ' + l.total[0] + ' ao vivo / ' + l.total[1] + ' filmes / ' + l.series + ' séries' : ' — não processada') + '</option>';
  });
  todas = null;
  $('lista').innerHTML = h;
  loadGroups(); await search();
}

function loadGroups() {
  var h = '<option value="">Todos os grupos</option>';
  if (meta && meta.formato === FORMATO) {
    var gs = meta.grupos[curType], un = curType === 2 ? ' séries' : '';
    for (var i = 0; i < gs.length; i++) h += '<option value="' + esc(gs[i][0]) + '">' + esc(gs[i][0]) + ' (' + gs[i][1] + un + ')</option>';
  }
  $('grp').innerHTML = h;
}

/* ---------- consultas ---------- */
// Percorre só os blocos que têm o tipo pedido (meta.blocos[t]); st guarda a posição para "Carregar mais".
async function search(more) {
  var my = ++token, t0 = performance.now();
  if (!more) st = { b: 0, i: 0 };
  if (!meta || !meta.processada) { render([], 'item', false); if (!busy) status(lista ? 'Lista não processada.' : 'Nenhuma lista. Cole uma URL ou escolha um arquivo.'); return; }
  if (meta.formato !== FORMATO) { render([], 'item', false); if (!busy) status('Lista em formato antigo: clique em Reprocessar.'); return; }
  var q = norm($('q').value.trim()), g = $('grp').value, out = [], t = curType;
  var series = t === 2, lb = series ? null : meta.blocos[t], nb = series ? meta.blocos_series : lb.length;

  while (st.b < nb && out.length < LIMIT) {
    var i = st.i, n, B;
    if (series) {
      var sr = await get('series', [lista, st.b]); if (my !== token) return;
      for (n = sr.length; i < n && out.length < LIMIT; i++) {
        var s = sr[i];
        if ((!g || s[1] === g) && (!q || s[5].indexOf(q) >= 0)) out.push(s);
      }
    } else if (!q && !g) {
      B = await lerBloco(t, lb[st.b]); if (my !== token) return;
      for (n = B.rows.length; i < n && out.length < LIMIT; i++) out.push(item(B.rows[i], B.h));
    } else {
      var linhas = texto(await get('busca', [lista, t, lb[st.b]])).split('\n'), hits = []; if (my !== token) return;
      for (n = linhas.length; i < n && out.length + hits.length < LIMIT; i++) {
        var L = linhas[i], tab = L.indexOf('\t');
        if (g && L.slice(tab + 1) !== g) continue;
        if (q) { var k = L.indexOf(q); if (k < 0 || k + q.length > tab) continue; }
        hits.push(i);
      }
      linhas = null;
      if (hits.length) {
        B = await lerBloco(t, lb[st.b]); if (my !== token) return;
        for (var j = 0; j < hits.length; j++) out.push(item(B.rows[hits[j]], B.h));
      }
    }
    if (i >= n) { st.b++; st.i = 0; } else st.i = i;
  }
  var tem = st.b < nb;
  render(out, series ? 'series' : 'item', tem, more);
  if (!busy) status(cur.length + (tem ? '+' : '') + ' resultados em ' + (performance.now() - t0).toFixed(0) + ' ms');
}

// EPISÓDIOS SOB DEMANDA: lê só os blocos crus da série e interpreta ali (mesmas regras da importação)
async function openSeries(s) {
  var my = ++token, t0 = performance.now(), eps = [], nomeS = s[0];
  for (var i = 0; i < s[4].length; i++) {
    var cru = texto(await lerCru(await getDB(), lista, s[4][i])); if (my !== token) return;
    cadaEntrada(cru, function (inf, url) {
      var nome = nomeDe(inf, url);
      if (nome.lastIndexOf(nomeS, 0) !== 0) return;             // filtro barato: nome começa com o da série?
      var c = classifica(cacheGrupos, inf, url, nome);
      if (c.t !== 2) return;
      var se = c.se || SE_RE.exec(nome);
      if (serieDe(nome, se) !== nomeS) return;
      eps.push({ nome: nome, url: url, logo: attr(inf, 'tvg-logo="') || s[2], grupo: attr(inf, 'group-title="'),
                 tvg_id: attr(inf, 'tvg-id="'), xui_id: attr(inf, 'xui-id="'),
                 temporada: se ? +se[1] : 0, episodio: se ? +se[2] : 0 });
    });
    cru = null;
  }
  eps.sort(function (a, b) { return a.temporada - b.temporada || a.episodio - b.episodio; });
  render(eps, 'ep', false);
  status(nomeS + ': ' + eps.length + ' episódios (lidos da lista crua em ' + (performance.now() - t0).toFixed(0) + ' ms)');
}

/* ---------- render ---------- */
function render(rows, kind, tem, append) {
  curKind = kind;
  if (!append) cur = [];
  var logos = $('logos').checked, base = cur.length, h = '';
  if (kind === 'ep') h += '<div class="it" tabindex="0" data-back="1">← Voltar</div>';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i], titulo, sub, logo;
    if (kind === 'series') { titulo = r[0]; sub = r[3] + ' episódios — ' + r[1]; logo = r[2]; }
    else { titulo = r.nome; sub = kind === 'ep' && r.temporada ? 'T' + r.temporada + ' E' + r.episodio : r.grupo; logo = r.logo; }
    var img = logos && logo ? '<img loading="lazy" src="' + esc(logo) + '" onerror="this.style.visibility=\'hidden\'">' : '';
    h += '<div class="it" tabindex="0" data-i="' + (base + i) + '">' + img + '<div>' + esc(titulo) + '<small>' + esc(sub) + '</small></div></div>';
  }
  cur = cur.concat(rows);
  if (tem) h += '<div class="it" id="more" tabindex="0" data-more="1">Carregar mais…</div>';
  var old = $('more'); if (old) old.remove();
  if (append) $('list').insertAdjacentHTML('beforeend', h); else $('list').innerHTML = h;
}

function activate(el) {
  if (!el) return;
  if (el.dataset.back) { search(); return; }
  if (el.dataset.more) { search(true); return; }
  var r = cur[+el.dataset.i]; if (!r) return;
  if (curKind === 'series') { openSeries(r); return; }
  $('player').style.display = 'block';
  $('vid').src = r.url;
  $('vlink').href = r.url; $('vlink').textContent = r.nome + ' — ' + r.url;
}

/* ---------- eventos ---------- */
$('list').addEventListener('click', function (e) { activate(e.target.closest('.it')); });
$('list').addEventListener('keydown', function (e) {
  var el = e.target.closest('.it'); if (!el) return;
  if (e.key === 'Enter') activate(el);
  else if (e.key === 'ArrowDown' && el.nextElementSibling) { el.nextElementSibling.focus(); e.preventDefault(); }
  else if (e.key === 'ArrowUp' && el.previousElementSibling) { el.previousElementSibling.focus(); e.preventDefault(); }
});
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
  b.onclick = function () {
    document.querySelector('.tab.on').classList.remove('on'); b.classList.add('on');
    curType = +b.dataset.t; loadGroups(); search();
  };
});
var deb;
$('q').oninput = function () { clearTimeout(deb); deb = setTimeout(search, 250); };
$('grp').onchange = function () { search(); };
$('lista').onchange = function () { lista = this.value; carregarListas(); };
$('logos').onchange = function () { search(); };
if (!TEM_COMP) { $('comp').disabled = true; $('comp').parentNode.title = 'Navegador sem CompressionStream'; }

$('btnUrl').onclick = function () {
  var u = $('url').value.trim(); if (!u) return;
  var host; try { host = new URL(u).hostname; } catch (e) { status('URL inválida'); return; }
  lista = nomeTabela($('nome').value.trim() || host);
  rodarWorker({ cmd: 'importar', src: { url: u }, nome: lista });
};
$('file').onchange = function () {
  var f = this.files[0]; if (!f) return;
  lista = nomeTabela($('nome').value.trim() || f.name.replace(/\.[^.]+$/, ''));
  rodarWorker({ cmd: 'importar', src: { file: f }, nome: lista });
};
$('btnCalib').onclick = function () { rodarWorker({ cmd: 'calibrar' }); };
$('btnTesteDel').onclick = function () { rodarWorker({ cmd: 'testeExclusao' }); };
$('btnProc').onclick = function () { if (lista) rodarWorker({ cmd: 'processar', nome: lista }); };
$('btnDel').onclick = function () {
  if (lista && confirm('Excluir ' + lista + ' (tabela crua e conteúdos)?')) rodarWorker({ cmd: 'excluir', nome: lista });
};
$('btnClose').onclick = function () { var v = $('vid'); v.pause(); v.removeAttribute('src'); v.load(); $('player').style.display = 'none'; };

(async function () {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  await carregarListas();
})();
</script>
</body>
</html>
