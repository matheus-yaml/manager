      const baseName = ParserModule.extractSeriesBaseName(content.nome);
      const key = content.serverId + '::' + normalizeText(baseName);
      const entry = State.indexes.seriesIndex.get(key);
      if(entry){
        entry.items.delete(content.id);
        if(entry.items.size === 0){
          State.indexes.seriesIndex.delete(key);
          removeRecentlyAdded(content.serverId, 'series', key);
        }
      }
    } else if(content.tipo === 'movie' || content.tipo === 'live'){
      removeRecentlyAdded(content.serverId, content.tipo, content.id);
    }
  },

  // Remove all content/index entries belonging to a server (used before re-importing a server)
  removeAllForServer(serverId){
    const ids = State.indexes.contentsByServer.get(serverId);
    if(!ids) return;
    const idsCopy = Array.from(ids);
    for(const id of idsCopy){
      const content = State.contentsById.get(id);
      if(content) this.removeContent(content);
    }
    State.indexes.contentsByServer.delete(serverId);
  },

  async toggleFavoriteContent(content){
    content.favorito = !content.favorito;
    try{
      if(content.tipo === 'series' && content.seriesKey){
        // Episódio de série vive na store própria seriesEpisodes agora —
        // IndexedDB não faz update parcial de campo dentro de um array,
        // então precisa reescrever o registro inteiro (só os episódios
        // daquela série, não o resumo leve) pra persistir a mudança. Ação
        // rara (favoritar), então o custo de reler+regravar é aceitável.
        const record = await IDB.getByKey(STORES.seriesEpisodes, content.seriesKey);
        if(record && record.episodes){
          const ep = record.episodes.find(e => e.id === content.id);
          if(ep) ep.favorito = content.favorito;
          await IDB.put(STORES.seriesEpisodes, record);
        } else {
          // Fallback: dado salvo numa versão anterior (episódios ainda
          // embutidos no resumo da série).
          const summary = await IDB.getByKey(STORES.seriesSummary, content.seriesKey);
          if(summary && summary.episodes){
            const ep = summary.episodes.find(e => e.id === content.id);
            if(ep) ep.favorito = content.favorito;
            await IDB.put(STORES.seriesSummary, summary);
          }
        }
      } else {
        await IDB.put(STORES.contents, content);
      }
      if(content.favorito) await IDB.put(STORES.favorites, { id: content.id, type: content.tipo });
      else await IDB.delete(STORES.favorites, content.id);
    }catch(e){}
    // Sem invalidar o cache de página: o objeto `content` já é a MESMA
    // referência guardada em State.pageCache (veio de lá), então a mutação
    // acima já reflete pra próxima vez que a página for renderizada — sem
    // precisar refazer a consulta ao banco (o que causava aquele "reload"
    // visual da tela inteira só por favoritar um item).
    State.dashboardCache = null;
    State.favoritesCache = null;
  },

  async toggleFavoriteSeries(seriesKey){
    const existing = await IDB.getByKey(STORES.favorites, seriesKey).catch(()=>null);
    try{
      if(existing){ await IDB.delete(STORES.favorites, seriesKey); }
      else{ await IDB.put(STORES.favorites, { id: seriesKey, type: 'series' }); }
    }catch(e){}
    State.dashboardCache = null;
    State.favoritesCache = null;
  },

  rebuildFromScratch(allContents){
    this.clearAll();
    for(const c of allContents){
      this.addContent(c);
    }
  },

  // get set of ids for type + optional server/category filters, returns Set
  getFilteredIds(type, opts){
    opts = opts || {};
    let base;
    if(opts.server && opts.server !== 'all'){
      base = State.indexes.contentsByTypeServer.get(type + '::' + opts.server) || new Set();
    } else {
      base = State.indexes.contentsByType[type] || new Set();
    }
    let result = base;
    if(opts.category && opts.category !== 'all'){
      const catSet = State.indexes.contentsByCategory.get(type + '::' + opts.category) || new Set();
      result = intersectSets(result, catSet);
    }
    if(opts.favoritesOnly){
      result = intersectSets(result, State.indexes.favoritesIndex);
    }
    if(opts.searchIds){
      result = intersectSets(result, opts.searchIds);
    }
    return result;
  }
};

function intersectSets(a, b){
  if(!a || !b) return new Set();
  const [small, big] = a.size <= b.size ? [a,b] : [b,a];
  const out = new Set();
  for(const v of small){ if(big.has(v)) out.add(v); }
  return out;
}

/* ======================================================================
   SEARCH MODULE
   ====================================================================== */
let searchDebounceTimer = null;
let activeSearchOverlay = null;
let lastSearchState = null; // { term, results } — evita repetir a mesma busca no banco

function openSearchPopup(term){
  if(activeSearchOverlay) return activeSearchOverlay; // já tem um aberto, não duplica
  let currentResults = { movie:[], live:[], series:[] };
  let activeType = 'all';
  let activeServer = 'all';
  let searchToken = 0;
  let debounceT = null;

  const overlay = el('div', { class:'modal-overlay' });
  const box = el('div', { class:'modal-box', style:'max-width:min(92vw, 960px);' });

  function closePopup(preserveInput){
    overlay.remove();
    activeSearchOverlay = null;
    if(!preserveInput){
      const topbarInput = qs('#global-search');
      if(topbarInput){ topbarInput.value = ''; }
      const clearBtn = qs('#global-search-clear');
      if(clearBtn){ clearBtn.style.display = 'none'; }
    }
  }

  const closeBtn = el('span', { class:'modal-close-x' }, ['×']);
  closeBtn.addEventListener('click', ()=>closePopup(false));
  box.appendChild(el('h3', {}, ['Buscar', closeBtn]));

  const input = el('input', { type:'text', placeholder:'Buscar filmes, séries, canais...', style:'width:100%;margin-bottom:12px;' });
  box.appendChild(input);

  const tabsRow = el('div', { class:'chip-row' });
  const serverRow = el('div', { class:'chip-row', style:'flex-wrap:wrap;' });
  const body = el('div');
  box.appendChild(tabsRow);
  box.appendChild(serverRow);
  box.appendChild(body);

  overlay.appendChild(box);
  qs('#modal-root').appendChild(overlay);

  // Clicar fora da caixa (no fundo escurecido) fecha o popup, igual ao X.
  overlay.addEventListener('mousedown', function(e){ if(e.target === overlay) closePopup(false); });

  function countByServer(items){
    return activeServer==='all' ? items.length : items.filter(i => i.serverId===activeServer).length;
  }

  function renderTabs(){
    tabsRow.innerHTML = '';
    const counts = {
      all: countByServer(currentResults.movie) + countByServer(currentResults.live) + countByServer(currentResults.series),
      series: countByServer(currentResults.series), movie: countByServer(currentResults.movie), live: countByServer(currentResults.live)
    };
    const labels = [['all','Tudo'], ['series','Séries'], ['movie','Filmes'], ['live','Ao Vivo']];
    for(const [key,label] of labels){
      tabsRow.appendChild(el('button', { class:'chip'+(activeType===key?' active':''), onclick:((k)=>()=>{ activeType=k; renderResults(); })(key) }, [label + ' (' + counts[key] + ')']));
    }
  }

  function renderServerChips(){
    serverRow.innerHTML = '';
    if(State.servers.size === 0) return;
    serverRow.appendChild(el('button', { class:'chip'+(activeServer==='all'?' active':''), onclick:()=>{ activeServer='all'; renderServerChips(); renderResults(); } }, ['Todos os servidores']));
    for(const [id, s] of State.servers){
      serverRow.appendChild(el('button', { class:'chip'+(activeServer===id?' active':''), onclick:((sid)=>()=>{ activeServer=sid; renderServerChips(); renderResults(); })(id) }, [s.nome]));
    }
  }

  function renderResults(){
    body.innerHTML = '';
    renderTabs();
    const groups = [];
    if(activeType==='all' || activeType==='series') groups.push(['Séries', currentResults.series, renderSeriesCard]);
    if(activeType==='all' || activeType==='movie') groups.push(['Filmes', currentResults.movie, renderContentCard]);
    if(activeType==='all' || activeType==='live') groups.push(['Ao Vivo', currentResults.live, renderContentCard]);

    let any = false;
    for(const [label, items, renderFn] of groups){
      const filtered = activeServer==='all' ? items : items.filter(i => i.serverId===activeServer);
      if(filtered.length===0) continue;
      any = true;
      body.appendChild(el('div', { class:'server-section-title' }, [label + ' (' + filtered.length + ')']));
      const grid = el('div', { class:'card-grid' });
      for(const item of filtered){ grid.appendChild(renderFn(item)); }
      body.appendChild(grid);
    }
    if(!any) body.appendChild(renderEmptyState('🔍', 'Nada encontrado', 'Nenhum resultado com esses filtros.'));
  }

  function runSearch(val){
    if(lastSearchState && lastSearchState.term === val){
      currentResults = lastSearchState.results;
      activeType = 'all';
      renderServerChips();
      renderResults();
      return;
    }
    const myToken = ++searchToken;
    body.innerHTML = '';
    body.appendChild(el('div', { class:'loader-inline' }, [el('div',{class:'spinner'}), 'Buscando...']));
    GlobalSearchModule.search(val).then(function(results){
      if(myToken !== searchToken) return; // usuário já digitou de novo
      currentResults = results;
      lastSearchState = { term: val, results: results };
      activeType = 'all';
      renderServerChips(); // usa State.servers, já em memória — instantâneo
      renderResults();
    }).catch(function(){
      if(myToken !== searchToken) return;
      body.innerHTML = '';
      body.appendChild(renderEmptyState('⚠️', 'Erro na busca', 'Não foi possível concluir a busca.'));
    });
  }

  // Único ponto de debounce (500ms sem digitar): toda entrada de texto
  // — inclusive o texto inicial vindo da caixa da topbar — passa por aqui.
  function scheduleSearch(val){
    clearTimeout(debounceT);
    if(!val){ searchToken++; body.innerHTML = ''; tabsRow.innerHTML=''; renderServerChips(); return; }
    debounceT = setTimeout(function(){ runSearch(val); }, 500);
  }

  input.addEventListener('input', function(e){
    const val = e.target.value;
    const topbarInput = qs('#global-search');
    if(topbarInput) topbarInput.value = val; // mantém sincronizado pra não "perder" o texto ao reabrir
    scheduleSearch(val.trim());
  });

  renderServerChips();
  if(term){
    input.value = term;
    input.focus();
    input.setSelectionRange(term.length, term.length); // cursor no fim, não no início
    scheduleSearch(term);
  } else {
    input.focus();
  }

  activeSearchOverlay = { overlay, input, close: closePopup };
  return activeSearchOverlay;
}

/* ======================================================================
   PARSER MODULE - M3U/M3U8 parsing & classification
   ====================================================================== */
const VIDEO_EXTENSIONS = ['.mp4','.mkv','.avi','.mov','.webm','.m4v','.mpg','.mpeg','.flv','.wmv'];
const SERIES_PATTERNS = [
  /s\d{1,2}\s?e\d{1,3}/i,
  /epis[oó]dio/i,
  /episode/i,
  /season/i
];

// Palavras/frases no group-title que indicam Ao Vivo. Comparação é feita
// após normalizar (minúsculas, sem acento, sem pontuação/espaços) tanto a
// categoria quanto estas palavras, então maiúsculas/minúsculas e acentos não importam.
const LIVE_GROUP_KEYWORDS = [
  'FILMES','CINE','TELECINE','HBO','SERIES','SÉRIES','24H','ANIME','DESENHO','CANAIS',
  'ABERTOS','BAND','GLOBO','RECORD','RECORDTV','SBT',
  'NOTICIAS','ESPORTES','PAY-PER-VIEW','PPV','ESPN','SPORTV','PREMIERE','DAZN','UFC','COMBATE','LUTAS','NBA','CHAMPIONS LEAGUE','JOGOS DO DIA','CAZÉ TV','GOAT','SPORTS','SPORTYNET','PARAMOUNT','DISNEY','MAX','HBO MAX','APPLE TV','YOUTUBE',
  'RELIGIOSOS','CATOLICOS','ESPIRITA','RADIOS','RADIO',
  'AGRO','DISCOVERY','DOCUMENTÁRIOS','INFANTIS','MUSICA','VARIEDADES','PUBLICOS','PLUTO TV','PORTUGAL','ARGENTINA','CANADA','U.S.A'
];

function normalizeForKeywordMatch(str){
  return normalizeText(str).replace(/[^a-z0-9]/g, '');
}

const LIVE_GROUP_KEYWORDS_NORMALIZED = LIVE_GROUP_KEYWORDS.map(normalizeForKeywordMatch);

const ParserModule = {

  /**
   * Parses raw M3U text into array of raw entries: { attrs: {}, name, url }
   * Ignores invalid entries individually without stopping the whole parse.
   */
  parseM3U(text){
    const entries = [];
    if(!text) return entries;
    // Normalize line endings
    const lines = text.split(/\r\n|\r|\n/);
    let pendingExtinf = null;

    for(let i=0;i<lines.length;i++){
      const line = lines[i];
      if(line === undefined) continue;
      const trimmed = line.trim();
      if(!trimmed) continue;

      if(trimmed.charAt(0) === '#'){
        if(/^#EXTINF/i.test(trimmed)){
          try{
            pendingExtinf = ParserModule.parseExtinfLine(trimmed);
          }catch(err){
            pendingExtinf = null;
          }
        }
        // ignore other directives (#EXTM3U, #EXTGRP, #EXTVLCOPT, etc.)
        continue;
      }

      // This is a URL line (not starting with #)
      if(pendingExtinf){
        try{
          const url = trimmed;
          if(url){
            entries.push({
              url: url,
              name: pendingExtinf.name || url,
              tvgId: pendingExtinf.tvgId || '',
              tvgName: pendingExtinf.tvgName || '',
              tvgLogo: pendingExtinf.tvgLogo || '',
              groupTitle: pendingExtinf.groupTitle || 'Sem categoria'
            });
          }
        }catch(err){
          // ignore invalid entry, continue parsing
        }
        pendingExtinf = null;
      }
      // If there's a URL line with no preceding EXTINF, skip it individually.
    }
    return entries;
  },

  /**
   * Parses a single #EXTINF line into attributes + display name.
   * Supports quotes, unicode, emojis, extra params, different real-world formats.
   */
  parseExtinfLine(line){
    const result = { tvgId:'', tvgName:'', tvgLogo:'', groupTitle:'', name:'' };
    // Attributes are of the form key="value" (value may contain anything except unescaped quotes)
    const attrRegex = /([a-zA-Z0-9\-]+)="([^"]*)"/g;
    let m;
    while((m = attrRegex.exec(line)) !== null){
      const key = m[1].toLowerCase();
      const val = m[2];
      if(key === 'tvg-id') result.tvgId = val;
      else if(key === 'tvg-name') result.tvgName = val;
      else if(key === 'tvg-logo') result.tvgLogo = val;
      else if(key === 'group-title') result.groupTitle = val;
    }
    // The display name is everything after the LAST comma in the line
    const lastComma = line.lastIndexOf(',');
    if(lastComma !== -1 && lastComma < line.length - 1){
      result.name = line.substring(lastComma + 1).trim();
    } else if(result.tvgName){
      result.name = result.tvgName;
    }
    if(!result.name) result.name = result.tvgName || 'Sem nome';
    return result;
  },

  /**
   * Classification order:
   *   1. Séries — padrões no nome (SxxExx, "episódio", "episode", "season").
   *   2. Filmes — URL termina em extensão de vídeo conhecida.
   *   3. Ao Vivo — URL termina em "/ts", contém "m3u8", ou termina em ".ts".
   *   4. Ao Vivo — group-title contém alguma palavra-chave de canal ao vivo.
   *   5. Padrão (o que sobrar de tudo acima): Filme.
   */
  classify(name, url, categoria){
    const lowerName = (name || '').toLowerCase();
    const rawUrl = url || '';
    const lowerUrl = rawUrl.toLowerCase();

    // 1. Series check (highest priority)
    for(const pattern of SERIES_PATTERNS){
      if(pattern.test(lowerName)){
        return 'series';
      }
    }

    // 2. Movie check via video extension in URL
    for(const ext of VIDEO_EXTENSIONS){
      if(lowerUrl.indexOf(ext) !== -1){
        return 'movie';
      }
    }

    // 3. URL shape typical of raw live streams: ends with "/ts", contains
    // "m3u8" anywhere, or ends with ".ts". Only reads the URL — never
    // modifies/strips it.
    if(/\/ts(\?.*)?$/i.test(rawUrl) || lowerUrl.indexOf('m3u8') !== -1 || /\.ts(\?.*)?$/i.test(rawUrl)){
      return 'live';
    }

    // 4. group-title contains a known live-channel keyword
    if(categoria){
      const normCat = normalizeForKeywordMatch(categoria);
      for(const kw of LIVE_GROUP_KEYWORDS_NORMALIZED){
        if(kw && normCat.indexOf(kw) !== -1){
          return 'live';
        }
      }
    }

    // 5. Default: everything else falls into Filmes
    return 'movie';
  },

  /**
   * Extracts the base series name by removing episode patterns.
   * Does not mutate the original stored name; used only for grouping/display.
   */
  extractSeriesBaseName(name){
    if(!name) return 'Desconhecida';
    let base = name;
    base = base.replace(/s\d{1,2}\s?e\d{1,3}/gi, '');
    base = base.replace(/\b\d{1,2}x\d{1,3}\b/gi, '');
    base = base.replace(/temporada\s?\d+/gi, '');
    base = base.replace(/season\s?\d+/gi, '');
    base = base.replace(/epis[oó]dio\s?\d*/gi, '');
    base = base.replace(/episode\s?\d*/gi, '');
    base = base.replace(/[-_.]+$/g, '');
    base = base.replace(/\s{2,}/g, ' ').trim();
    base = base.replace(/[\-\|]+$/,'').trim();
    if(!base) base = name.trim();
    return base;
  },

  /**
   * Extracts season/episode numbers from a name for sorting/display purposes.
   */
  extractSeasonEpisode(name){
    if(!name) return { season: 1, episode: 0 };
    const se = ParserModule.extractSeasonEpisodeStrict(name);
    return se || { season: 1, episode: 0 };
  },

  /** Igual à de cima, mas retorna null quando não consegue reconhecer
   * nenhum padrão — usada só pra decidir com segurança se é seguro
   * compactar o nome do episódio (não dá pra reconstruir se não sabemos
   * se a extração deu certo). */
  extractSeasonEpisodeStrict(name){
    if(!name) return null;
    let m = name.match(/s(\d{1,2})\s?e(\d{1,3})/i);
    if(m) return { season: parseInt(m[1],10), episode: parseInt(m[2],10) };
    m = name.match(/\b(\d{1,2})x(\d{1,3})\b/i);
    if(m) return { season: parseInt(m[1],10), episode: parseInt(m[2],10) };
    m = name.match(/temporada\s?(\d+).*?epis[oó]dio\s?(\d+)/i);
    if(m) return { season: parseInt(m[1],10), episode: parseInt(m[2],10) };
    return null;
  },

  /**
   * Converts a raw parsed entry + serverId into a content object ready for storage.
   * Returns null if entry is invalid (missing url/name).
   */
  buildContent(entry, serverId){
    try{
      if(!entry || !entry.url) return null;
      const name = entry.name || entry.tvgName || '';
      if(!name) return null;
      const categoria = entry.groupTitle || 'Sem categoria';
      const tipo = ParserModule.classify(name, entry.url, categoria);
      const seriesKey = tipo === 'series' ? (serverId + '::' + normalizeText(ParserModule.extractSeriesBaseName(name))) : null;
      return {
        id: uid('c'),
        serverId: serverId,
        nome: name,
        url: entry.url,
        logo: entry.tvgLogo || '',
        tipo: tipo,
        categoria: categoria,
        seriesKey: seriesKey,
        favorito: false
      };
    }catch(err){
      return null;
    }
  },

  /** Constrói os registros de resumo de série (1 por série) a partir de um lote de conteúdos recém-processados. */
  buildSeriesSummaries(contents, serverId){
    const map = new Map();
    const now = Date.now();
    for(const c of contents){
      if(c.tipo !== 'series') continue;
      let s = map.get(c.seriesKey);
      if(!s){
        s = { key: c.seriesKey, serverId: serverId, name: ParserModule.extractSeriesBaseName(c.nome), logo: c.logo || '', categorias: [], episodeCount: 0, updatedAt: now, _seasons: new Set() };
        map.set(c.seriesKey, s);
      }
      s.episodeCount++;
      if(!s.logo && c.logo) s.logo = c.logo;
      if(c.categoria && s.categorias.indexOf(c.categoria) === -1) s.categorias.push(c.categoria);
      const se = ParserModule.extractSeasonEpisode(c.nome);
      s._seasons.add(se.season);
    }
    return Array.from(map.values()).map(s => {
      s.seasonCount = s._seasons.size;
      delete s._seasons; // Set não vai pro IndexedDB, só o número interessa
      return s;
    });
  }
};

/**
 * Versão focada em velocidade máxima: grava conteúdos + resumo de séries
 * numa ÚNICA transação do IndexedDB (uma única confirmação/commit no disco,
 * em vez de duas ou mais). Não faz fatiamento em lotes nem cede a thread
 * entre gravações — a tela fica "congelada" durante o salvamento (sem
 * atualizar a barra de progresso item a item), mas isso é bem mais rápido
 * porque elimina o overhead de abrir/confirmar múltiplas transações e de
 * ceder controle ao navegador repetidamente. Uso pretendido: apps internos
 * onde responsividade da UI durante o salvamento não importa, só velocidade.
 */
function saveAllInOneTransaction(contents, seriesSummaries, episodeRecords){
  return new Promise((resolve, reject)=>{
    try{
      const tx = IDB.tx([STORES.contents, STORES.seriesSummary, STORES.seriesEpisodes], 'readwrite', { durability: 'relaxed' });
      const contentStore = tx.objectStore(STORES.contents);
      for(const v of contents) contentStore.put(v);
      const seriesStore = tx.objectStore(STORES.seriesSummary);
      for(const v of (seriesSummaries||[])) seriesStore.put(v);
      const episodesStore = tx.objectStore(STORES.seriesEpisodes);
      for(const v of (episodeRecords||[])) episodesStore.put(v);
      tx.oncomplete = ()=> resolve();
      tx.onerror = (e)=> reject(e.target.error);
    }catch(err){ reject(err); }
  });
}

function tallyCounts(contents){
  const counts = { movie:0, series:0, live:0 };
  for(const c of contents){ if(counts[c.tipo] !== undefined) counts[c.tipo]++; }
  return counts;
}

/**
 * Elimina a repetição maciça de URL entre itens do mesmo servidor. URLs de
 * IPTV normalmente compartilham o mesmo "caminho base" (host, porta,
 * usuário, senha, pasta) entre centenas/milhares de itens — só o pedaço
 * final (o ID/arquivo) muda. Em vez de guardar a URL inteira em cada
 * registro, guardamos um dicionário pequeno de prefixos (descoberto
 * automaticamente, sem assumir que existe só 1 padrão por servidor — um
 * mesmo servidor pode ter caminhos diferentes pra filme/série/ao vivo) e,
 * em cada item, só a referência ao prefixo + o pedaço que sobra.
 *
 * Retorna a lista de prefixos descobertos (pra guardar no registro do
 * servidor). Muda os objetos de `contents` in-place.
 */
/**
 * Mecanismo genérico de prefixo+sufixo: dado um campo (ex: 'url' ou
 * 'logo'), descobre automaticamente os padrões repetidos naquele campo
 * entre os itens (comparando tudo até a última barra) e troca o valor
 * cheio por uma referência pequena (id do prefixo + o resto). Funciona
 * mesmo quando os valores não são idênticos, só compartilham o mesmo
 * "caminho base" — como capas do TMDB, que têm domínio+pasta iguais mas
 * arquivo final diferente por episódio.
 */
function compactField(contents, fieldName, prefixFieldName, suffixFieldName){
  const prefixToId = new Map();
  const prefixList = [];
  for(const c of contents){
    const value = c[fieldName];
    if(!value) continue;
    const slashIdx = value.lastIndexOf('/');
    // Sem barra útil pra dividir (ou barra bem no final, sem nada depois) —
    // não dá pra compactar esse item com segurança, mantém o valor inteiro.
    if(slashIdx === -1 || slashIdx === value.length - 1) continue;
    const prefix = value.slice(0, slashIdx + 1);
    const suffix = value.slice(slashIdx + 1);
    let pid = prefixToId.get(prefix);
    if(pid === undefined){
      pid = prefixList.length;
      prefixList.push(prefix);
      prefixToId.set(prefix, pid);
    }
    c[prefixFieldName] = pid;
    c[suffixFieldName] = suffix;
    delete c[fieldName];
  }
  return prefixList;
}

function compactUrls(contents){
  return compactField(contents, 'url', 'urlPrefixId', 'urlSuffix');
}

/** Reconstrói a URL completa de um item. Compatível com dados antigos
 * (importados antes dessa otimização), que ainda têm o campo `url` cheio. */
function resolveContentUrl(content){
  if(content.url) return content.url;
  if(content.urlPrefixId === undefined) return '';
  const server = State.servers.get(content.serverId);
  if(!server || !server.urlPrefixes) return '';
  const prefix = server.urlPrefixes[content.urlPrefixId];
  return (prefix || '') + (content.urlSuffix || '');
}

/**
 * Passo 1 da compactação de capa, específico de série: se a capa do
 * episódio é IDÊNTICA à da série (caso mais comum), nem guarda nada — usa
 * a da série direto. O que sobrar (capas diferentes por episódio, ou
 * capas de filme/canal ao vivo, que nunca têm "capa da série" pra
 * comparar) segue pro passo 2 (compactCoverLogos), que compacta por
 * prefixo+sufixo — cobre inclusive o caso de capas diferentes mas do
 * mesmo domínio/pasta (ex: TMDB com um arquivo por episódio).
 */
function omitSeriesLogosIfIdentical(contents, seriesSummaries){
  const logoBySeriesKey = new Map();
  for(const s of seriesSummaries) logoBySeriesKey.set(s.key, s.logo);
  for(const c of contents){
    if(c.tipo !== 'series' || !c.logo) continue;
    if(c.logo === logoBySeriesKey.get(c.seriesKey)) delete c.logo;
  }
}

/** Passo 2: compacta por prefixo+sufixo a capa de TODOS os itens que
 * sobraram com capa própria — filme, série (as que não foram omitidas no
 * passo 1) e ao vivo, todos juntos, reaproveitando o mesmo dicionário de
 * prefixos (capas do mesmo servidor costumam vir do mesmo CDN/domínio,
 * então filme e série frequentemente reaproveitam o mesmo prefixo). */
function compactCoverLogos(contents){
  return compactField(contents, 'logo', 'logoPrefixId', 'logoSuffix');
}

/** Reconstrói a capa de um item. Prioridade: capa própria compactada > capa
 * própria antiga (campo `logo` cheio, dado pré-otimização) > capa da série
 * (quando foi omitida por ser idêntica) > vazio. */
function resolveContentLogo(content, seriesLogoFallback){
  if(content.logo) return content.logo;
  if(content.logoPrefixId !== undefined){
    const server = State.servers.get(content.serverId);
    const prefix = server && server.logoPrefixes ? server.logoPrefixes[content.logoPrefixId] : '';
    return (prefix || '') + (content.logoSuffix || '');
  }
  return seriesLogoFallback || '';
}

/**
 * O nome de cada episódio ("Sila Prisioneira do Amor S01E07") repete o
 * nome da série inteiro, que já é guardado uma vez só no resumo. Quando dá
 * pra reconhecer com segurança o padrão de temporada/episódio (via
 * extractSeasonEpisodeStrict), guarda só os dois números — o nome de
 * exibição é remontado na hora ("nome da série" + "S01E07"). Quando NÃO dá
 * pra reconhecer o padrão (nomeação irregular), mantém o nome original
 * inteiro, sem risco de perder informação.
 */
function compactEpisodeNames(contents, seriesSummaries){
  const nameBySeriesKey = new Map();
  for(const s of seriesSummaries) nameBySeriesKey.set(s.key, s.name);
  for(const c of contents){
    if(c.tipo !== 'series' || !c.nome) continue;
    const se = ParserModule.extractSeasonEpisodeStrict(c.nome);
    if(!se) continue; // padrão não reconhecido — mantém o nome cheio, sem risco
    c.season = se.season;
    c.episode = se.episode;
    delete c.nome;
  }
}

/** Reconstrói o nome de exibição de um item. Filme/ao vivo e séries com
 * nomeação irregular (extração falhou) sempre têm `nome` cheio. Episódios
 * compactados reconstroem a partir do nome da série + temporada/episódio. */
function resolveContentName(content, seriesName){
  if(content.nome) return content.nome;
  if(content.season !== undefined && content.episode !== undefined){
    const s = String(content.season).padStart(2, '0');
    const e = String(content.episode).padStart(2, '0');
    return (seriesName || '') + ' S' + s + 'E' + e;
  }
  return '';
}

/* ======================================================================
   COMPRESSÃO INCREMENTAL — versão "streaming" das compressões acima
   ------------------------------------------------------------------
   As funções compactUrls/compactCoverLogos/compactEpisodeNames/
   buildSeriesSummaries fazem cada uma sua PRÓPRIA passada completa pelo
   array de conteúdos, depois que TUDO já foi processado — são 4 passadas
   separadas, e "salvar" só começa depois da última.
   Aqui é a mesma lógica, mas aplicada ITEM A ITEM, numa passada só,
   conforme cada item é construído durante o parse. Isso permite: (1) uma
   única passada em vez de quatro, e (2) já mandar lotes pro Worker salvar
   ENQUANTO o restante do arquivo ainda está sendo processado — os dois
   trabalhos acontecem em paralelo (thread principal processa, Worker
   grava), em vez de um esperar o outro terminar por completo.
   ====================================================================== */
function createCompactionState(){
  return {
    urlPrefixToId: new Map(), urlPrefixList: [],
    logoPrefixToId: new Map(), logoPrefixList: [],
    seriesInfo: new Map(), // seriesKey -> {name, logo, categorias, seasons:Set, episodes:[]}
    // Categorias de filme/ao vivo vistas durante a importação — guardadas
    // aqui em vez de escaneadas do banco depois. Escanear "valores
    // distintos" num índice com centenas de milhares de registros é caro
    // na prática (o cursor 'nextunique' nem sempre pula duplicados de
    // verdade dependendo do navegador), então evitamos fazer essa consulta
    // toda vez que a tela de Filmes/Ao Vivo abre.
    movieCategories: new Set(),
    liveCategories: new Set()
  };
}

function compactSingleFieldIncremental(c, fieldName, prefixFieldName, suffixFieldName, prefixToId, prefixList){
  const value = c[fieldName];
  if(!value) return;
  const slashIdx = value.lastIndexOf('/');
  if(slashIdx === -1 || slashIdx === value.length - 1) return; // sem "/" útil — mantém o valor inteiro
  const prefix = value.slice(0, slashIdx + 1);
  const suffix = value.slice(slashIdx + 1);
  let pid = prefixToId.get(prefix);
  if(pid === undefined){
    pid = prefixList.length;
    prefixList.push(prefix);
    prefixToId.set(prefix, pid);
  }
  c[prefixFieldName] = pid;
  c[suffixFieldName] = suffix;
  delete c[fieldName];
}

/**
 * Comprime UM item (in-place). MUDANÇA IMPORTANTE: episódios de série não
 * são mais devolvidos pra virar registro solto na store `contents` — eles
 * são guardados DENTRO do resumo da série (`info.episodes`), em memória,
 * e só vão pro banco quando a série inteira for salva de uma vez
 * (finalizeSeriesSummariesFromState). Isso existe porque, na prática real
 * de uso, episódio de série é a esmagadora maioria dos itens (>90% em
 * bibliotecas típicas) — cada um pagando 3 índices do IndexedDB era o
 * verdadeiro gargalo. Uma série com 40 episódios agora é 1 gravação (com
 * um array dentro), não 40 gravações indexadas separadas.
 *
 * Retorna `true` se o item deve ENTRAR no lote normal de salvamento
 * (filme/ao vivo); `false` se foi guardado dentro do resumo da série (e
 * portanto não deve ir pro lote).
 */
function compactItemIncremental(c, state){
  if(c.tipo === 'series' && c.seriesKey){
    let info = state.seriesInfo.get(c.seriesKey);
    if(!info){
      info = { name: ParserModule.extractSeriesBaseName(c.nome || ''), logo: c.logo || '', categorias: [], seasons: new Set(), episodes: [] };
      state.seriesInfo.set(c.seriesKey, info);
    }
    if(!info.logo && c.logo) info.logo = c.logo;
    if(c.categoria && info.categorias.indexOf(c.categoria) === -1) info.categorias.push(c.categoria);

    // Nome: guarda só temporada/episódio quando reconhece o padrão com
    // segurança; nomeação irregular mantém o texto original intacto.
    const se = ParserModule.extractSeasonEpisodeStrict(c.nome);
    if(se){
      info.seasons.add(se.season);
      c.season = se.season;
      c.episode = se.episode;
      delete c.nome;
    } else {
      info.seasons.add(ParserModule.extractSeasonEpisode(c.nome).season);
    }

    // Capa: se for igual à capa "canônica" da série (a primeira que
    // encontramos pra essa série), nem guarda — usa a da série.
    if(c.logo && c.logo === info.logo) delete c.logo;
    compactSingleFieldIncremental(c, 'logo', 'logoPrefixId', 'logoSuffix', state.logoPrefixToId, state.logoPrefixList);
    compactSingleFieldIncremental(c, 'url', 'urlPrefixId', 'urlSuffix', state.urlPrefixToId, state.urlPrefixList);

    info.episodes.push(c);
    return false; // não vai pro lote normal — já foi guardado dentro da série
  }

  // Filme/ao vivo continuam indo pro lote normal (store `contents`), com a
  // mesma compressão de capa/URL de sempre.
  if(c.categoria){
    if(c.tipo === 'movie') state.movieCategories.add(c.categoria);
    else if(c.tipo === 'live') state.liveCategories.add(c.categoria);
  }
  compactSingleFieldIncremental(c, 'logo', 'logoPrefixId', 'logoSuffix', state.logoPrefixToId, state.logoPrefixList);
  compactSingleFieldIncremental(c, 'url', 'urlPrefixId', 'urlSuffix', state.urlPrefixToId, state.urlPrefixList);
  return true;
}

/** Monta os resumos finais de série a partir do estado acumulado — chamado
 * uma vez só, no final, depois que o arquivo inteiro foi visto (só agora
 * sabemos a contagem final de episódios/temporadas). Retorna DOIS arrays
 * separados: `summaries` (leve — nome, capa, contagens; é isso que listar
 * e buscar séries usa) e `episodeRecords` (pesado — vai pra uma store
 * própria, só lida quando abre a tela de detalhe de UMA série específica).
 * Separar os dois evita que listar/buscar precise carregar os episódios
 * de toda série só pra mostrar nome+capa+contagem. */
function finalizeSeriesSummariesFromState(state, serverId){
  const now = Date.now();
  const summaries = [];
  const episodeRecords = [];
  for(const [seriesKey, info] of state.seriesInfo){
    summaries.push({
      key: seriesKey, serverId: serverId, name: info.name, logo: info.logo,
      categorias: info.categorias, episodeCount: info.episodes.length,
      seasonCount: info.seasons.size, updatedAt: now
    });
    episodeRecords.push({ key: seriesKey, episodes: info.episodes });
  }
  return { summaries, episodeRecords };
}

/* ======================================================================
   SERVER MODULE
   ====================================================================== */
const ServerModule = {

  async loadAllFromDB(){
    const servers = await IDB.getAll(STORES.servers);
    State.servers.clear();
    for(const s of servers){ State.servers.set(s.id, s); }
    return servers;
  },

  /**
   * Loads all contents from IndexedDB and builds in-memory indexes, reading
   * them in real batches straight from disk via a cursor (see
   * IDB.getBatchAfter) instead of one giant getAll() covering the whole
   * store. A single getAll() on a store with millions of records has to
   * finish reading everything before it resolves at all, which means no
   * progress can be shown until that huge read completes — exactly the
   * "stuck at 0, then jumps to the end" behavior. Batched cursor reads give
   * real, continuous progress from the very first batch, and each batch's
   * transaction is short-lived so yielding to the browser between batches
   * (via setTimeout) never gets caught by IndexedDB's transaction-lifetime
   * rules.
   */
  async loadAllContentsFromDB(onProgress){
    IndexModule.clearAll();
    const total = await IDB.count(STORES.contents);
    if(onProgress) onProgress(0, total);
    const batchSize = 15000;
    let afterKey = null;
    let processed = 0;

    while(true){
      const { records, lastKey, done } = await IDB.getBatchAfter(STORES.contents, afterKey, batchSize);
      for(const c of records){ IndexModule.addContent(c); }
      processed += records.length;
      afterKey = lastKey;
      if(onProgress) onProgress(processed, total);
      if(done || records.length === 0) break;
      // Yield to the browser so scrolling/clicking/rendering stays smooth
      // even while importing millions of records. Safe here because the
      // previous batch's transaction has already completed by this point.
      await fastYield();
    }
    return processed;
  },

  async loadProgressFromDB(){
    const list = await IDB.getAll(STORES.progress);
    State.progress.clear();
    for(const p of list){ State.progress.set(p.contentId, p); }
  },

  async loadFavoriteSeriesFromDB(){
    const list = await IDB.getAll(STORES.favorites);
    State.favoriteSeries.clear();
    for(const f of list){
      if(f.type === 'series' && f.favorito) State.favoriteSeries.add(f.key);
    }
  },

  async addManualServer(nome, url){
    const server = {
      id: uid('srv'),
      nome: nome,
      url: url,
      permanente: true,
      tipoOrigem: 'manual',
      dataCadastro: Date.now()
    };
    await IDB.put(STORES.servers, server);
    State.servers.set(server.id, server);
    return server;
  },

  async upsertAutoServer(nome, url, rawMeta){
    // find existing automatic server with same name (to avoid duplicates)
    let existing = null;
    for(const [, s] of State.servers){
      if(s.tipoOrigem === 'automatico' && s.nome === nome){
        existing = s; break;
      }
    }
    if(existing){
      existing.url = url;
      existing.rawMeta = rawMeta;
      await IDB.put(STORES.servers, existing);
      return existing;
    }
    const server = {
      id: uid('srv'),
      nome: nome,
      url: url,
      permanente: true,
      tipoOrigem: 'automatico',
      dataCadastro: Date.now(),
      rawMeta: rawMeta
    };
    await IDB.put(STORES.servers, server);
    State.servers.set(server.id, server);
    return server;
  },

  async deleteServer(serverId){
    const idsToRemove = await IDB.deleteAllContentForServer(serverId);
    const idsWithProgress = idsToRemove.filter(id => State.progress.has(id));
    for(const id of idsWithProgress){ State.progress.delete(id); }
    await IDB.deleteMany(STORES.progress, idsWithProgress).catch(()=>{});

    await IDB.delete(STORES.servers, serverId);
    State.servers.delete(serverId);
    await IDB.deleteByIndex(STORES.seriesSummary, 'serverId', serverId);
    State.pageCache.clear(); State.dashboardCache = null; State.favoritesCache = null; State.continueCache = null;
  },

  substituteCredentials(url, user, pass){
    if(!url) return url;
    try{
      let result = url;
      const safeUser = encodeURIComponent(user || '');
      const safePass = encodeURIComponent(pass || '');
      result = result.replace(/username=xxx/gi, 'username=' + safeUser);
      result = result.replace(/password=yyy/gi, 'password=' + safePass);
      return result;
    }catch(err){
      return url;
    }
  },

  /**
   * Downloads a playlist with progress reporting. Returns text content.
   * onProgress(loaded, total|null)
   */
  async downloadPlaylist(url, onProgress){
    const response = await fetch(url);
    if(!response.ok){
      const err = new Error('HTTP ' + response.status);
      err.status = response.status;
      throw err;
    }
    const contentLengthHeader = response.headers.get('Content-Length');
    const total = contentLengthHeader ? parseInt(contentLengthHeader, 10) : null;

    if(!response.body || !response.body.getReader){
      // fallback for environments without streaming support
      const text = await response.text();
      if(onProgress) onProgress(text.length, total);
      return text;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let received = 0;
    let resultText = '';
    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      received += value.length;
      resultText += decoder.decode(value, { stream: true });
      if(onProgress) onProgress(received, total);
    }
    resultText += decoder.decode();
    return resultText;
  },

  /**
   * Processes raw M3U text into content objects for a server, in batches,
   * reporting progress. Returns array of content objects.
   *
   * Parsing and content-building are merged into a single batched pass over
   * the raw lines (instead of first parsing the whole file into an `entries`
   * array in one synchronous call, then batching over that array). For very
   * large playlists, that upfront full-file parse was itself a long
   * synchronous block with no progress feedback — exactly the "freezes,
   * then the bar jumps near the end" symptom.
   */
  /**
   * Processa a playlist E já vai salvando em paralelo, em vez de montar um
   * array gigante primeiro e só depois salvar tudo de uma vez. Cada item é
   * comprimido (URL/capa/nome) na hora em que é construído — uma única
   * passada, não quatro separadas — e acumulado num lote; quando o lote
   * atinge SAVE_CHUNK_SIZE, é disparado pro Worker salvar SEM esperar
   * (`PersistenceWorker.save(...)` sem `await` aqui dentro) — a thread
   * principal segue processando o resto do arquivo enquanto o Worker grava
   * aquele lote em paralelo, numa thread separada. No final, todos os
   * lotes disparados são aguardados juntos (Promise.all).
   */
  async processPlaylistText(text, serverId, onProgress, onSaveProgress){
    const lines = text ? text.split(/\r\n|\r|\n/) : [];
    const totalLines = lines.length;

    // Fast upfront pass just to get an accurate total item count for the
    // progress bar — cheap (no regex, no attribute parsing), unlike a full parse.
    let total = 0;
    for(let i=0;i<totalLines;i++){
      const l = lines[i];
      if(l && l.length >= 7 && l.charCodeAt(0) === 35 /* '#' */ && l.slice(0,7).toUpperCase() === '#EXTINF'){
        total++;
      }
    }

    // O IndexedDB SERIALIZA transações que tocam as mesmas stores — uma
    // gravação em andamento (mesmo rodando no Worker, outra thread) faz
    // qualquer LEITURA sua (navegar em Filmes, buscar) que toque as mesmas
    // stores esperar na fila até aquela gravação terminar. Lotes menores
    // significam transações de gravação mais curtas, então sua leitura tem
    // chance de "furar a fila" com muito mais frequência — não elimina a
    // espera (é estrutural do IndexedDB), mas diminui bastante o tempo
    // percebido enquanto uma importação roda em segundo plano (minimizada).
    const SAVE_CHUNK_SIZE = 3000; // itens por lote enviado ao Worker
    const state = createCompactionState();
    const batchSize = 4000; // lines per batch
    let pendingExtinf = null;
    let counts = { movie:0, series:0, live:0 };
    let processed = 0;
    let totalCount = 0;

    let pendingSaveBatch = [];
    const saveTasks = [];
    let chunksDispatched = 0;
    let chunksCompleted = 0;
    // Estimativa grosseira de quantos lotes vão existir no total, só pra
    // mostrar uma % razoável na barra de "salvando" (o valor exato só é
    // possível saber no final, quando já processamos tudo).
    let estimatedTotalChunks = Math.max(1, Math.ceil(total / SAVE_CHUNK_SIZE));
    let writtenSeriesKeys = [];

    function reportSaveProgress(){
      if(onSaveProgress) onSaveProgress(chunksCompleted, estimatedTotalChunks);
    }

    function dispatchChunk(items, isFinal){
      if(items.length === 0 && !isFinal) return;
      chunksDispatched++;
      const finalized = isFinal ? finalizeSeriesSummariesFromState(state, serverId) : { summaries: [], episodeRecords: [] };
      if(isFinal) writtenSeriesKeys = finalized.summaries.map(s => s.key);
      const task = PersistenceWorker.save(items, finalized.summaries, undefined, finalized.episodeRecords).then(() => {
        chunksCompleted++;
        reportSaveProgress();
      });
      saveTasks.push(task);
    }

    for(let i=0; i<totalLines; i+=batchSize){
      const end = Math.min(i+batchSize, totalLines);
      for(let j=i; j<end; j++){
        const line = lines[j];
        if(!line) continue;
        const trimmed = line.trim();
        if(!trimmed) continue;

        if(trimmed.charAt(0) === '#'){
          if(/^#EXTINF/i.test(trimmed)){
            try{ pendingExtinf = ParserModule.parseExtinfLine(trimmed); }
            catch(err){ pendingExtinf = null; }
          }
          continue;
        }

        if(pendingExtinf){
          const url = trimmed;
          if(url){
            try{
              const entry = {
                url: url,
                name: pendingExtinf.name || url,
                tvgId: pendingExtinf.tvgId || '',
                tvgName: pendingExtinf.tvgName || '',
                tvgLogo: pendingExtinf.tvgLogo || '',
                groupTitle: pendingExtinf.groupTitle || 'Sem categoria'
              };
              const content = ParserModule.buildContent(entry, serverId);
              if(content){
                const goesToNormalBatch = compactItemIncremental(content, state);
                counts[content.tipo]++;
                totalCount++;
                if(goesToNormalBatch){
                  pendingSaveBatch.push(content);
                  if(pendingSaveBatch.length >= SAVE_CHUNK_SIZE){
                    dispatchChunk(pendingSaveBatch, false);
                    pendingSaveBatch = [];
                  }
                }
                // Série não entra no lote normal — já foi guardada dentro
                // do resumo da série (state.seriesInfo), e só vai pro
                // banco no final, via finalizeSeriesSummariesFromState.
              }
              processed++;
            }catch(err){
              // ignore invalid entry individually, keep parsing the rest
            }
          }
          pendingExtinf = null;
        }
      }
      if(onProgress) onProgress(processed, total, counts);
      await fastYield();
    }

    // Último lote (o que sobrou) + os resumos finais de série, já com a
    // contagem completa de episódios/temporadas de cada uma.
    dispatchChunk(pendingSaveBatch, true);
    estimatedTotalChunks = chunksDispatched; // agora sabemos o número exato
    reportSaveProgress();

    await Promise.all(saveTasks);

    return {
      total: totalCount,
      counts: counts,
      urlPrefixes: state.urlPrefixList,
      logoPrefixes: state.logoPrefixList,
      movieCategories: Array.from(state.movieCategories),
      liveCategories: Array.from(state.liveCategories),
      seriesKeys: writtenSeriesKeys
    };
  },

  /**
   * Full pipeline for one server: download -> process -> save -> update indexes.
   * statusCallback receives status updates for UI progress rendering.
   */
  async importServerContent(server, statusCallback){
    const report = (patch) => { if(statusCallback) statusCallback(patch); };
    try{
      report({ phase:'download', status:'processing', downloaded:0, total:null, speed:0 });
      const startTime = Date.now();
      let lastLoaded = 0;
      let lastTime = startTime;

      const text = await ServerModule.downloadPlaylist(server.url, (loaded, total)=>{
        const now = Date.now();
        const dt = (now - lastTime) / 1000;
        let speed = 0;
        if(dt > 0.2){
          speed = (loaded - lastLoaded) / dt;
          lastLoaded = loaded;
          lastTime = now;
        }
        report({ phase:'download', status:'processing', downloaded: loaded, total: total, speed: speed });
      });

      report({ phase:'download', status:'done', downloaded: text.length, total: text.length });
      report({ phase:'cleanup', status:'processing' });

      // Só CAPTURA quais chaves são do conteúdo antigo (leitura, não
      // apaga nada ainda) — a remoção de verdade acontece DEPOIS que o
      // conteúdo novo já estiver salvo, em segundo plano, sem travar o
      // "concluído" esperando apagar tudo antes de poder escrever o novo.
      const oldContentKeys = await IDB.getContentKeysForServer(server.id);
      const oldSeriesKeys = await IDB.getSeriesKeysForServer(server.id);

      report({ phase:'process', status:'processing', processed:0, total:0, counts:{movie:0,series:0,live:0} });

      let latestCounts = { movie:0, series:0, live:0 };
      const result = await ServerModule.processPlaylistText(
        text, server.id,
        (processed, total, counts) => {
          latestCounts = counts;
          report({ phase:'process', status:'processing', processed, total, counts });
        },
        (chunksDone, chunksTotal) => {
          // Progresso da fase de salvar agora é por "lotes concluídos", já
          // que vários lotes são salvos em paralelo enquanto o resto do
          // arquivo ainda está sendo processado — não dá mais pra reportar
          // item a item de forma precisa nesse esquema.
          report({ phase:'save', status:'processing', processed: chunksDone, total: chunksTotal, counts: latestCounts, chunkMode: true });
        }
      );

      report({ phase:'process', status:'done', processed: result.total, total: result.total, counts: result.counts });

      server.urlPrefixes = result.urlPrefixes;
      server.logoPrefixes = result.logoPrefixes;
      server.movieCategories = result.movieCategories;
      server.liveCategories = result.liveCategories;
      server.counts = result.counts;
      server.lastStatus = 'ok';
      server.lastError = null;
      try{ await IDB.put(STORES.servers, server); }catch(e){}

      // Limpeza do conteúdo antigo roda em segundo plano — NÃO travamos o
      // retorno da função esperando isso terminar. O conteúdo novo já está
      // salvo e utilizável; por alguns instantes pode haver duplicação
      // (antigo + novo) até essa limpeza terminar, mas isso é bem mais
      // rápido que esperar apagar tudo antes de começar a escrever.
      //
      // IMPORTANTE: seriesKey é determinístico (servidor+nome da série),
      // então reimportar o MESMO servidor gera as MESMAS chaves de série
      // de antes — diferente do id de filme/ao vivo (sempre novo/aleatório
      // a cada import). Sem filtrar isso, a limpeza em segundo plano
      // apagava séries que tinham acabado de ser regravadas com a mesma
      // chave, fazendo elas "sumirem" mesmo tendo sido salvas corretamente.
      const newSeriesKeySet = new Set(result.seriesKeys);
      const seriesKeysSafeToDelete = oldSeriesKeys.filter(k => !newSeriesKeySet.has(k));
      (async () => {
        try{
          await IDB.deleteContentByKeys(oldContentKeys);
          await IDB.deleteSeriesByKeys(seriesKeysSafeToDelete);
          const oldIdsWithProgress = oldContentKeys.filter(id => State.progress.has(id));
          for(const id of oldIdsWithProgress){ State.progress.delete(id); }
          await IDB.deleteMany(STORES.progress, oldIdsWithProgress).catch(()=>{});
          State.pageCache.clear();
          State.dashboardCache = null;
          State.favoritesCache = null;
          State.continueCache = null;
        }catch(e){}
      })();

      return { ok:true, count: result.total };
    }catch(err){
      const message = err && err.status ? ('Erro ' + err.status) : (err && err.message ? err.message : 'Erro desconhecido');
      report({ phase: 'error', status:'error', message: message });

      server.lastStatus = 'error';
      server.lastError = message;
      try{ await IDB.put(STORES.servers, server); }catch(e){}

      return { ok:false, error: err };
    }
  },

  /**
   * Runs importServerContent for multiple servers with a concurrency limit.
   */
  async importManyServers(servers, concurrency, onServerUpdate, onOverallUpdate){
    let idx = 0;
    let completed = 0;
    const total = servers.length;
    const results = [];

    function updateOverall(){
      if(onOverallUpdate) onOverallUpdate({ completed, total });
    }
    updateOverall();

    async function worker(){
      while(idx < servers.length){
        const myIndex = idx++;
        const server = servers[myIndex];
        const result = await ServerModule.importServerContent(server, (patch)=>{
          if(onServerUpdate) onServerUpdate(server, patch);
        });
        results[myIndex] = result;
        completed++;
        updateOverall();
      }
    }

    const workerCount = Math.min(concurrency, servers.length) || 1;
    const workers = [];
    for(let i=0;i<workerCount;i++) workers.push(worker());
    await Promise.all(workers);
    return results;
  },

  /**
   * Pipelined import: ALL downloads start simultaneously (no limit).
   * As soon as each download finishes successfully, it enters a processing
   * queue with a limited concurrency (processConcurrency). Servers whose
   * download fails (404, network error, etc.) are marked as error and are
   * simply skipped in the processing phase — the next successfully
   * downloaded playlist takes its place in the queue.
   *
   * onFirstSuccess is called exactly once, the first time any server
   * finishes processing successfully.
   */
  async importManyServersPipelined(servers, processConcurrency, onServerUpdate, onOverallUpdate, onFirstSuccess){
    const total = servers.length;
    let completed = 0;
    let firstSuccessFired = false;
    const results = new Array(total);

    function updateOverall(){
      if(onOverallUpdate) onOverallUpdate({ completed, total });
    }
    updateOverall();

    // Simple async queue: producers (downloads) push items, consumers (processing workers) pop them.
    const queue = [];
    const waiters = [];
    let remainingDownloads = total;
    let queueClosed = false;

    function pushQueue(item){
      if(waiters.length > 0){
        const resolve = waiters.shift();
        resolve(item);
      } else {
        queue.push(item);
      }
    }
    function popQueue(){
      if(queue.length > 0){
        return Promise.resolve(queue.shift());
      }
      if(queueClosed){
        return Promise.resolve(null);
      }
      return new Promise(resolve => waiters.push(resolve));
    }
    function markDownloadSettled(){
      remainingDownloads--;
      if(remainingDownloads <= 0){
        queueClosed = true;
        while(waiters.length > 0){
          const resolve = waiters.shift();
          resolve(null);
        }
      }
    }

    // Kick off ALL downloads simultaneously (no concurrency limit).
    servers.forEach(function(server, idx){
      const report = function(patch){ if(onServerUpdate) onServerUpdate(server, patch); };
      report({ phase:'download', status:'processing', downloaded:0, total:null, speed:0 });
      let lastLoaded = 0;
      let lastTime = Date.now();

      ServerModule.downloadPlaylist(server.url, function(loaded, tot){
        const now = Date.now();
        const dt = (now - lastTime) / 1000;
        let speed = 0;
        if(dt > 0.2){
          speed = (loaded - lastLoaded) / dt;
          lastLoaded = loaded;
          lastTime = now;
        }
        report({ phase:'download', status:'processing', downloaded: loaded, total: tot, speed: speed });
      }).then(function(text){
        report({ phase:'download', status:'done', downloaded: text.length, total: text.length });
        pushQueue({ server: server, idx: idx, text: text });
        markDownloadSettled();
      }).catch(function(err){
        const message = err && err.status ? ('Erro ' + err.status) : (err && err.message ? err.message : 'Erro desconhecido');
        report({ phase:'error', status:'error', message: message });
        results[idx] = { ok:false, error: err };
        server.lastStatus = 'error';
        server.lastError = message;
        IDB.put(STORES.servers, server).catch(function(){});
        completed++;
        updateOverall();
        markDownloadSettled();
      });
    });

    // Processing workers with limited concurrency, pulling from the queue as downloads complete.
    async function processingWorker(){
      while(true){
        const item = await popQueue();
        if(item === null) break; // queue closed and drained: nothing left to process
        const server = item.server;
        const idx = item.idx;
        const text = item.text;
        const report = function(patch){ if(onServerUpdate) onServerUpdate(server, patch); };

        try{
          report({ phase:'cleanup', status:'processing' });

          // Só CAPTURA as chaves antigas (não apaga ainda) — a remoção de
          // verdade acontece DEPOIS, em segundo plano, sem travar o
          // "concluído" desse servidor esperando apagar tudo antes.
          const oldContentKeys = await IDB.getContentKeysForServer(server.id);
          const oldSeriesKeys = await IDB.getSeriesKeysForServer(server.id);

          report({ phase:'process', status:'processing', processed:0, total:0, counts:{movie:0,series:0,live:0} });

          var latestCounts = { movie:0, series:0, live:0 };
          const result = await ServerModule.processPlaylistText(
            text, server.id,
            function(processed, tot, counts){
              latestCounts = counts;
              report({ phase:'process', status:'processing', processed: processed, total: tot, counts: counts });
            },
            function(chunksDone, chunksTotal){
              report({ phase:'save', status:'processing', processed: chunksDone, total: chunksTotal, counts: latestCounts, chunkMode: true });
            }
          );

          report({ phase:'process', status:'done', processed: result.total, total: result.total, counts: result.counts });
          results[idx] = { ok:true, count: result.total };
          server.urlPrefixes = result.urlPrefixes;
          server.logoPrefixes = result.logoPrefixes;
          server.movieCategories = result.movieCategories;
          server.liveCategories = result.liveCategories;
          server.counts = result.counts;
          server.lastStatus = 'ok';
          server.lastError = null;
          IDB.put(STORES.servers, server).catch(function(){});

          // Limpa o cache assim que ESSE servidor termina — não espera
          // todos os outros acabarem. Sem isso, navegar (mesmo minimizado)
          // enquanto outros servidores ainda importam mostrava o cache
          // antigo (vazio, de antes da importação começar), mesmo com os
          // dados deste servidor já salvos e prontos no banco.
          State.pageCache.clear();
          State.dashboardCache = null;
          State.favoritesCache = null;
          State.continueCache = null;

          // Apaga o conteúdo antigo em segundo plano — NÃO trava aqui
          // esperando terminar. Pode haver duplicação (antigo+novo) por
          // um instante curto até isso terminar.
          //
          // IMPORTANTE: filtra as chaves de série que acabaram de ser
          // regravadas com o MESMO seriesKey (determinístico, servidor+
          // nome) — sem isso, reimportar o mesmo servidor apagava as
          // séries que tinham acabado de ser salvas de novo.
          var newSeriesKeySet = new Set(result.seriesKeys);
          var seriesKeysSafeToDelete = oldSeriesKeys.filter(function(k){ return !newSeriesKeySet.has(k); });
          (function(){
            (async function(){
              try{
                await IDB.deleteContentByKeys(oldContentKeys);
                await IDB.deleteSeriesByKeys(seriesKeysSafeToDelete);
                const oldIdsWithProgress = oldContentKeys.filter(function(id){ return State.progress.has(id); });
                for(const id of oldIdsWithProgress){ State.progress.delete(id); }
                await IDB.deleteMany(STORES.progress, oldIdsWithProgress).catch(function(){});
                State.pageCache.clear();
                State.dashboardCache = null;
                State.favoritesCache = null;
                State.continueCache = null;
              }catch(e){}
            })();
          })();

          if(!firstSuccessFired){
            firstSuccessFired = true;
            if(onFirstSuccess) onFirstSuccess();
          }
        }catch(err){
          const message = err && err.message ? err.message : 'Erro ao processar playlist';
          report({ phase:'error', status:'error', message: message });
          results[idx] = { ok:false, error: err };
          server.lastStatus = 'error';
          server.lastError = message;
          IDB.put(STORES.servers, server).catch(function(){});
        }

        completed++;
        updateOverall();
      }
    }

    const workerCount = Math.min(processConcurrency, total) || 1;
    const workers = [];
    for(let i=0;i<workerCount;i++) workers.push(processingWorker());
    await Promise.all(workers);
    return results;
  }
};

/* ======================================================================
   RAW JSON MODULE (automatic servers)
   ====================================================================== */
const RawModule = {
  async fetchAndParseRaw(rawUrl){
    const response = await fetch(rawUrl);
    if(!response.ok){
      throw new Error('Falha ao baixar JSON Raw (HTTP ' + response.status + ')');
    }
    const text = await response.text();
    let json;
    try{
      json = JSON.parse(text);
    }catch(err){
      throw new Error('JSON Raw inválido');
    }
    if(typeof json !== 'object' || json === null || Array.isArray(json)){
      throw new Error('Formato de JSON Raw inesperado (esperado objeto chave->url)');
    }
    return json;
  },

  /**
   * Given the raw json { NAME: url, ... }, user, pass -> creates/updates
   * automatic server records (permanent) and returns array of server objects.
   */
  async buildServersFromRaw(json, user, pass, rawUrl){
    const serverObjs = [];
    for(const key in json){
      if(!Object.prototype.hasOwnProperty.call(json, key)) continue;
      const originalUrl = json[key];
      if(typeof originalUrl !== 'string' || !originalUrl) continue;
      const finalUrl = ServerModule.substituteCredentials(originalUrl, user, pass);
      const server = await ServerModule.upsertAutoServer(key, finalUrl, {
        rawUrl: rawUrl,
        originalUrlTemplate: originalUrl
      });
      serverObjs.push(server);
    }
    return serverObjs;
  }
};

/* ======================================================================
   PROGRESS MODULE
   ====================================================================== */
const ProgressModule = {
  async saveProgress(contentId, currentTime, duration, seriesKey){
    if(!contentId) return;
    const pct = duration > 0 ? Math.min(100, (currentTime/duration)*100) : 0;
    const concluded = pct >= 95;
    const progress = {
      contentId: contentId,
      currentTime: currentTime,
      duration: duration,
      porcentagem: pct,
      dataUltimaReproducao: Date.now(),
      concluido: concluded,
      seriesKey: seriesKey || undefined // presente só quando é episódio de série
    };
    State.progress.set(contentId, progress);
    State.dashboardCache = null;
    State.continueCache = null;
    try{ await IDB.put(STORES.progress, progress); }catch(err){}
  },
  getProgress(contentId){
    return State.progress.get(contentId) || null;
  },
  /** Remove o progresso de um item, deixando-o como "não iniciado" — some
   * do Continuar Assistindo. */
  async resetProgress(contentId){
    State.progress.delete(contentId);
    State.dashboardCache = null;
    State.continueCache = null;
    try{ await IDB.delete(STORES.progress, contentId); }catch(e){}
  },
  getContinueWatchingCount(){
    let count = 0;
    for(const [, prog] of State.progress){ if(!prog.concluido && prog.porcentagem > 0) count++; }
    return count;
  },
  async getContinueWatchingList(limit){
    const entries = [];
    for(const [contentId, prog] of State.progress){
      if(prog.concluido) continue;
      if(prog.porcentagem <= 0) continue;
      entries.push({ contentId, prog });
    }
    entries.sort((a,b)=> b.prog.dataUltimaReproducao - a.prog.dataUltimaReproducao);
    const limited = limit ? entries.slice(0, limit) : entries;
    const results = [];
    for(const { contentId, prog } of limited){
      let content = null;
      if(prog.seriesKey){
        // Episódio de série: vive na store própria seriesEpisodes agora,
        // separada do resumo leve. Fallback pra dados salvos numa versão
        // anterior (episódios ainda embutidos no resumo).
        const record = await IDB.getByKey(STORES.seriesEpisodes, prog.seriesKey).catch(()=>null);
        if(record && record.episodes){
          content = record.episodes.find(ep => ep.id === contentId);
        } else {
          const summary = await IDB.getByKey(STORES.seriesSummary, prog.seriesKey).catch(()=>null);
          content = summary && summary.episodes ? summary.episodes.find(ep => ep.id === contentId) : null;
        }
      } else {
        content = await IDB.getByKey(STORES.contents, contentId).catch(()=>null);
      }
      if(!content || content.tipo === 'live') continue;
      results.push({ content, progress: prog });
    }
    return results;
  }
};

/* ======================================================================
   SERIES NAVIGATION HELPERS (próximo episódio)
   ====================================================================== */
async function getNextEpisode(content){
  if(!content || content.tipo !== 'series' || !content.seriesKey) return null;
  const episodes = await QueryModule.getEpisodesForSeries(content.seriesKey);
  const withSE = episodes.map(c => {
    // Prioriza season/episode já salvos (compactEpisodeNames) — evita
    // reprocessar regex à toa; cai pra extração do nome só quando não tem
    // (dado antigo ou nomeação que não foi reconhecida).
    const se = (c.season !== undefined && c.episode !== undefined)
      ? { season: c.season, episode: c.episode }
      : ParserModule.extractSeasonEpisode(c.nome);
    return { content: c, season: se.season, episode: se.episode };
  });
  withSE.sort((a,b) => a.season - b.season || a.episode - b.episode);
  const idx = withSE.findIndex(x => x.content.id === content.id);
  if(idx === -1 || idx + 1 >= withSE.length) return null;
  return withSE[idx + 1].content;
}

/* ======================================================================
   PLAYER MODULE
   ====================================================================== */
const PlayerModule = {
  hls: null,
  mpegtsPlayer: null,
  currentContent: null,
  saveInterval: null,
  retryCount: 0,
  maxRetries: 3,
  retryTimer: null,
  playToken: 0, // guards against stale async callbacks after close()/reopen()
  _videoListenersReady: false,
  isUserPaused: false,
  nextEpisodeContent: null,
  _nextEpBtnReady: false,
  _skipNativeAttempt: false,

  open(content){
    this.currentContent = content;
    this.retryCount = 0;
    this.isUserPaused = false;
    this._skipNativeAttempt = false;
    this.playToken++;
    const overlay = qs('#player-overlay');
    const title = qs('#player-title');
    title.textContent = resolveContentName(content);
    if(!content.nome && content.tipo === 'series' && content.seriesKey){
      // Episódio sem nome próprio salvo (compactado) — busca o nome da
      // série pra montar o título completo. Ata "sua" abertura pelo id do
      // conteúdo, pra não sobrescrever o título se o usuário já trocou de
      // vídeo antes dessa busca terminar.
      const openedContentId = content.id;
      IDB.getByKey(STORES.seriesSummary, content.seriesKey).then(summary => {
        if(summary && this.currentContent && this.currentContent.id === openedContentId){
          title.textContent = resolveContentName(content, summary.name);
        }
      }).catch(()=>{});
    }
    overlay.style.display = 'flex';
    overlay.classList.toggle('live-mode', content.tipo === 'live');

    this._ensureVideoListeners();
    this._ensureNextEpisodeButton();
    this._ensurePlayerControls();
    this.cleanup();
    this.hideFallbackBar();
    this._startPlayback(content, this.playToken);
    this._updateNextEpisodeButton(content);
    const video0 = qs('#video-player');
    const speedBtn0 = qs('#player-speed');
    const volumeBtn0 = qs('#player-volume');
    if(speedBtn0) speedBtn0.textContent = (video0.playbackRate || 1) + 'x';
    if(volumeBtn0) volumeBtn0.innerHTML = video0.muted ? this.ICONS.volumeOff : this.ICONS.volumeOn;
    const volumeSlider0 = qs('#player-volume-slider');
    if(volumeSlider0) volumeSlider0.value = video0.muted ? 0 : video0.volume;
    this._showControls();
  },

  _ensureNextEpisodeButton(){
    if(this._nextEpBtnReady) return;
    const btn = qs('#player-next-episode');
    btn.addEventListener('click', ()=>{
      if(!this.nextEpisodeContent) return;
      // Marca o episódio que está sendo pulado como assistido, mesmo que
      // o usuário não tenha chegado ao fim dele — ele escolheu avançar.
      if(this.currentContent){
        ProgressModule.saveProgress(this.currentContent.id, 1, 1, this.currentContent.seriesKey);
      }
      this.open(this.nextEpisodeContent);
    });
    this._nextEpBtnReady = true;
  },

  async _updateNextEpisodeButton(content){
    const btn = qs('#player-next-episode');
    if(content && content.tipo === 'series'){
      const token = this.playToken;
      const next = await getNextEpisode(content);
      if(token !== this.playToken) return; // usuário já trocou de vídeo
      this.nextEpisodeContent = next;
      btn.style.display = next ? 'inline-flex' : 'none';
    } else {
      this.nextEpisodeContent = null;
      btn.style.display = 'none';
    }
  },

  _controlsReady: false,
  _hideControlsTimer: null,
  _isSeeking: false,

  // Ícones desenhados em SVG (inspirados nos controles nativos do
  // navegador) em vez de emoji — rendem igual em qualquer sistema e ficam
  // mais "limpos"/consistentes com o resto da interface.
  ICONS: {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
    seekBack5: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-9.36L1 10"/></svg><span>5</span>',
    seekFwd5: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-9.36L23 10"/></svg><span>5</span>',
    volumeOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="10.5 4.5 5.5 8.5 2 8.5 2 15.5 5.5 15.5 10.5 19.5 10.5 4.5" fill="currentColor" stroke="none"/><path d="M15.3 8.3a5 5 0 0 1 0 7.4"/><path d="M18.6 5a9.5 9.5 0 0 1 0 14"/></svg>',
    volumeOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="10.5 4.5 5.5 8.5 2 8.5 2 15.5 5.5 15.5 10.5 19.5 10.5 4.5" fill="currentColor" stroke="none"/><line x1="22.5" y1="8.5" x2="16.5" y2="14.5"/><line x1="16.5" y1="8.5" x2="22.5" y2="14.5"/></svg>',
    // "Entrar" em tela cheia: 4 cantos abrindo pra fora.
    fullscreenEnter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>',
    // "Sair" da tela cheia: o MESMO desenho, só que invertido (cantos
    // fechando pra dentro) — pedido explícito, em vez de um X genérico.
    fullscreenExit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>',
    pip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="8" height="6" rx="1" fill="currentColor" stroke="none"/></svg>'
  },

  /**
   * Controles customizados (play/pause, barra de progresso, mostrar/esconder
   * por atividade, atalhos de teclado). Tudo isso substitui os controles
   * nativos do <video> (removidos do HTML) porque o navegador não expõe
   * como customizar seu comportamento de auto-esconder, e os atalhos de
   * teclado nativos só funcionam depois de um clique inicial no vídeo — o
   * usuário pediu que funcionassem sempre, sem esse clique prévio.
   */
  _ensurePlayerControls(){
    if(this._controlsReady) return;
    const overlay = qs('#player-overlay');
    const video = qs('#video-player');
    const playPauseBtn = qs('#player-playpause');
    const seekTrack = qs('#player-seek-track');
    const seekBack5Btn = qs('#player-seek-back5');
    const seekFwd5Btn = qs('#player-seek-fwd5');
    const speedBtn = qs('#player-speed');
    const speedMenu = qs('#player-speed-menu');
    const volumeBtn = qs('#player-volume');
    const fullscreenBtn = qs('#player-fullscreen');
    const pipBtn = qs('#player-pip');

    seekBack5Btn.innerHTML = this.ICONS.seekBack5;
    seekFwd5Btn.innerHTML = this.ICONS.seekFwd5;
    fullscreenBtn.innerHTML = this.ICONS.fullscreenEnter;
    pipBtn.innerHTML = this.ICONS.pip;
    volumeBtn.innerHTML = this.ICONS.volumeOn;

    const speeds = [0.5, 0.75, 1, 1.25, 1.5, 2];
    speeds.forEach((s) => {
      const opt = el('button', {}, [s + 'x']);
      opt.addEventListener('click', (e) => {
        e.stopPropagation();
        video.playbackRate = s;
        speedBtn.textContent = s + 'x';
        speedMenu.classList.remove('open');
        qsa('#player-speed-menu button').forEach(b => b.classList.toggle('active', b.textContent === s + 'x'));
      });
      speedMenu.appendChild(opt);
    });

    const showAndSchedule = () => { this._showControls(); this._scheduleHideControls(); };

    // Qualquer atividade (mouse ou teclado) reaparece os controles.
    overlay.addEventListener('mousemove', showAndSchedule);
    overlay.addEventListener('mousedown', showAndSchedule);
    overlay.addEventListener('touchstart', showAndSchedule);
    overlay.addEventListener('keydown', showAndSchedule);

    // Clique no vídeo alterna play/pause; DUPLO clique entra/sai da tela cheia.
    video.addEventListener('click', () => { this.togglePlayPause(); });
    video.addEventListener('dblclick', () => { this.toggleFullscreen(); });

    playPauseBtn.addEventListener('click', (e) => { e.stopPropagation(); this.togglePlayPause(); });

    seekBack5Btn.addEventListener('click', (e) => { e.stopPropagation(); this.seekBy(-5); });
    seekFwd5Btn.addEventListener('click', (e) => { e.stopPropagation(); this.seekBy(5); });

    // Clicar no botão de velocidade agora ABRE UM MENU com as opções, em
    // vez de ciclar sozinho sem mostrar quais opções existem.
    speedBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      speedMenu.classList.toggle('open');
      if(speedMenu.classList.contains('open')){
        qsa('#player-speed-menu button').forEach(b => b.classList.toggle('active', b.textContent === video.playbackRate + 'x'));
      }
    });
    document.addEventListener('click', () => { speedMenu.classList.remove('open'); });

    volumeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      video.muted = !video.muted;
      volumeBtn.innerHTML = video.muted ? this.ICONS.volumeOff : this.ICONS.volumeOn;
    });

    const volumeSlider = qs('#player-volume-slider');
    volumeSlider.value = video.volume;
    volumeSlider.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      video.volume = v;
      video.muted = v === 0;
      volumeBtn.innerHTML = (v === 0 || video.muted) ? this.ICONS.volumeOff : this.ICONS.volumeOn;
    });
    volumeSlider.addEventListener('click', (e) => e.stopPropagation());

    // Barra de buffer: mostra quanto do vídeo já foi baixado à frente da
    // reprodução (o navegador já faz esse buffer progressivo sozinho pra
    // <video src>; aqui só deixamos isso visível).
    video.addEventListener('progress', () => this._updateBufferedUI());

    fullscreenBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      this.toggleFullscreen();
    });
    document.addEventListener('fullscreenchange', () => {
      fullscreenBtn.innerHTML = document.fullscreenElement ? this.ICONS.fullscreenExit : this.ICONS.fullscreenEnter;
    });

    pipBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      try{
        if(document.pictureInPictureElement){
          await document.exitPictureInPicture();
        } else if(video.requestPictureInPicture){
          await video.requestPictureInPicture();
        } else {
          showToast('Picture-in-Picture não é suportado neste navegador.', 'error');
        }
      }catch(err){
        showToast('Não foi possível ativar o Picture-in-Picture.', 'error');
      }
    });

    // Ao entrar no PiP, esconde o player em tela cheia — a tela por trás
    // (série/filmes/etc.) fica visível e navegável enquanto o vídeo continua
    // tocando na janela flutuante do sistema operacional.
    video.addEventListener('enterpictureinpicture', () => {
      if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
      qs('#player-overlay').style.display = 'none';
    });
    // Ao sair do PiP (fechar a janelinha ou clicar "voltar à aba"), volta a
    // mostrar o player normalmente, sem reiniciar a reprodução.
    video.addEventListener('leavepictureinpicture', () => {
      if(this.currentContent){
        qs('#player-overlay').style.display = 'flex';
      }
    });

    seekTrack.addEventListener('click', (e) => {
      if(this.currentContent && this.currentContent.tipo === 'live') return;
      if(!video.duration || isNaN(video.duration)) return;
      const rect = seekTrack.getBoundingClientRect();
      const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      video.currentTime = pct * video.duration;
      this._updateSeekUI();
    });

    // Atalhos de teclado SEMPRE ativos enquanto o player está aberto — sem
    // precisar clicar no vídeo primeiro. Guardado por overlay visível pra
    // não interferir em nenhum outro lugar do app (ex: campos de texto).
    document.addEventListener('keydown', (e) => {
      if(overlay.style.display !== 'flex') return;
      if(e.key === 'Escape'){
        e.preventDefault();
        this.goBack();
      } else if(e.key === ' ' || e.code === 'Space'){
        e.preventDefault(); // evita rolar a página
        this.togglePlayPause();
        showAndSchedule();
      } else if(e.key === 'ArrowRight'){
        this.seekBy(10);
        showAndSchedule();
      } else if(e.key === 'ArrowLeft'){
        this.seekBy(-10);
        showAndSchedule();
      }
    });

    this._controlsReady = true;
  },

  /**
   * Mostra por um instante um indicador central (ícone + "±Ns") confirmando
   * visualmente que o avanço/retrocesso aconteceu — sem isso, nada deixava
   * claro que o seek tinha de fato ocorrido.
   */
  _showSeekFeedback(deltaSeconds){
    const indicator = qs('#player-seek-feedback');
    const icon = deltaSeconds >= 0 ? this.ICONS.seekFwd5 : this.ICONS.seekBack5;
    indicator.innerHTML = icon.replace('<span>5</span>', '') + '<span>' + (deltaSeconds >= 0 ? '+' : '') + deltaSeconds + 's</span>';
    indicator.classList.remove('show');
    void indicator.offsetWidth; // força reflow pra reiniciar a animação em cliques seguidos
    indicator.classList.add('show');
    clearTimeout(this._seekFeedbackTimer);
    this._seekFeedbackTimer = setTimeout(() => indicator.classList.remove('show'), 600);
  },

  seekBy(deltaSeconds){
    const video = qs('#video-player');
    if(this.currentContent && this.currentContent.tipo === 'live') return;
    if(deltaSeconds > 0 && !video.duration) return;
    video.currentTime = Math.max(0, deltaSeconds > 0 && video.duration ? Math.min(video.duration, video.currentTime + deltaSeconds) : video.currentTime + deltaSeconds);
    this._updateSeekUI();
    this._showSeekFeedback(deltaSeconds);
  },

  toggleFullscreen(){
    const overlay = qs('#player-overlay');
    if(document.fullscreenElement){
