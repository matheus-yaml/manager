<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StreamManager - Gerenciador de Playlists M3U</title>

<!-- ============================================================
     VERSÃO DO APP — mude só este número quando lançar uma nova versão.
     ============================================================ -->
<script>const APP_VERSION = '1.0.7';</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<style>
:root{
  --bg-0:#06070c;
  --bg-1:rgba(22,24,36,.55);
  --bg-1-solid:#12141f;
  --bg-2:rgba(255,255,255,.05);
  --bg-3:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.09);
  --border-strong:rgba(255,255,255,.18);
  --text-0:#ffffff;
  --text-1:#c3c7d6;
  --text-2:#888ea2;
  --accent:#4d7dff;
  --accent-rgb:77,125,255;
  --accent-2:#22d3ee;
  --accent2-rgb:34,211,238;
  --fav:#ec4899;
  --fav-rgb:236,72,153;
  --accent-3:#34d399;
  --warn:#38bdf8;
  --danger:#ef4444;
  --radius:16px;
  --radius-sm:10px;
  --sidebar-w:260px;
  --blur:22px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  height:100%;
  color:var(--text-0);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden;
  letter-spacing:-.01em;
}
body{
  background-color:var(--bg-0);
  background-image:
    radial-gradient(1100px 750px at 12% -8%, rgba(var(--accent-rgb),.32), transparent 60%),
    radial-gradient(950px 700px at 108% 8%, rgba(var(--accent2-rgb),.20), transparent 55%),
    radial-gradient(900px 650px at 45% 115%, rgba(var(--accent-rgb),.16), transparent 60%),
    radial-gradient(600px 500px at 85% 90%, rgba(var(--fav-rgb),.10), transparent 60%);
  background-attachment:fixed;
  background-repeat:no-repeat;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:10px;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2);}

button{
  font-family:inherit;
  cursor:pointer;
  border:none;
  outline:none;
  background:none;
  color:inherit;
}
input,select{
  font-family:inherit;
  outline:none;
  background:var(--bg-2);
  border:1px solid var(--border);
  color:var(--text-0);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  font-size:14px;
  transition:border-color .15s, background .15s;
}
input:focus,select:focus{border-color:var(--accent);background:rgba(var(--accent-rgb),.08);}
input::placeholder{color:var(--text-2);}
a{color:inherit;text-decoration:none;}

/* Foco visível — essencial pra navegação por controle remoto (TV/projetor)
   e teclado. Sem isso, dá pra "navegar" botão a botão sem NUNCA saber onde
   está o cursor. Usa :focus normal (não :focus-visible) de propósito —
   :focus-visible é relativamente recente e pode não existir em WebViews
   mais antigos (a regra simplesmente seria ignorada nesse caso, quebrando
   o foco visível justamente onde ele é mais necessário). */
button:focus,
a:focus,
[tabindex]:focus,
.nav-item:focus,
.content-card:focus{
  outline:3px solid var(--accent);
  outline-offset:2px;
  box-shadow:0 0 0 6px rgba(var(--accent-rgb),.25);
}
.content-card:focus{ transform:translateY(-4px); }
.nav-item:focus{ background:var(--bg-2); }

#app{
  display:flex;
  height:100vh;
  width:100vw;
  position:relative;
}

/* ===== SIDEBAR (vidro fosco) ===== */
#sidebar{
  width:var(--sidebar-w);
  min-width:var(--sidebar-w);
  background:var(--bg-1);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);backdrop-filter:blur(var(--blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  transition:transform .25s ease;
  z-index:50;
  box-shadow:inset -1px 0 0 rgba(255,255,255,.07);
}
#sidebar .brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:22px 20px;
  border-bottom:1px solid var(--border);
}
#sidebar .brand .logo{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;color:#fff;
  box-shadow:0 4px 16px -2px rgba(var(--accent-rgb),.55), inset 0 1px 0 rgba(255,255,255,.35);
}
#sidebar .brand .name{font-weight:800;font-size:16.5px;letter-spacing:-.02em;}
#sidebar .brand .name span{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.nav-list{list-style:none;padding:12px;flex:1;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;
  border-radius:var(--radius-sm);
  color:var(--text-1);
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  margin-bottom:3px;
  transition:background .15s, color .15s;
  position:relative;
  user-select:none;
}
.nav-item .ic{width:18px;text-align:center;font-size:15px;opacity:.9;}
.nav-item:hover{background:var(--bg-2);color:var(--text-0);}
.nav-item.active{
  background:linear-gradient(135deg, rgba(var(--accent-rgb),.30), rgba(var(--accent2-rgb),.14));
  color:var(--text-0);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1), inset 0 0 0 1px rgba(var(--accent-rgb),.4), 0 0 18px -4px rgba(var(--accent-rgb),.5);
}
.nav-item.active::before{
  content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));border-radius:2px;
  box-shadow:0 0 8px 0 rgba(var(--accent-rgb),.8);
}
.nav-item .count{
  margin-left:auto;font-size:11px;background:var(--bg-3);
  color:var(--text-2);padding:2px 7px;border-radius:20px;font-weight:700;
}
.nav-item.active .count{background:var(--accent);color:#fff;}
.nav-section-label{
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-2);padding:14px 14px 6px;font-weight:700;
}

#sidebar .footer-mini{
  padding:14px 18px;border-top:1px solid var(--border);
  font-size:11px;color:var(--text-2);
}

#sidebar-overlay{
  display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(4,5,10,.6);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);z-index:40;
}
#menu-toggle{
  display:none;position:fixed;top:14px;left:14px;z-index:60;
  width:40px;height:40px;background:var(--bg-1);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));
  border:1px solid var(--border);
  border-radius:12px;align-items:center;justify-content:center;font-size:18px;
}

/* ===== MAIN ===== */
#main{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  min-width:0;
}
#topbar{
  display:flex;align-items:center;gap:16px;
  padding:18px 28px;
  border-bottom:1px solid var(--border);
  background:rgba(10,11,18,.4);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);backdrop-filter:blur(var(--blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);
}
#topbar h1{font-size:20px;font-weight:800;white-space:nowrap;letter-spacing:-.02em;}
#global-search-wrap{flex:1;max-width:520px;position:relative;}
#global-search{
  width:100%;padding:11px 14px 11px 40px;background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:24px;font-size:14px;
}
#global-search-wrap .sic{
  position:absolute;left:15px;top:50%;transform:translateY(-50%);
  color:var(--text-2);pointer-events:none;display:flex;align-items:center;
}
#global-search-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:var(--text-2);font-size:16px;display:none;padding:4px;
}

#content-load-bar{
  padding:9px 28px;background:rgba(var(--accent-rgb),.08);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
}
#content-load-bar span{font-size:11.5px;color:var(--text-2);white-space:nowrap;}
#content-load-bar .progress-track{flex:1;height:4px;}

#content-area{
  flex:1;
  overflow-y:auto;
  padding:24px 28px 60px;
}

/* section header row */
.section-header{
  display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;
}
.section-header h2{font-size:18px;font-weight:800;margin-right:auto;letter-spacing:-.01em;}
.btn{
  padding:10px 17px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;
  background:var(--bg-2);color:var(--text-0);border:1px solid var(--border);
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:background .15s, border-color .15s, transform .1s;
}
.btn:hover{background:var(--bg-3);border-color:var(--border-strong);}
.btn:active{transform:scale(.97);}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),#6a4ce0);
  border-color:transparent;color:#fff;
  box-shadow:0 8px 26px -6px rgba(var(--accent-rgb),.8), inset 0 1px 0 rgba(255,255,255,.32);
}
.btn.primary:hover{filter:brightness(1.15);}
.btn.danger{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.35);color:var(--danger);}
.btn.danger:hover{background:rgba(239,68,68,.16);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.small{padding:7px 12px;font-size:12px;}

/* filter chip row */
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{
  padding:8px 15px;border-radius:20px;font-size:12.5px;font-weight:700;
  background:var(--bg-2);border:1px solid var(--border);color:var(--text-1);
  white-space:nowrap;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:background .15s, color .15s, border-color .15s;
}
.chip:hover{background:var(--bg-3);color:var(--text-0);border-color:var(--border-strong);}
.chip.active{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:transparent;color:#fff;
  box-shadow:0 4px 14px -4px rgba(var(--accent-rgb),.6);
}

.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
.filter-row select{min-width:160px;}

/* grid of cards */
.card-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(164px,1fr));
  gap:18px;
}
.content-card{
  background:var(--bg-1);
  -webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;cursor:pointer;
  transition:transform .22s cubic-bezier(.2,.8,.2,1), border-color .22s, box-shadow .22s;
  display:flex;flex-direction:column;
  position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 2px 10px -4px rgba(0,0,0,.4);
}
.content-card::after{
  content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:var(--radius);
  padding:1px;pointer-events:none;opacity:0;transition:opacity .22s;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.content-card:hover{
  transform:translateY(-6px);
  border-color:transparent;
  box-shadow:0 20px 40px -12px rgba(0,0,0,.65), 0 0 0 1px rgba(var(--accent-rgb),.4), 0 0 34px -2px rgba(var(--accent-rgb),.5), inset 0 1px 0 rgba(255,255,255,.12);
}
.content-card:hover::after{opacity:1;}
.content-card .thumb{
  width:100%;aspect-ratio:2/3;background:var(--bg-3);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.content-card .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s;}
.content-card:hover .thumb img{transform:scale(1.05);}
.content-card .thumb::before{
  content:"";position:absolute;left:0;right:0;bottom:0;height:55%;
  background:linear-gradient(180deg,transparent,rgba(6,7,12,.75));
  pointer-events:none;
}
.content-card .thumb .ph{font-size:30px;color:var(--text-2);z-index:1;}
.content-card .fav-btn{
  position:absolute;top:8px;right:8px;width:29px;height:29px;border-radius:50%;
  background:rgba(10,11,18,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:#fff;z-index:2;transition:transform .15s, background .15s;
}
.content-card .fav-btn:hover{transform:scale(1.12);background:rgba(10,11,18,.8);}
.content-card .fav-btn.active{color:var(--fav);}
.content-card .progress-bar-mini{
  position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,.18);z-index:1;
}
.content-card .progress-bar-mini .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.content-card .live-badge{
  position:absolute;top:8px;left:8px;background:var(--danger);color:#fff;font-size:9px;
  font-weight:800;padding:3px 7px;border-radius:5px;letter-spacing:.06em;z-index:1;
  box-shadow:0 2px 8px -2px rgba(239,68,68,.7);
}
.content-card .info{padding:10px 11px 12px;display:flex;flex-direction:column;gap:5px;flex:1;}
.content-card .info .name{font-size:12.5px;font-weight:700;line-height:1.35;color:var(--text-0);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;}
.content-card .info .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;}
.content-card .info .server-tag{
  font-size:10px;color:var(--text-2);background:var(--bg-2);padding:3px 8px;border-radius:7px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px;font-weight:600;
}
.content-card .info .cat-tag{font-size:10px;color:var(--text-2);font-weight:600;}

.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:70px 20px;color:var(--text-2);text-align:center;gap:10px;
  background:var(--bg-1);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius);
}
.empty-state .big-ic{font-size:44px;opacity:.6;}
.empty-state h3{color:var(--text-0);font-size:16px;font-weight:700;}
.empty-state p{font-size:13px;max-width:360px;}

/* pagination */
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:26px;flex-wrap:wrap;}
.pagination button{
  min-width:36px;height:36px;border-radius:10px;background:var(--bg-1);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid var(--border);font-size:13px;color:var(--text-1);font-weight:600;
  transition:background .15s, border-color .15s;
}
.pagination button:hover:not(:disabled){background:var(--bg-3);border-color:var(--border-strong);}
.pagination button.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;}
.pagination button:disabled{opacity:.35;}

/* servers */
.server-section-title{font-size:12.5px;font-weight:800;color:var(--text-2);text-transform:uppercase;
  letter-spacing:.07em;margin:24px 0 12px;}
.server-list{display:flex;flex-direction:column;gap:10px;}
.server-item{
  background:var(--bg-1);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));
  border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  transition:border-color .15s;
}
.server-item:hover{border-color:var(--border-strong);}
.server-item .sinfo{flex:1;min-width:180px;}
.server-item .sname{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:9px;}
.server-item .surl{font-size:11.5px;color:var(--text-2);word-break:break-all;margin-top:3px;max-width:520px;}
.server-item .sstats{font-size:11.5px;color:var(--text-2);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-3);display:inline-block;
  box-shadow:0 0 8px 0 rgba(52,211,153,.7);}
.status-dot.error{background:var(--danger);box-shadow:0 0 8px 0 rgba(239,68,68,.7);}
.status-dot.processing{background:var(--warn);animation:pulse 1s infinite;box-shadow:0 0 8px 0 rgba(56,189,248,.7);}
.status-dot.updating{animation:pulse 1s infinite;} /* mantém a cor (verde/vermelha), só pisca enquanto atualiza */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.server-item .sactions{display:flex;gap:8px;}

/* add server form */
.form-card{
  background:var(--bg-1);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));
  border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;margin-bottom:20px;
}
.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.form-group{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px;}
.form-group label{font-size:12.5px;color:var(--text-2);font-weight:700;}
.form-group .hint{font-size:11px;color:var(--text-2);opacity:.8;}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-1);}
.checkbox-row input{width:16px;height:16px;padding:0;}

/* modal */
.modal-overlay{
  position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(4,5,10,.72);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;
}
.modal-box{
  background:rgba(20,22,34,.82);-webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid var(--border-strong);border-radius:var(--radius);
  width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:24px;
  box-shadow:0 24px 60px -12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
}
.modal-box h3{font-size:17px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-weight:800;}
.modal-close-x{margin-left:auto;font-size:20px;color:var(--text-2);cursor:pointer;transition:color .15s;}
.modal-close-x:hover{color:var(--text-0);}

/* progress modal */
.progress-overall{margin-bottom:16px;}
.progress-overall .plabel{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);margin-bottom:6px;}
.progress-track{width:100%;height:8px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;}
.progress-track .pfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:6px;transition:width .2s;}
.server-progress-list{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto;}
.sp-item{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;}
.sp-item .sp-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:6px;}
.sp-item .sp-name{font-weight:700;display:flex;align-items:center;gap:7px;}
.sp-item .sp-status{color:var(--text-2);}
.sp-item .sp-status.ok{color:var(--accent-3);}
.sp-item .sp-status.err{color:var(--danger);}
.sp-item .sp-status.proc{color:var(--warn);}
.sp-item .progress-track{height:5px;}
.sp-item .sp-detail{font-size:11px;color:var(--text-2);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;}

/* series detail */
.series-header{display:flex;gap:22px;margin-bottom:26px;flex-wrap:wrap;}
.series-header .cover{width:180px;min-width:140px;aspect-ratio:2/3;border-radius:var(--radius);
  background:var(--bg-2);overflow:hidden;border:1px solid var(--border);
  box-shadow:0 16px 40px -12px rgba(0,0,0,.6);}
.series-header .cover img{width:100%;height:100%;object-fit:cover;}
.series-header .sinfo2{flex:1;min-width:220px;}
.series-header .sinfo2 h2{font-size:23px;margin-bottom:9px;font-weight:800;letter-spacing:-.01em;}
.season-block h4{font-size:14.5px;margin:0;color:var(--text-0);font-weight:800;}
.episode-row{
  display:flex;align-items:center;gap:12px;background:var(--bg-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:8px;cursor:pointer;
  transition:border-color .15s, background .15s;
}
.episode-row:hover{border-color:var(--accent);background:rgba(var(--accent-rgb),.08);}
.episode-row .eth{width:60px;height:38px;border-radius:7px;background:var(--bg-3);overflow:hidden;flex-shrink:0;}
.episode-row .eth img{width:100%;height:100%;object-fit:cover;}
.episode-row .ename{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.episode-row .estatus{font-size:11.5px;color:var(--text-2);white-space:nowrap;}
.episode-row .estatus.done{color:var(--accent-3);}
.episode-row .eprog{width:80px;height:4px;background:var(--bg-3);border-radius:4px;overflow:hidden;flex-shrink:0;}
.episode-row .eprog .f{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));}

/* player */
#player-overlay{
  position:fixed;top:0;right:0;bottom:0;left:0;background:#000;z-index:300;display:none;flex-direction:column;
}
#player-overlay video{flex:1;width:100%;height:100%;background:#000;position:relative;z-index:1;}
#player-buffering{
  position:absolute;top:0;left:0;right:0;bottom:0;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;
  background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:2;pointer-events:none;
}
#player-buffering .spinner{width:34px;height:34px;border-width:3px;}
#player-buffering span{color:#fff;font-size:13px;}
#player-topbar{
  position:absolute;top:0;left:0;right:0;padding:18px 22px;display:flex;align-items:center;gap:14px;
  background:linear-gradient(180deg,rgba(0,0,0,.82),transparent);z-index:5;
  /* Evita o topbar ficar embaixo do notch/câmera em celulares com tela
     recortada, quando o vídeo está em fullscreen. Se o navegador não
     suportar env(), essa linha é ignorada e o padding de cima fica valendo. */
  padding-top:calc(18px + env(safe-area-inset-top, 0px));
}
#player-topbar .ptitle{font-size:15px;font-weight:700;}
#player-close{font-size:22px;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);width:38px;height:38px;border-radius:50%;transition:background .15s;}
#player-close:hover{background:rgba(255,255,255,.2);}
#player-back{font-size:20px;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);width:38px;height:38px;border-radius:50%;flex-shrink:0;transition:background .15s;}
#player-back:hover{background:rgba(255,255,255,.2);}

#player-topbar, #player-controls-bottom{
  transition:opacity .25s ease, transform .25s ease;
  opacity:1;
  z-index:5;
}
/* Garante que os controles fiquem visíveis também dentro da Fullscreen API
   nativa (:fullscreen), inclusive nos navegadores mais antigos com prefixo. */
#player-overlay:fullscreen, #player-overlay:-webkit-full-screen, #player-overlay:-moz-full-screen{
  width:100%;height:100%;
}
#player-overlay.controls-hidden #player-topbar{opacity:0;transform:translateY(-6px);pointer-events:none;}
#player-overlay.controls-hidden #player-controls-bottom{opacity:0;transform:translateY(6px);pointer-events:none;}
#player-overlay.controls-hidden{cursor:none;}

#player-controls-bottom{
  position:absolute;bottom:0;left:0;right:0;z-index:2;
  padding:16px 22px 20px;display:flex;align-items:center;gap:14px;
  background:linear-gradient(0deg,rgba(0,0,0,.82),transparent);
  /* No celular em pé + fullscreen, a barra de navegação do Android (os
     botões de voltar/home/recentes na tela, ou a faixa de gestos) fica por
     cima dos controles. Empurra os controles pra cima do espaço "seguro"
     que o próprio sistema informa. Ignorado se o navegador não suportar
     env(), mantendo o padding de baixo (20px) de antes. */
  padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));
}
#player-playpause{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;color:#fff;
  background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;transition:background .15s;
}
#player-playpause:hover{background:rgba(255,255,255,.24);}
#player-playpause svg{width:18px;height:18px;}
.player-ctrl-btn{
  height:34px;min-width:34px;padding:0 10px;border-radius:17px;flex-shrink:0;font-size:11px;font-weight:700;color:#fff;
  background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;gap:3px;transition:background .15s;
}
.player-ctrl-btn:hover{background:rgba(255,255,255,.24);}
.player-ctrl-btn svg{width:16px;height:16px;flex-shrink:0;}
#player-fullscreen svg{width:18px;height:18px;} /* um pouco maior, mais visível */
#player-volume-wrap{position:relative;display:flex;align-items:center;flex-shrink:0;}
#player-volume-slider-wrap{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  width:36px;height:0;overflow:hidden;
  background:rgba(20,22,34,.9);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--border-strong);border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  transition:height .2s ease;
  box-shadow:0 12px 32px -8px rgba(0,0,0,.6);
}
#player-volume-wrap:hover #player-volume-slider-wrap{height:104px;}
#player-volume-slider{
  -webkit-appearance:none;appearance:none;
  width:80px;height:4px;background:rgba(255,255,255,.25);border-radius:4px;
  padding:0;border:none;cursor:pointer;
  transform:rotate(-90deg); /* horizontal vira vertical: esquerda(min) embaixo, direita(max) em cima */
}
#player-volume-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:12px;height:12px;border-radius:50%;background:#fff;
  box-shadow:0 2px 4px rgba(0,0,0,.4);cursor:pointer;
}
#player-volume-slider::-moz-range-thumb{
  width:12px;height:12px;border-radius:50%;background:#fff;border:none;
  box-shadow:0 2px 4px rgba(0,0,0,.4);cursor:pointer;
}
#player-volume-slider::-moz-range-track{background:rgba(255,255,255,.25);height:4px;border-radius:4px;}
#player-time-current,#player-time-duration{color:#fff;font-size:12.5px;font-weight:600;flex-shrink:0;min-width:42px;text-align:center;}
#player-seek-track{
  flex:1;height:5px;background:rgba(255,255,255,.22);border-radius:4px;cursor:pointer;position:relative;
}
#player-seek-track:hover{height:7px;}
#player-buffered-fill{
  position:absolute;top:0;left:0;height:100%;border-radius:4px;
  background:rgba(255,255,255,.35);width:0%;
}
#player-seek-fill{
  height:100%;border-radius:4px;width:0%;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  position:relative;
}
#player-seek-fill::after{
  content:"";position:absolute;right:-6px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.4);opacity:0;transition:opacity .15s;
}
/* Feedback visual ao avançar/retroceder — sem isso, nada confirmava
   visualmente que o seek aconteceu. */
#player-seek-feedback{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);
  background:rgba(10,11,18,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.15);border-radius:50px;
  padding:14px 22px;display:none;align-items:center;gap:8px;
  color:#fff;font-size:15px;font-weight:700;z-index:3;pointer-events:none;
  opacity:0;transition:opacity .18s, transform .18s;
}
#player-seek-feedback.show{display:flex;opacity:1;transform:translate(-50%,-50%) scale(1);}
#player-playpause-feedback{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.7);
  width:76px;height:76px;border-radius:50%;
  background:rgba(10,11,18,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;
  color:#fff;z-index:3;pointer-events:none;
  opacity:0;transition:opacity .25s, transform .25s;
}
#player-playpause-feedback.show{display:flex;opacity:1;transform:translate(-50%,-50%) scale(1);}
#player-playpause-feedback svg{width:34px;height:34px;}
#player-seek-feedback svg{width:22px;height:22px;}
/* Menu de opções de velocidade */
#player-speed-menu{
  display:none;position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
  background:rgba(20,22,34,.9);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--border-strong);border-radius:12px;padding:6px;
  flex-direction:column;gap:2px;min-width:70px;box-shadow:0 12px 32px -8px rgba(0,0,0,.6);
}
#player-speed-menu.open{display:flex;}
#player-speed-menu button{
  padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:700;color:#fff;text-align:center;
  transition:background .15s;
}
#player-speed-menu button:hover{background:rgba(255,255,255,.14);}
#player-speed-menu button.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));}
#player-seek-track:hover #player-seek-fill::after{opacity:1;}
#player-overlay.live-mode #player-seek-track,
#player-overlay.live-mode #player-time-current,
#player-overlay.live-mode #player-time-duration,
#player-overlay.live-mode #player-seek-back5,
#player-overlay.live-mode #player-seek-fwd5{display:none;}

/* sidebar-search counters */
.search-counters{padding:8px 14px;font-size:11.5px;color:var(--text-2);}
.search-counters .sc-line{display:flex;justify-content:space-between;padding:3px 0;}

/* toast */
#toast-wrap{position:fixed;bottom:20px;right:20px;z-index:500;display:flex;flex-direction:column;gap:10px;}
.toast{
  background:rgba(20,22,34,.85);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  padding:13px 17px;font-size:13px;max-width:320px;box-shadow:0 12px 32px -8px rgba(0,0,0,.55);
  animation:toastIn .2s ease;font-weight:600;
}
.toast.error{border-color:rgba(239,68,68,.5);}
.toast.success{border-color:rgba(52,211,153,.5);}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px;}
.dash-card{background:var(--bg-1);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius);padding:19px;
  transition:border-color .15s, transform .15s;}
.dash-card:hover{border-color:var(--border-strong);transform:translateY(-2px);}
.dash-card .dnum{font-size:27px;font-weight:800;background:linear-gradient(135deg,var(--text-0),var(--text-1));
  -webkit-background-clip:text;background-clip:text;}
.dash-card .dlabel{font-size:12.5px;color:var(--text-2);margin-top:4px;font-weight:600;}

.settings-block{background:var(--bg-1);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;margin-bottom:20px;}
.settings-block h3{font-size:15px;margin-bottom:16px;font-weight:800;}

/* responsive */
@media(max-width:900px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #sidebar-overlay.open{display:block;}
  #menu-toggle{display:flex;}
  #topbar{padding:14px 16px 14px 62px;}
  #content-area{padding:16px 16px 60px;}
  #topbar h1{display:none;}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
}
@media(max-width:480px){
  .modal-box{padding:18px;}
  .form-group{min-width:100%;}
}

/* Player em telas estreitas (celular): botões e espaçamentos menores, e o
   fundo do controle rola na horizontal como último recurso, pra nunca
   cortar um botão fora da tela sem acesso. */
@media(max-width:640px){
  #player-controls-bottom{
    padding:10px 10px 14px;gap:6px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  #player-playpause{width:34px;height:34px;flex-shrink:0;}
  #player-playpause svg{width:15px;height:15px;}
  .player-ctrl-btn{height:30px;min-width:30px;padding:0 7px;font-size:10px;flex-shrink:0;}
  .player-ctrl-btn svg{width:14px;height:14px;}
  #player-time-current,#player-time-duration{font-size:11px;min-width:32px;flex-shrink:0;}
  #player-seek-track{min-width:60px;}
  #player-topbar{padding:12px 14px;gap:8px;}
  #player-back,#player-close{width:32px;height:32px;font-size:17px;flex-shrink:0;}
  #player-next-episode{font-size:11px;padding:6px 10px;white-space:nowrap;}
  #player-title{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px;}
}
@media(max-width:380px){
  /* Tela realmente pequena: esconde o texto de tempo pra sobrar espaço
     pros botões de ação, que importam mais. */
  #player-time-current,#player-time-duration{display:none;}
  .player-ctrl-btn{padding:0 6px;}
}

.loader-inline{display:flex;align-items:center;gap:10px;color:var(--text-2);font-size:13px;padding:30px;justify-content:center;}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<script>
/* ======================================================================
   STREAMMANAGER - App state & constants
   ====================================================================== */
'use strict';

const DB_NAME = 'StreamManagerDB';
const DB_VERSION = 5;
const STORES = {
  servers: 'servers',
  contents: 'contents',
  progress: 'progress',
  settings: 'settings',
  favorites: 'favorites',
  seriesSummary: 'seriesSummary',
  seriesEpisodes: 'seriesEpisodes', // separado do resumo pra listar/buscar séries continuar leve
  downloadChunks: 'downloadChunks' // temporária: pedaços de texto da playlist, só usada no modo "streaming" (Configurações → Desempenho)
};

// APP_VERSION agora fica lá no topo do arquivo (logo depois do <title>) — fácil de achar e ajustar
const PAGE_SIZE_DEFAULT = 50;
// Downloads/processamento simultâneos e tamanho do lote de gravação agora
// são configuráveis em Configurações → Desempenho (State.settings.performance),
// com valores padrão definidos em DEFAULT_SETTINGS.performance.

/* ======================================================================
   PERSISTENCE WORKER
   ------------------------------------------------------------------
   O verdadeiro custo do "salvando..." é o próprio IndexedDB escrevendo
   milhares de registros em disco — isso é um limite físico do navegador,
   não dá pra reduzir muito mais. O que DÁ pra resolver de verdade é o
   TRAVAMENTO VISUAL: se essa escrita roda na thread principal, a interface
   inteira congela enquanto o navegador processa. Rodando a mesma escrita
   num Web Worker (uma thread separada, com acesso próprio ao IndexedDB do
   mesmo site), a interface continua 100% fluida — você pode clicar,
   rolar, navegar — enquanto o salvamento acontece em paralelo.
   ====================================================================== */
const PersistenceWorker = (function(){
  let worker = null;
  let nextId = 1;
  const pending = new Map(); // id -> {resolve, reject, onProgress}

  function getWorker(){
    if(worker) return worker;
    const src = `
      const DB_NAME = ${JSON.stringify(DB_NAME)};
      const DB_VERSION = ${JSON.stringify(DB_VERSION)};
      const STORES = ${JSON.stringify(STORES)};
      let dbPromise = null;
      function openDB(){
        if(dbPromise) return dbPromise;
        dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          // O schema (stores/índices) já foi criado pela thread principal
          // antes de qualquer import acontecer — o worker só abre a conexão
          // já existente, nunca precisa rodar onupgradeneeded.
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = (e) => reject(e.target.error);
        });
        return dbPromise;
      }
      self.onmessage = async function(e){
        const { id, contents, seriesSummaries, episodeRecords } = e.data;
        const PROGRESS_STEP = 2000; // avisa a cada N registros, não a cada 1 (custo de postMessage por item seria caro)
        try{
          const db = await openDB();
          await new Promise((resolve, reject) => {
            const tx = db.transaction([STORES.contents, STORES.seriesSummary, STORES.seriesEpisodes], 'readwrite', { durability: 'relaxed' });
            const contentStore = tx.objectStore(STORES.contents);
            for(let i=0; i<contents.length; i++){
              contentStore.put(contents[i]);
              if(i > 0 && i % PROGRESS_STEP === 0){
                self.postMessage({ id, progress: i, total: contents.length });
              }
            }
            const seriesStore = tx.objectStore(STORES.seriesSummary);
            for(const v of (seriesSummaries||[])) seriesStore.put(v);
            const episodesStore = tx.objectStore(STORES.seriesEpisodes);
            for(const v of (episodeRecords||[])) episodesStore.put(v);
            // Todos os itens já foram enfileirados — a partir daqui só resta
            // esperar o navegador confirmar a gravação em disco de verdade,
            // uma etapa que NÃO tem como reportar progresso incremental (o
            // IndexedDB não expõe isso). Avisa que entrou nessa fase final
            // pra não parecer travado sem explicação nenhuma.
            self.postMessage({ id, progress: contents.length, total: contents.length, committing: true });
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
          self.postMessage({ id, ok:true, progress: contents.length, total: contents.length });
        }catch(err){
          self.postMessage({ id, ok:false, error: (err && err.message) ? err.message : String(err) });
        }
      };
    `;
    const blob = new Blob([src], { type: 'application/javascript' });
    worker = new Worker(URL.createObjectURL(blob));
    worker.onmessage = function(e){
      const { id, ok, error, progress, total, committing } = e.data;
      const p = pending.get(id);
      if(!p) return;
      if(ok === undefined){
        // Mensagem de progresso intermediária (não é a final ainda).
        if(p.onProgress) p.onProgress(progress, total, committing);
        return;
      }
      pending.delete(id);
      if(ok) p.resolve(); else p.reject(new Error(error || 'Erro ao salvar no worker.'));
    };
    worker.onerror = function(err){
      // Erro genérico do worker (ex: falha ao carregar) — rejeita tudo que
      // estava pendente pra não travar a Promise pra sempre.
      for(const [, p] of pending) p.reject(err);
      pending.clear();
    };
    return worker;
  }

  return {
    /** Envia conteúdos + resumos de série (+ episódios, opcional) pro
     * worker salvar, sem travar a thread principal. `onProgress(processed,
     * total)` é chamado periodicamente conforme a gravação avança. Faz
     * fallback automático pra salvar na própria thread (como antes) se
     * Worker não existir no ambiente. */
    save(contents, seriesSummaries, onProgress, episodeRecords){
      if(typeof Worker === 'undefined'){
        return saveAllInOneTransaction(contents, seriesSummaries, episodeRecords);
      }
      return new Promise((resolve, reject) => {
        const id = nextId++;
        pending.set(id, { resolve, reject, onProgress });
        try{
          getWorker().postMessage({ id, contents, seriesSummaries, episodeRecords });
        }catch(err){
          pending.delete(id);
          // Se falhar ao criar/usar o worker por algum motivo (ambiente
          // restrito etc.), cai de volta pro caminho síncrono de sempre.
          saveAllInOneTransaction(contents, seriesSummaries, episodeRecords).then(resolve, reject);
        }
      });
    }
  };
})();

function hexToRgbString(hex){
  const h = (hex || '').replace('#', '');
  const full = h.length === 3 ? h.split('').map(c=>c+c).join('') : h;
  const num = parseInt(full, 16);
  if(isNaN(num)) return '124,92,255';
  return [(num>>16)&255, (num>>8)&255, num&255].join(',');
}

function qs(sel, root){ return (root||document).querySelector(sel); }

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v === null || v === undefined || v === false) continue;
    if(k === 'class') e.className = v;
    else if(k === 'html') e.innerHTML = v;
    else if(k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  if(children) for(const c of children){ if(c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }
  return e;
}
function escapeHtml(str){
  if(str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

/**
 * Baixa a URL do conteúdo forçando o download de verdade (não abrir aba).
 *
 * O atributo `download` de um <a> só é respeitado pelo navegador quando a
 * URL é do MESMO domínio da página — como as URLs de IPTV são de outro
 * servidor, o navegador ignorava o atributo e só abria o vídeo numa aba
 * nova. A solução é baixar o arquivo via fetch(), transformar em blob (que
 * passa a ser "do mesmo domínio" por ser local), e então disparar o
 * download real a partir desse blob.
 *
 * Isso só funciona se o servidor do vídeo permitir CORS (a maioria dos
 * painéis IPTV permite pra vídeo/live, mas não é garantido). Se falhar,
 * caímos de volta pro método antigo como último recurso.
 */
async function downloadContentUrl(url, filename){
  showToast('Baixando "' + (filename || 'arquivo') + '"...', 'success');
  try{
    const response = await fetch(url);
    if(!response.ok) throw new Error('HTTP ' + response.status);
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = sanitizeFilename(filename) || 'video';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 30000);
  }catch(e){
    // O servidor provavelmente não permite CORS — não tem como ler os
    // bytes via JS nesse caso. Como último recurso, tenta o método antigo
    // (pode abrir numa aba em vez de baixar, dependendo do servidor).
    try{
      const a = document.createElement('a');
      a.href = url;
      a.download = sanitizeFilename(filename) || 'video';
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('O servidor não permitiu baixar direto — abrindo em outra aba.', 'error');
    }catch(e2){
      showToast('Não foi possível baixar este arquivo.', 'error');
    }
  }
}
function sanitizeFilename(name){
  if(!name) return '';
  return name.replace(/[\\/:*?"<>|]+/g, ' ').trim();
}
function showToast(msg, type){
  const wrap = qs('#toast-wrap');
  const t = el('div', { class: 'toast' + (type ? ' ' + type : '') }, [msg]);
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(), 300); }, 4000);
}
