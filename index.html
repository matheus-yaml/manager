function formatBytes(bytes){
  if(!bytes && bytes !== 0) return '--';
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(2) + ' MB';
}
function formatSpeed(bytesPerSec){
  if(!bytesPerSec) return '--';
  return formatBytes(bytesPerSec) + '/s';
}
function normalizeText(str){
  if(!str) return '';
  return String(str)
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
}

/**
 * Yields control back to the browser between processing batches, keeping
 * the UI responsive during large imports. Uses a MessageChannel instead of
 * setTimeout(fn, 0): after a handful of consecutive setTimeout(0) calls in
 * the same tick chain, browsers clamp the delay to ~4ms minimum, which adds
 * up to real wall-clock slowdown over thousands of batches. postMessage via
 * MessageChannel isn't subject to that clamp, so batched processing finishes
 * noticeably faster while still ceding the thread between batches.
 */
function fastYield(){
  return new Promise(function(resolve){
    const channel = new MessageChannel();
    channel.port2.onmessage = function(){ resolve(); };
    channel.port1.postMessage(null);
  });
}

/* ======================================================================
   INDEXEDDB MODULE
   ====================================================================== */
const IDB = {
  open(){
    return new Promise((resolve, reject)=>{
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(e){
        const db = e.target.result;
        const tx = e.target.transaction;
        if(!db.objectStoreNames.contains(STORES.servers)){
          db.createObjectStore(STORES.servers, { keyPath: 'id' });
        }
        let cs;
        if(!db.objectStoreNames.contains(STORES.contents)){
          cs = db.createObjectStore(STORES.contents, { keyPath: 'id' });
        } else {
          cs = tx.objectStore(STORES.contents);
        }
        // v3: 'tipo' e 'serverId' sozinhos foram removidos — cada índice
        // extra na store de conteúdos é uma árvore a mais pra atualizar em
        // TODA gravação, e isso pesa muito em bibliotecas grandes (é a
        // causa raiz do "salvando" lento). tipo_serverId cobre os dois
        // casos sozinho (via range de servidor "vazio" a "fim") sem
        // precisar de índices próprios pra cada um.
        if(cs.indexNames.contains('tipo')) cs.deleteIndex('tipo');
        if(cs.indexNames.contains('serverId')) cs.deleteIndex('serverId');
        if(!cs.indexNames.contains('seriesKey')) cs.createIndex('seriesKey', 'seriesKey', { unique:false });
        if(!cs.indexNames.contains('tipo_serverId')) cs.createIndex('tipo_serverId', ['tipo','serverId'], { unique:false });
        if(!cs.indexNames.contains('tipo_categoria')) cs.createIndex('tipo_categoria', ['tipo','categoria'], { unique:false });

        if(!db.objectStoreNames.contains(STORES.progress)){
          db.createObjectStore(STORES.progress, { keyPath: 'contentId' });
        }
        if(!db.objectStoreNames.contains(STORES.settings)){
          db.createObjectStore(STORES.settings, { keyPath: 'id' });
        }
        if(!db.objectStoreNames.contains(STORES.favorites)){
          db.createObjectStore(STORES.favorites, { keyPath: 'id' });
        }
        if(!db.objectStoreNames.contains(STORES.seriesSummary)){
          const ss = db.createObjectStore(STORES.seriesSummary, { keyPath: 'key' });
          ss.createIndex('serverId', 'serverId', { unique:false });
          ss.createIndex('categorias', 'categorias', { unique:false, multiEntry:true });
        }
        // v4: episódios separados do resumo — listar/buscar séries só toca
        // no resumo leve (nome, capa, contagens), nunca nos episódios em
        // si. Só a tela de detalhe de uma série específica lê daqui.
        if(!db.objectStoreNames.contains(STORES.seriesEpisodes)){
          db.createObjectStore(STORES.seriesEpisodes, { keyPath: 'key' });
        }
        // v5: pedaços de texto da playlist (modo "streaming", opcional em
        // Configurações → Desempenho) — baixa em pedaços pequenos direto
        // pro banco, sem nunca montar o texto inteiro (100MB+) em memória
        // de uma vez. Chave composta serverId+índice do pedaço.
        if(!db.objectStoreNames.contains(STORES.downloadChunks)){
          db.createObjectStore(STORES.downloadChunks, { keyPath: 'key' });
        }
      };
      req.onsuccess = function(e){
        const db = e.target.result;
        // Se outra aba (ou uma versão mais nova do app) precisar mudar o
        // schema do banco, o navegador avisa TODAS as conexões abertas.
        // Sem fechar essa aqui de boa vontade, a outra aba ficaria travada
        // pra sempre esperando, e essa conexão pode acabar num estado
        // inválido (é exatamente o "InvalidStateError: connection is
        // closing" que acontecia sem isso).
        db.onversionchange = function(){
          db.close();
          State.db = null;
          showToast('O app foi atualizado em outra aba. Recarregue esta página pra continuar usando.', 'error');
        };
        // Se a conexão cair sozinha por qualquer outro motivo (o navegador
        // pode fazer isso sob pressão de memória, por exemplo), marcamos
        // como indisponível — assim os métodos abaixo sabem reabrir em vez
        // de tentar usar uma conexão morta.
        db.onclose = function(){ State.db = null; };
        resolve(db);
      };
      req.onerror = function(e){ reject(e.target.error); };
    });
  },
  tx(storeNames, mode, options){
    // `options` (e.g. { durability: 'relaxed' }) is supported by modern
    // browsers for the readwrite transactions used in bulk imports — it
    // tells the engine it doesn't need to guarantee the write is durably
    // flushed to disk before completing, which is significantly faster for
    // importing hundreds of thousands of records. Browsers that don't
    // recognize the extra parameter simply ignore it and behave as before.
    if(options){
      return State.db.transaction(storeNames, mode || 'readonly', options);
    }
    return State.db.transaction(storeNames, mode || 'readonly');
  },
  getAll(storeName){
    return new Promise((resolve, reject)=>{
      try{
        const store = IDB.tx([storeName]).objectStore(storeName);
        const req = store.getAll();
        req.onsuccess = ()=> resolve(req.result || []);
        req.onerror = (e)=> reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  put(storeName, value){
    return new Promise((resolve, reject)=>{
      try{
        const store = IDB.tx([storeName], 'readwrite').objectStore(storeName);
        const req = store.put(value);
        req.onsuccess = ()=> resolve(value);
        req.onerror = (e)=> reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  putMany(storeName, values){
    return new Promise((resolve, reject)=>{
      if(!values || !values.length) return resolve();
      try{
        // Relaxed durability: this is a bulk cache rebuild, not
        // safety-critical data — trading a strict fsync-before-commit
        // guarantee for meaningfully faster bulk writes is a good trade
        // here (worst case on an actual crash mid-import is a re-import).
        const tx = IDB.tx([storeName], 'readwrite', { durability: 'relaxed' });
        const store = tx.objectStore(storeName);
        for(const v of values) store.put(v);
        tx.oncomplete = ()=> resolve();
        tx.onerror = (e)=> reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  delete(storeName, key){
    return new Promise((resolve, reject)=>{
      try{
        const store = IDB.tx([storeName], 'readwrite').objectStore(storeName);
        const req = store.delete(key);
        req.onsuccess = ()=> resolve();
        req.onerror = (e)=> reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  deleteMany(storeName, keys){
    return new Promise((resolve, reject)=>{
      if(!keys || !keys.length) return resolve();
      try{
        const tx = IDB.tx([storeName], 'readwrite', { durability: 'relaxed' });
        const store = tx.objectStore(storeName);
        for(const k of keys) store.delete(k);
        tx.oncomplete = ()=> resolve();
        tx.onerror = (e)=> reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  deleteByIndex(storeName, indexName, value){
    return new Promise((resolve, reject)=>{
      try{
        const tx = IDB.tx([storeName], 'readwrite', { durability: 'relaxed' });
        const store = tx.objectStore(storeName);
        const idx = store.index(indexName);
        // openKeyCursor only enumerates keys, skipping deserialization of
        // the full record value — meaningfully faster than openCursor when
        // all we need is to delete matching records.
        const req = idx.openKeyCursor(IDBKeyRange.only(value));
        req.onsuccess = function(e){
          const cursor = e.target.result;
          if(cursor){ store.delete(cursor.primaryKey); cursor.continue(); }
        };
        tx.oncomplete = ()=> resolve();
        tx.onerror = (e)=> reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  /** Apaga o resumo E os episódios (store separada) de todas as séries de
   * um servidor, numa única transação. A store de episódios não tem índice
   * por servidor (é só key→episódios), então reaproveita as chaves
   * (idênticas às do resumo) coletadas ao apagar o resumo. */
  deleteSeriesDataForServer(serverId){
    return new Promise((resolve, reject)=>{
      try{
        const tx = IDB.tx([STORES.seriesSummary, STORES.seriesEpisodes], 'readwrite', { durability: 'relaxed' });
        const summaryStore = tx.objectStore(STORES.seriesSummary);
        const episodesStore = tx.objectStore(STORES.seriesEpisodes);
        const idx = summaryStore.index('serverId');
        const req = idx.openKeyCursor(IDBKeyRange.only(serverId));
        req.onsuccess = function(e){
          const cursor = e.target.result;
          if(cursor){
            summaryStore.delete(cursor.primaryKey);
            episodesStore.delete(cursor.primaryKey); // mesma chave (seriesKey) nas duas stores
            cursor.continue();
          }
        };
        tx.oncomplete = ()=> resolve();
        tx.onerror = (e)=> reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  getByIndex(storeName, indexName, value){
    return new Promise((resolve, reject)=>{
      try{
        const store = IDB.tx([storeName]).objectStore(storeName);
        const idx = store.index(indexName);
        const req = idx.getAll(IDBKeyRange.only(value));
        req.onsuccess = ()=> resolve(req.result || []);
        req.onerror = (e)=> reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  getByKey(storeName, key){
    return new Promise((resolve, reject)=>{
      try{
        const store = IDB.tx([storeName]).objectStore(storeName);
        const req = store.get(key);
        req.onsuccess = ()=> resolve(req.result || null);
        req.onerror = (e)=> reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  getKeysByIndex(storeName, indexName, value){
    return new Promise((resolve, reject)=>{
      try{
        const store = IDB.tx([storeName]).objectStore(storeName);
        const idx = store.index(indexName);
        const req = idx.openKeyCursor(IDBKeyRange.only(value));
        const keys = [];
        req.onsuccess = function(e){
          const cursor = e.target.result;
          if(cursor){ keys.push(cursor.primaryKey); cursor.continue(); }
          else resolve(keys);
        };
        req.onerror = (e)=> reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  /**
   * Deleta todos os registros de storeName cujo indexName == value, numa
   * ÚNICA varredura do índice (que já deleta cada um encontrado), e
   * retorna as chaves primárias deletadas — pra quem precisa saber quais
   * IDs sumiram (ex: limpar progresso associado) sem precisar percorrer o
   * mesmo índice DUAS vezes (uma pra coletar, outra pra deletar).
   */
  deleteByIndexCombined(storeName, indexName, value){
    return new Promise((resolve, reject)=>{
      try{
        const tx = IDB.tx([storeName], 'readwrite', { durability:'relaxed' });
        const store = tx.objectStore(storeName);
        const idx = store.index(indexName);
        const req = idx.openKeyCursor(IDBKeyRange.only(value));
        const keys = [];
        req.onsuccess = function(e){
          const cursor = e.target.result;
          if(cursor){ keys.push(cursor.primaryKey); store.delete(cursor.primaryKey); cursor.continue(); }
        };
        tx.oncomplete = () => resolve(keys);
        tx.onerror = (e) => reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  /**
   * Deleta TODO o conteúdo de um servidor (Filmes+Séries+AoVivo), numa
   * única transação, usando o índice composto tipo_serverId em vez de um
   * índice 'serverId' solto (removido de propósito — cada índice a menos
   * na store de conteúdos acelera toda gravação). Varre os 3 tipos em
   * sequência dentro da MESMA transação.
   */
  deleteAllContentForServer(serverId){
    return new Promise((resolve, reject)=>{
      try{
        const tx = IDB.tx([STORES.contents], 'readwrite', { durability:'relaxed' });
        const store = tx.objectStore(STORES.contents);
        const idx = store.index('tipo_serverId');
        const types = ['movie','live','series'];
        const keys = [];
        let ti = 0;
        function walkNextType(){
          if(ti >= types.length) return; // transação completa quando não sobrar cursor pendente
          const req = idx.openKeyCursor(IDBKeyRange.only([types[ti], serverId]));
          req.onsuccess = function(e){
            const cursor = e.target.result;
            if(cursor){ keys.push(cursor.primaryKey); store.delete(cursor.primaryKey); cursor.continue(); }
            else { ti++; walkNextType(); }
          };
        }
        walkNextType();
        tx.oncomplete = () => resolve(keys);
        tx.onerror = (e) => reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  /** Só COLETA as chaves de conteúdo de um servidor (filme/ao vivo/série),
   * sem apagar nada — usada antes de reimportar, pra saber depois o que
   * remover, sem travar o salvamento do conteúdo novo esperando o antigo
   * ser apagado primeiro. */
  getContentKeysForServer(serverId){
    return new Promise((resolve, reject)=>{
      try{
        const store = IDB.tx([STORES.contents]).objectStore(STORES.contents);
        const idx = store.index('tipo_serverId');
        const types = ['movie','live','series'];
        const keys = [];
        let ti = 0;
        function walkNextType(){
          if(ti >= types.length){ resolve(keys); return; }
          const req = idx.openKeyCursor(IDBKeyRange.only([types[ti], serverId]));
          req.onsuccess = function(e){
            const cursor = e.target.result;
            if(cursor){ keys.push(cursor.primaryKey); cursor.continue(); }
            else { ti++; walkNextType(); }
          };
          req.onerror = (e) => reject(e.target.error);
        }
        walkNextType();
      }catch(err){ reject(err); }
    });
  },
  /** Apaga registros de conteúdo por chave já conhecida (em vez de varrer
   * um índice de novo) — usado pra limpar o que ficou pra trás depois que
   * o conteúdo novo já foi salvo. */
  deleteContentByKeys(keys){
    return new Promise((resolve, reject)=>{
      try{
        if(!keys || keys.length === 0){ resolve(); return; }
        const tx = IDB.tx([STORES.contents], 'readwrite', { durability:'relaxed' });
        const store = tx.objectStore(STORES.contents);
        for(const k of keys) store.delete(k);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  /** Só COLETA as chaves de série (resumo) de um servidor, sem apagar nada
   * — mesma ideia de getContentKeysForServer, pra série. */
  getSeriesKeysForServer(serverId){
    return new Promise((resolve, reject)=>{
      try{
        const store = IDB.tx([STORES.seriesSummary]).objectStore(STORES.seriesSummary);
        const idx = store.index('serverId');
        const req = idx.openKeyCursor(IDBKeyRange.only(serverId));
        const keys = [];
        req.onsuccess = function(e){
          const cursor = e.target.result;
          if(cursor){ keys.push(cursor.primaryKey); cursor.continue(); }
          else resolve(keys);
        };
        req.onerror = (e) => reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  /** Apaga resumo + episódios (as duas stores, mesma chave) por chave já
   * conhecida — usado pra limpar série antiga depois que a nova já foi
   * salva. */
  deleteSeriesByKeys(keys){
    return new Promise((resolve, reject)=>{
      try{
        if(!keys || keys.length === 0){ resolve(); return; }
        const tx = IDB.tx([STORES.seriesSummary, STORES.seriesEpisodes], 'readwrite', { durability:'relaxed' });
        const summaryStore = tx.objectStore(STORES.seriesSummary);
        const episodesStore = tx.objectStore(STORES.seriesEpisodes);
        for(const k of keys){ summaryStore.delete(k); episodesStore.delete(k); }
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  /**
   * Distinct values of an indexed field within an optional key range, using
   * a 'nextunique' cursor — the browser engine skips duplicate keys
   * internally, which is much cheaper than reading every record.
   */
  getDistinctIndexValues(storeName, indexName, range){
    return new Promise((resolve, reject)=>{
      try{
        const store = IDB.tx([storeName]).objectStore(storeName);
        const idx = store.index(indexName);
        const req = idx.openKeyCursor(range || null, 'nextunique');
        const values = [];
        req.onsuccess = function(e){
          const cursor = e.target.result;
          if(cursor){ values.push(cursor.key); cursor.continue(); }
          else resolve(values);
        };
        req.onerror = (e)=> reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  clear(storeName){
    return new Promise((resolve, reject)=>{
      try{
        const store = IDB.tx([storeName], 'readwrite').objectStore(storeName);
        const req = store.clear();
        req.onsuccess = ()=> resolve();
        req.onerror = (e)=> reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  count(storeName){
    return new Promise((resolve, reject)=>{
      try{
        const store = IDB.tx([storeName]).objectStore(storeName);
        const req = store.count();
        req.onsuccess = ()=> resolve(req.result || 0);
        req.onerror = (e)=> reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  countByIndex(storeName, indexName, value){
    return new Promise((resolve, reject)=>{
      try{
        const store = IDB.tx([storeName]).objectStore(storeName);
        const idx = store.index(indexName);
        const req = idx.count(IDBKeyRange.only(value));
        req.onsuccess = ()=> resolve(req.result || 0);
        req.onerror = (e)=> reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  countByIndexRange(storeName, indexName, range){
    return new Promise((resolve, reject)=>{
      try{
        const store = IDB.tx([storeName]).objectStore(storeName);
        const idx = store.index(indexName);
        const req = idx.count(range);
        req.onsuccess = ()=> resolve(req.result || 0);
        req.onerror = (e)=> reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },
  /**
   * Reads up to `limit` records from storeName whose primary key comes after
   * `afterKey` (exclusive), using a cursor within a short-lived transaction
   * scoped to just this batch. Returns { records, lastKey, done }.
   *
   * This is used instead of a single bulk getAll() for very large stores:
   * getAll() on a store with millions of records has to read everything
   * before resolving, which blocks any progress feedback until it's fully
   * done. Reading in small batches (each its own quick transaction) lets us
   * report real progress from the very first batch, and — critically — lets
   * us yield back to the browser (via setTimeout) BETWEEN batches without
   * hitting IndexedDB's "transaction auto-commits after a task boundary"
   * behavior, since no transaction stays open across the yield.
   */
  getBatchAfter(storeName, afterKey, limit){
    return new Promise((resolve, reject)=>{
      try{
        const store = IDB.tx([storeName]).objectStore(storeName);
        const range = (afterKey !== null && afterKey !== undefined) ? IDBKeyRange.lowerBound(afterKey, true) : null;
        const req = store.openCursor(range);
        const records = [];
        let lastKey = afterKey;
        req.onsuccess = function(e){
          const cursor = e.target.result;
          if(cursor && records.length < limit){
            records.push(cursor.value);
            lastKey = cursor.key;
            cursor.continue();
          } else {
            resolve({ records: records, lastKey: lastKey, done: !cursor });
          }
        };
        req.onerror = function(e){ reject(e.target.error); };
      }catch(err){ reject(err); }
    });
  }
};

/* ======================================================================
   INDEX MODULE (in-memory indexes for performance)
   ====================================================================== */
/* ======================================================================
   QUERY MODULE — consultas paginadas direto no IndexedDB
   ====================================================================== */
const QueryModule = {
  /** Range que cobre "qualquer servidor" pra um tipo, usando o índice
   * composto tipo_serverId — substitui o antigo índice 'tipo' sozinho. */
  _typeRange(type){
    return IDBKeyRange.bound([type, ''], [type, '\uffff']);
  },

  /**
   * Escolhe o índice mais seletivo pros filtros ativos. Quando os dois
   * filtros (servidor E categoria) estão ativos ao mesmo tempo, aplicamos o
   * segundo como pós-filtro durante a varredura do cursor (registros por
   * página são poucos, então isso é barato).
   */
  _pickIndex(type, filters){
    if(filters.server && filters.server !== 'all'){
      return { indexName:'tipo_serverId', range: IDBKeyRange.only([type, filters.server]), extraServer:false, extraCategory: !!(filters.category && filters.category !== 'all') };
    }
    if(filters.category && filters.category !== 'all'){
      return { indexName:'tipo_categoria', range: IDBKeyRange.only([type, filters.category]), extraServer:true, extraCategory:false };
    }
    return { indexName:'tipo_serverId', range: this._typeRange(type), extraServer:false, extraCategory:true };
  },

  async _favoriteIdSet(type){
    const list = await IDB.getAll(STORES.favorites);
    return new Set(list.filter(f => f.type === type).map(f => f.id));
  },

  /**
   * Retorna { items, total } para a página pedida de Filmes/Ao Vivo.
   */
  async getContentPage(type, filters, page, pageSize){
    const favSet = filters.favoritesOnly ? await this._favoriteIdSet(type) : null;
    const { indexName, range, extraServer, extraCategory } = this._pickIndex(type, filters);
    const targetStart = (page - 1) * pageSize;

    // Quando não precisamos filtrar em memória por cima do índice (sem
    // favoritos, e sem precisar cruzar servidor+categoria ao mesmo tempo),
    // dá pra pegar o total via count() nativo do IndexedDB — uma operação
    // dedicada e rápida, sem precisar abrir cursor nem deserializar um
    // registro sequer. Combinado com isso, o cursor de coleta para assim
    // que a página desejada estiver completa, em vez de andar até o fim
    // só pra contar (que era o bug real: abrir Filmes com 168 mil itens
    // sempre andava pelos 168 mil, mesmo mostrando só 50 por vez).
    const needsExtraServerFilter = extraServer && filters.server && filters.server !== 'all';
    const needsExtraCategoryFilter = extraCategory && filters.category && filters.category !== 'all';
    const canUseFastCount = !favSet && !needsExtraServerFilter && !needsExtraCategoryFilter;

    return new Promise((resolve, reject) => {
      try{
        const store = IDB.tx([STORES.contents]).objectStore(STORES.contents);
        const idx = store.index(indexName);

        function collectPage(knownTotal){
          const req = idx.openCursor(range);
          const collected = [];
          let matched = 0, total = 0;
          req.onsuccess = function(e){
            const cursor = e.target.result;
            if(!cursor){ resolve({ items: collected, total: knownTotal !== undefined ? knownTotal : total }); return; }
            const rec = cursor.value;
            let ok = true;
            if(needsExtraServerFilter && rec.serverId !== filters.server) ok = false;
            if(needsExtraCategoryFilter && rec.categoria !== filters.category) ok = false;
            if(ok && favSet && !favSet.has(rec.id)) ok = false;
            if(ok){
              if(matched >= targetStart && collected.length < pageSize){ collected.push(rec); }
              matched++;
              total++;
              // Já sabemos o total de antemão (count nativo) e já
              // coletamos a página inteira — não precisa mais continuar
              // andando pelo resto dos registros só pra confirmar o óbvio.
              if(knownTotal !== undefined && collected.length >= pageSize && matched >= targetStart + pageSize){
                resolve({ items: collected, total: knownTotal });
                return;
              }
            }
            cursor.continue();
          };
          req.onerror = (e) => reject(e.target.error);
        }

        if(canUseFastCount){
          const countReq = idx.count(range);
          countReq.onsuccess = () => collectPage(countReq.result);
          countReq.onerror = (e) => reject(e.target.error);
        } else {
          collectPage(undefined);
        }
      }catch(err){ reject(err); }
    });
  },

  /** Categorias de um tipo (filme/ao vivo), lidas direto da memória — cada
   * servidor já sabe suas próprias categorias desde a importação (ver
   * compactItemIncremental). Isso substitui uma varredura de "valores
   * distintos" no IndexedDB, que na prática escala com o TOTAL de itens
   * daquele tipo em vez de com a quantidade de categorias (o cursor
   * 'nextunique' nem sempre pula duplicados de verdade dependendo do
   * navegador) — era o motivo de Filmes/Séries/Ao Vivo demorarem
   * proporcionalmente ao tamanho da biblioteca só pra abrir a tela. */
  async getCategoriesForType(type){
    const field = type === 'movie' ? 'movieCategories' : 'liveCategories';
    const set = new Set();
    for(const server of State.servers.values()){
      for(const cat of (server[field] || [])) set.add(cat);
    }
    return Array.from(set).sort();
  },

  async getServersForType(type){
    const ids = [];
    for(const server of State.servers.values()){
      const count = server.counts ? server.counts[type] : undefined;
      // Servidores importados antes dessa otimização não têm `counts`
      // salvo — nesse caso, mantém o servidor na lista de qualquer jeito
      // (melhor mostrar um filtro "de mais" do que sumir um servidor da
      // lista até ele ser reimportado).
      if(count === undefined || count > 0) ids.push(server.id);
    }
    return ids;
  },

  /**
   * Mesma lógica de página/filtros, mas sobre o resumo de séries
   * (seriesSummary), que já vem uma linha por série (não por episódio).
   */
  async getSeriesPage(filters, page, pageSize){
    const favIds = new Set((await IDB.getAll(STORES.favorites)).filter(f=>f.type==='series').map(f=>f.id));
    const favSet = filters.favoritesOnly ? favIds : null;
    const targetStart = (page - 1) * pageSize;
    const useServer = filters.server && filters.server !== 'all';
    const useCategory = !useServer && filters.category && filters.category !== 'all';
    // O índice 'categorias' é multiEntry (uma série pode aparecer mais de
    // uma vez nele, uma por categoria) — count() nativo contaria essas
    // repetições, então só usamos o atalho rápido quando NÃO estamos
    // filtrando por categoria (server ou "sem filtro" são seguros).
    const canUseFastCount = !favSet && !useCategory && !(useServer && filters.category && filters.category !== 'all');

    return new Promise((resolve, reject) => {
      try{
        const store = IDB.tx([STORES.seriesSummary]).objectStore(STORES.seriesSummary);

        function openMainCursor(){
          if(useServer) return store.index('serverId').openCursor(IDBKeyRange.only(filters.server));
          if(useCategory) return store.index('categorias').openCursor(IDBKeyRange.only(filters.category));
          return store.openCursor();
        }

        function collectPage(knownTotal){
          const req = openMainCursor();
          const collected = [];
          let matched = 0, total = 0;
          const seen = new Set(); // multiEntry index pode repetir a mesma série p/ cada categoria
          req.onsuccess = function(e){
            const cursor = e.target.result;
            if(!cursor){ resolve({ items: collected, total: knownTotal !== undefined ? knownTotal : total }); return; }
            const rec = cursor.value;
            let ok = !seen.has(rec.key);
            seen.add(rec.key);
            if(ok && useServer && filters.category && filters.category !== 'all' && rec.categorias.indexOf(filters.category) === -1) ok = false;
            if(ok && favSet && !favSet.has(rec.key)) ok = false;
            if(ok){
              if(matched >= targetStart && collected.length < pageSize){ rec.favorito = favIds.has(rec.key); collected.push(rec); }
              matched++;
              total++;
              if(knownTotal !== undefined && collected.length >= pageSize && matched >= targetStart + pageSize){
                resolve({ items: collected, total: knownTotal });
                return;
              }
            }
            cursor.continue();
          };
          req.onerror = (e) => reject(e.target.error);
        }

        if(canUseFastCount){
          const countReq = useServer ? store.index('serverId').count(IDBKeyRange.only(filters.server)) : store.count();
          countReq.onsuccess = () => collectPage(countReq.result);
          countReq.onerror = (e) => reject(e.target.error);
        } else {
          collectPage(undefined);
        }
      }catch(err){ reject(err); }
    });
  },

  async getCategoriesForSeries(){
    const values = await IDB.getDistinctIndexValues(STORES.seriesSummary, 'categorias');
    return values.filter(Boolean).sort();
  },

  async getServersForSeries(){
    const values = await IDB.getDistinctIndexValues(STORES.seriesSummary, 'serverId');
    return values;
  },

  /** Todos os episódios de uma série específica (usado na tela de
   * detalhes). Episódios ficam numa store própria (seriesEpisodes),
   * separada do resumo leve — assim listar/buscar séries nunca precisa
   * carregar episódio nenhum. Fallback: dados salvos numa versão anterior
   * (episódios ainda embutidos no resumo) continuam funcionando até serem
   * reimportados. */
  async getEpisodesForSeries(seriesKey){
    const record = await IDB.getByKey(STORES.seriesEpisodes, seriesKey);
    if(record && record.episodes) return record.episodes;
    const summary = await IDB.getByKey(STORES.seriesSummary, seriesKey);
    return (summary && summary.episodes) ? summary.episodes : [];
  },

  /** Últimos itens adicionados a um servidor (id embute timestamp, então ordem desc de chave ≈ mais recentes primeiro). */
  async getRecentForServer(type, serverId, limit){
    return new Promise((resolve, reject) => {
      try{
        const store = IDB.tx([STORES.contents]).objectStore(STORES.contents);
        const idx = store.index('tipo_serverId');
        const req = idx.openCursor(IDBKeyRange.only([type, serverId]), 'prev');
        const items = [];
        req.onsuccess = function(e){
          const cursor = e.target.result;
          if(!cursor || items.length >= limit){ resolve(items); return; }
          items.push(cursor.value);
          cursor.continue();
        };
        req.onerror = (e) => reject(e.target.error);
      }catch(err){ reject(err); }
    });
  },

  async getRecentSeriesForServer(serverId, limit){
    const all = await IDB.getByIndex(STORES.seriesSummary, 'serverId', serverId);
    all.sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
    return all.slice(0, limit);
  }
};

/* ======================================================================
   SEARCH MODULE (on-demand, varre o IndexedDB ao digitar — ver popup de busca)
   ====================================================================== */
const GlobalSearchModule = {
  async search(term, maxPerType){
    maxPerType = maxPerType || 40;
    const norm = normalizeText(term);
    const result = { movie:[], live:[], series:[] };
    if(!norm) return result;

    const contentScan = (type) => new Promise((resolve) => {
      const store = IDB.tx([STORES.contents]).objectStore(STORES.contents);
      const idx = store.index('tipo_serverId');
      const req = idx.openCursor(QueryModule._typeRange(type));
      req.onsuccess = function(e){
        const cursor = e.target.result;
        if(!cursor || result[type].length >= maxPerType){ resolve(); return; }
        const rec = cursor.value;
        if(normalizeText(rec.nome).indexOf(norm) !== -1 || normalizeText(rec.categoria||'').indexOf(norm) !== -1){
          result[type].push(rec);
        }
        cursor.continue();
      };
      req.onerror = () => resolve();
    });

    const seriesScan = new Promise((resolve) => {
      const store = IDB.tx([STORES.seriesSummary]).objectStore(STORES.seriesSummary);
      const req = store.openCursor();
      req.onsuccess = function(e){
        const cursor = e.target.result;
        if(!cursor || result.series.length >= maxPerType){ resolve(); return; }
        const rec = cursor.value;
        if(normalizeText(rec.name).indexOf(norm) !== -1){
          result.series.push(rec);
        }
        cursor.continue();
      };
      req.onerror = () => resolve();
    });

    // As três varreduras rodam em paralelo (transações de leitura do
    // IndexedDB não bloqueiam entre si), em vez de uma esperar a outra.
    await Promise.all([contentScan('movie'), contentScan('live'), seriesScan]);

    return result;
  }
};

const IndexModule = {

  clearAll(){
    State.contentsById.clear();
    State.indexes.contentsByType.movie.clear();
    State.indexes.contentsByType.series.clear();
    State.indexes.contentsByType.live.clear();
    State.indexes.contentsByServer.clear();
    State.indexes.contentsByCategory.clear();
    State.indexes.contentsByTypeServer.clear();
    State.indexes.favoritesIndex.clear();
    State.indexes.seriesIndex.clear();
    State.indexes.searchIndex.clear();
    State.favoriteSeries.clear();
    State.recentlyAddedByServer.clear();
  },

  _addToSetMap(map, key, id){
    let s = map.get(key);
    if(!s){ s = new Set(); map.set(key, s); }
    s.add(id);
  },
  _removeFromSetMap(map, key, id){
    const s = map.get(key);
    if(s){ s.delete(id); if(s.size===0) map.delete(key); }
  },

  seriesBaseKey(name, serverId){
    const base = ParserModule.extractSeriesBaseName(name);
    return serverId + '::' + normalizeText(base);
  },

  addContent(content){
    if(!content || !content.id) return;
    State.contentsById.set(content.id, content);
    if(content.tipo && State.indexes.contentsByType[content.tipo]){
      State.indexes.contentsByType[content.tipo].add(content.id);
    }
    this._addToSetMap(State.indexes.contentsByServer, content.serverId, content.id);
    const catKey = content.tipo + '::' + (content.categoria || 'Sem categoria');
    this._addToSetMap(State.indexes.contentsByCategory, catKey, content.id);
    const tsKey = content.tipo + '::' + content.serverId;
    this._addToSetMap(State.indexes.contentsByTypeServer, tsKey, content.id);

    if(content.favorito){ State.indexes.favoritesIndex.add(content.id); }

    // search index - normalized text precomputed
    const searchStr = normalizeText((content.nome||'') + ' ' + (content.categoria||''));
    State.indexes.searchIndex.set(content.id, searchStr);

    if(content.tipo === 'series'){
      const baseName = ParserModule.extractSeriesBaseName(content.nome);
      const key = content.serverId + '::' + normalizeText(baseName);
      let entry = State.indexes.seriesIndex.get(key);
      if(!entry){
        entry = {
          key: key,
          name: baseName,
          serverId: content.serverId,
          items: new Set(),
          categories: new Set(),
          logo: content.logo || ''
        };
        State.indexes.seriesIndex.set(key, entry);
      }
      entry.items.add(content.id);
      if(content.categoria) entry.categories.add(content.categoria);
      if(!entry.logo && content.logo) entry.logo = content.logo;
      pushRecentlyAdded(content.serverId, 'series', key);
    } else if(content.tipo === 'movie' || content.tipo === 'live'){
      pushRecentlyAdded(content.serverId, content.tipo, content.id);
    }
  },

  removeContent(content){
    if(!content || !content.id) return;
    State.contentsById.delete(content.id);
    if(content.tipo && State.indexes.contentsByType[content.tipo]){
      State.indexes.contentsByType[content.tipo].delete(content.id);
    }
    this._removeFromSetMap(State.indexes.contentsByServer, content.serverId, content.id);
    const catKey = content.tipo + '::' + (content.categoria || 'Sem categoria');
    this._removeFromSetMap(State.indexes.contentsByCategory, catKey, content.id);
    const tsKey = content.tipo + '::' + content.serverId;
    this._removeFromSetMap(State.indexes.contentsByTypeServer, tsKey, content.id);
    State.indexes.favoritesIndex.delete(content.id);
    State.indexes.searchIndex.delete(content.id);

    if(content.tipo === 'series'){
      const baseName = ParserModule.extractSeriesBaseName(content.nome);
      const key = content.serverId + '::' + normalizeText(baseName);
      const entry = State.indexes.seriesIndex.get(key);
      if(entry){
        entry.items.delete(content.id);
        if(entry.items.size === 0){
          State.indexes.seriesIndex.delete(key);
          removeRecentlyAdded(content.serverId, 'series', key);
        }
      }
    } else if(content.tipo === 'movie' || content.tipo === 'live'){
      removeRecentlyAdded(content.serverId, content.tipo, content.id);
    }
  },

  // Remove all content/index entries belonging to a server (used before re-importing a server)
  removeAllForServer(serverId){
    const ids = State.indexes.contentsByServer.get(serverId);
    if(!ids) return;
    const idsCopy = Array.from(ids);
    for(const id of idsCopy){
      const content = State.contentsById.get(id);
      if(content) this.removeContent(content);
    }
    State.indexes.contentsByServer.delete(serverId);
  },

  async toggleFavoriteContent(content){
    content.favorito = !content.favorito;
    try{
      if(content.tipo === 'series' && content.seriesKey){
        // Episódio de série vive na store própria seriesEpisodes agora —
        // IndexedDB não faz update parcial de campo dentro de um array,
        // então precisa reescrever o registro inteiro (só os episódios
        // daquela série, não o resumo leve) pra persistir a mudança. Ação
        // rara (favoritar), então o custo de reler+regravar é aceitável.
        const record = await IDB.getByKey(STORES.seriesEpisodes, content.seriesKey);
        if(record && record.episodes){
          const ep = record.episodes.find(e => e.id === content.id);
          if(ep) ep.favorito = content.favorito;
          await IDB.put(STORES.seriesEpisodes, record);
        } else {
          // Fallback: dado salvo numa versão anterior (episódios ainda
          // embutidos no resumo da série).
          const summary = await IDB.getByKey(STORES.seriesSummary, content.seriesKey);
          if(summary && summary.episodes){
            const ep = summary.episodes.find(e => e.id === content.id);
            if(ep) ep.favorito = content.favorito;
            await IDB.put(STORES.seriesSummary, summary);
          }
        }
      } else {
        await IDB.put(STORES.contents, content);
      }
      if(content.favorito) await IDB.put(STORES.favorites, { id: content.id, type: content.tipo });
      else await IDB.delete(STORES.favorites, content.id);
    }catch(e){}
    // Sem invalidar o cache de página: o objeto `content` já é a MESMA
    // referência guardada em State.pageCache (veio de lá), então a mutação
    // acima já reflete pra próxima vez que a página for renderizada — sem
    // precisar refazer a consulta ao banco (o que causava aquele "reload"
    // visual da tela inteira só por favoritar um item).
    State.dashboardCache = null;
    State.favoritesCache = null;
  },

  async toggleFavoriteSeries(seriesKey){
    const existing = await IDB.getByKey(STORES.favorites, seriesKey).catch(()=>null);
    try{
      if(existing){ await IDB.delete(STORES.favorites, seriesKey); }
      else{ await IDB.put(STORES.favorites, { id: seriesKey, type: 'series' }); }
    }catch(e){}
    State.dashboardCache = null;
    State.favoritesCache = null;
  },

  rebuildFromScratch(allContents){
    this.clearAll();
    for(const c of allContents){
      this.addContent(c);
    }
  },

  // get set of ids for type + optional server/category filters, returns Set
  getFilteredIds(type, opts){
    opts = opts || {};
    let base;
    if(opts.server && opts.server !== 'all'){
      base = State.indexes.contentsByTypeServer.get(type + '::' + opts.server) || new Set();
    } else {
      base = State.indexes.contentsByType[type] || new Set();
    }
    let result = base;
    if(opts.category && opts.category !== 'all'){
      const catSet = State.indexes.contentsByCategory.get(type + '::' + opts.category) || new Set();
      result = intersectSets(result, catSet);
    }
    if(opts.favoritesOnly){
      result = intersectSets(result, State.indexes.favoritesIndex);
    }
    if(opts.searchIds){
      result = intersectSets(result, opts.searchIds);
    }
    return result;
  }
};

function intersectSets(a, b){
  if(!a || !b) return new Set();
  const [small, big] = a.size <= b.size ? [a,b] : [b,a];
  const out = new Set();
  for(const v of small){ if(big.has(v)) out.add(v); }
  return out;
}
