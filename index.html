let minimizedPillEl = null;

function removeMinimizedPill(){
  if(minimizedPillEl){ minimizedPillEl.remove(); minimizedPillEl = null; }
}

function showMinimizedPill(overlay, getLabelText){
  removeMinimizedPill();
  const pill = el('div', {
    id: 'import-minimized-pill',
    style: 'position:fixed;bottom:20px;left:20px;z-index:400;background:var(--bg-2);border:1px solid var(--border);border-radius:24px;padding:10px 18px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.45);font-size:13px;color:var(--text-0);'
  });
  // Texto primeiro, ícone (spinner/check) depois — fica à direita do texto.
  pill.appendChild(el('span', { id:'import-minimized-label' }, [getLabelText()]));
  pill.appendChild(el('div', { class:'spinner', id:'import-minimized-spinner' }));
  pill.addEventListener('click', function(){
    overlay.style.display = 'flex';
    removeMinimizedPill();
  });
  document.body.appendChild(pill);
  minimizedPillEl = pill;
  return pill;
}

/** Troca o spinner por um check verde (parado, sem girar) e o texto por
 * "Concluído", depois some sozinho depois de 3s — em vez de sumir abrupto
 * ou ficar preso pra sempre esperando alguém clicar em "Fechar". */
function showMinimizedPillDoneThenRemove(text){
  if(!minimizedPillEl) return;
  const spinner = qs('#import-minimized-spinner', minimizedPillEl);
  if(spinner){
    // Precisa tirar a CLASSE 'spinner' (não só o estilo de borda) — ela é
    // quem carrega a animação de girar infinita; só zerar a borda não
    // impedia o ícone de continuar girando.
    spinner.className = '';
    spinner.style.border = 'none';
    spinner.style.width = '16px';
    spinner.style.height = '16px';
    spinner.style.animation = 'none';
    spinner.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  }
  updateMinimizedPillText(text);
  setTimeout(removeMinimizedPill, 3000);
}

function updateMinimizedPillText(text){
  if(!minimizedPillEl) return;
  const label = qs('#import-minimized-label', minimizedPillEl);
  if(label) label.textContent = text;
}

async function runImportWithProgressModal(servers){
  if(State.ui.isImporting){ showToast('Já existe uma importação em andamento.', 'error'); return; }
  State.ui.isImporting = true;

  const overlay = el('div', { class:'modal-overlay' });
  const box = el('div', { class:'modal-box' });

  const isSingleServer = servers.length === 1;
  const minimizeBtn = el('button', { class:'btn small', id:'minimize-import-btn', style: isSingleServer ? 'margin-left:auto;' : 'display:none;margin-left:auto;' }, ['Minimizar']);
  const titleRow = el('h3', { style:'display:flex;align-items:center;gap:10px;' }, [
    el('span', {}, ['Processando Servidores']),
    minimizeBtn
  ]);
  box.appendChild(titleRow);

  const overallWrap = el('div', { class:'progress-overall' });
  const overallLabel = el('div', { class:'plabel' }, [el('span',{},['Progresso geral']), el('span',{id:'overall-count'},['0 / '+servers.length])]);
  const overallTrack = el('div', { class:'progress-track' }, [el('div',{class:'pfill', id:'overall-fill', style:'width:0%'})]);
  overallWrap.appendChild(overallLabel);
  overallWrap.appendChild(overallTrack);
  box.appendChild(overallWrap);

  const listWrap = el('div', { class:'server-progress-list', id:'sp-list' });
  const spElements = new Map();
  for(const s of servers){
    const item = el('div', { class:'sp-item', id:'sp-'+s.id });
    item.appendChild(el('div', { class:'sp-top' }, [
      el('span', { class:'sp-name' }, [el('span',{class:'status-dot processing'}), s.nome]),
      el('span', { class:'sp-status proc' }, ['Aguardando...'])
    ]));
    item.appendChild(el('div', { class:'progress-track' }, [el('div',{class:'pfill', style:'width:0%'})]));
    item.appendChild(el('div', { class:'sp-detail' }, ['']));
    listWrap.appendChild(item);
    spElements.set(s.id, item);
  }
  box.appendChild(listWrap);

  const closeBtnWrap = el('div', { style:'margin-top:16px;text-align:right;', id:'import-close-wrap' });
  box.appendChild(closeBtnWrap);

  overlay.appendChild(box);
  qs('#modal-root').appendChild(overlay);

  let lastCompleted = 0;
  let lastTotal = servers.length;
  let importFullyDone = false;

  minimizeBtn.addEventListener('click', function(){
    // Se a importação já terminou de vez (usuário demorou pra fechar e
    // clicou em "Minimizar" por engano/hábito), faz o mesmo efeito de
    // "Fechar" — sem isso, criava um pill minimizado que nenhum código
    // nunca mais limpava sozinho (a limpeza automática já tinha rodado
    // uma vez, antes desse clique).
    if(importFullyDone){
      overlay.remove();
      Router.render();
      return;
    }
    overlay.style.display = 'none';
    showMinimizedPill(overlay, function(){ return 'Importando servidores... ' + lastCompleted + '/' + lastTotal; });
  });

  function updateServerUI(server, patch){
    // Estado global (não é só do modal) — a tela de Servidores lê isso pra
    // fazer a bolinha piscar, mesmo se você estiver lá enquanto uma
    // importação roda minimizada em segundo plano.
    const wasUpdating = State.ui.serversUpdating.has(server.id);
    const isDone = patch.phase === 'process' && patch.status === 'done';
    const isError = patch.phase === 'error';
    if(isDone || isError){
      State.ui.serversUpdating.delete(server.id);
    } else {
      State.ui.serversUpdating.add(server.id);
    }
    if((wasUpdating !== State.ui.serversUpdating.has(server.id)) && State.ui.currentView === 'servers'){
      Router.render();
    }

    const item = spElements.get(server.id);
    if(!item) return;
    const statusEl = item.querySelector('.sp-status');
    const dotEl = item.querySelector('.status-dot');
    const fillEl = item.querySelector('.pfill');
    const detailEl = item.querySelector('.sp-detail');

    // As fases "process" e "save" são as ativamente em andamento (não só
    // baixando em paralelo) — mover o item pro topo da lista deixa claro,
    // de relance, qual servidor está sendo trabalhado agora, sem precisar
    // rolar pra achar. Só move quando ainda está em progresso (não ao
    // finalizar), e só se já não estiver lá.
    const isActivelyWorking = (patch.phase === 'process' || patch.phase === 'save') && patch.status !== 'done';
    if(isActivelyWorking && listWrap.firstElementChild !== item){
      listWrap.insertBefore(item, listWrap.firstElementChild);
    }

    if(patch.phase === 'download'){
      dotEl.className = 'status-dot processing';
      statusEl.className = 'sp-status proc';
      statusEl.textContent = patch.status === 'done' ? 'Download concluído, na fila' : 'Baixando...';
      let pct = 0;
      if(patch.total){ pct = Math.min(100, (patch.downloaded/patch.total)*100); }
      fillEl.style.width = (patch.status==='done' ? 100 : pct) + '%';
      detailEl.textContent = formatBytes(patch.downloaded) + (patch.total ? ' / ' + formatBytes(patch.total) : '') + (patch.speed ? '  •  ' + formatSpeed(patch.speed) : '');
    } else if(patch.phase === 'cleanup'){
      dotEl.className = 'status-dot processing';
      statusEl.className = 'sp-status proc';
      statusEl.textContent = 'Removendo conteúdo antigo...';
      fillEl.style.width = '0%';
      detailEl.textContent = '';
    } else if(patch.phase === 'process'){
      dotEl.className = 'status-dot processing';
      statusEl.className = 'sp-status proc';
      if(patch.status === 'done'){
        statusEl.textContent = 'Processado';
        statusEl.className = 'sp-status ok';
        dotEl.className = 'status-dot';
        fillEl.style.width = '100%';
      } else {
        statusEl.textContent = 'Processando...';
        const pct = patch.total ? Math.min(100,(patch.processed/patch.total)*100) : 0;
        fillEl.style.width = pct + '%';
      }
      const c = patch.counts || {movie:0,series:0,live:0};
      detailEl.textContent = (patch.processed||0) + '/' + (patch.total||0) + ' itens  •  Filmes: '+c.movie+'  Séries: '+c.series+'  Ao Vivo: '+c.live;
    } else if(patch.phase === 'save'){
      // Etapa entre "itens processados" e "Processado": salvando no
      // IndexedDB e atualizando os índices em memória. Sem isso visível, a
      // barra parecia travar em 100% depois do processamento terminar.
      dotEl.className = 'status-dot processing';
      statusEl.className = 'sp-status proc';
      const pct = patch.total ? Math.min(100,(patch.processed/patch.total)*100) : 0;
      fillEl.style.width = pct + '%';
      const c = patch.counts || {movie:0,series:0,live:0};
      if(patch.chunkMode){
        // Processar e salvar acontecem em paralelo agora — vários lotes
        // podem estar sendo gravados ao mesmo tempo enquanto o resto do
        // arquivo ainda é processado, então o progresso aqui é por "lotes
        // concluídos", não mais item a item.
        statusEl.textContent = 'Salvando (' + (patch.processed||0) + '/' + (patch.total||0) + ' lotes)...';
        detailEl.textContent = 'Filmes: '+c.movie+'  Séries: '+c.series+'  Ao Vivo: '+c.live;
      } else {
        // A confirmação final em disco não tem como reportar progresso
        // (o navegador não expõe isso) — troca o texto pra deixar claro que
        // ainda está trabalhando, em vez de parecer travado em "Salvando...".
        statusEl.textContent = patch.committing ? 'Confirmando gravação...' : 'Salvando...';
        detailEl.textContent = patch.committing
          ? 'Finalizando ' + (patch.total||0) + ' itens no disco...'
          : (patch.processed||0) + '/' + (patch.total||0) + ' salvos  •  Filmes: '+c.movie+'  Séries: '+c.series+'  Ao Vivo: '+c.live;
      }
    } else if(patch.phase === 'error'){
      dotEl.className = 'status-dot error';
      statusEl.className = 'sp-status err';
      statusEl.textContent = patch.message || 'Erro';
      detailEl.textContent = '';
    }
  }

  function updateOverallUI({ completed, total }){
    lastCompleted = completed;
    lastTotal = total;
    qs('#overall-count', box).textContent = completed + ' / ' + total;
    const pct = total > 0 ? (completed/total)*100 : 0;
    qs('#overall-fill', box).style.width = pct + '%';
    updateMinimizedPillText('Importando servidores... ' + completed + '/' + total);
  }

  function onFirstSuccess(){
    minimizeBtn.style.display = 'inline-flex';
  }

  try{
    await ServerModule.importManyServersPipelined(servers, MAX_CONCURRENT_PROCESSING, updateServerUI, updateOverallUI, onFirstSuccess);
  }catch(err){
    showToast('Erro durante importação.', 'error');
  }

  State.ui.isImporting = false;
  State.pageCache.clear(); State.dashboardCache = null; State.favoritesCache = null; State.continueCache = null;
  updateSidebarCounts();
  importFullyDone = true;

  // Roda o pré-carregamento de novo, com os dados frescos que acabaram de
  // ser importados — sem isso, a PRIMEIRA vez que você clicasse em
  // Filmes/Séries/Ao Vivo/Dashboard/Favoritos/Continuar Assistindo depois
  // de importar sempre carregava do zero, mesmo o pré-carregamento inicial
  // já tendo rodado uma vez (só que aí ainda sem nenhum dado, no início do
  // app). Não é aguardado aqui — roda em segundo plano, não atrasa o
  // fechamento do modal.
  prefetchFirstPages().catch(()=>{});

  if(minimizedPillEl){
    // Terminou enquanto estava minimizado: mostra um check verde por 3s
    // em vez de sumir abrupto ou (pior) ficar preso ali pra sempre.
    showMinimizedPillDoneThenRemove('Importação concluída: ' + lastCompleted + '/' + lastTotal);
    overlay.remove();
  } else {
    closeBtnWrap.appendChild(el('button', { class:'btn primary', onclick:()=>{ overlay.remove(); Router.render(); } }, ['Fechar']));
  }

  Router.render();
}

/* ======================================================================
   VIEW: SETTINGS

   ====================================================================== */
async function renderSettingsView(container){
  // Usa State.settings diretamente — já é mantido correto em memória (é
  // carregado na abertura do app, "esquentado" pelo pré-carregamento, e
  // toda ação de salvar aqui mesmo já atualiza essa variável junto). Não
  // busca do banco de novo toda vez: essa era a causa da demora e do
  // recarregamento constante ao clicar em outro menu e voltar.

  container.appendChild(el('div', { class:'section-header' }, [el('h2',{},['Configurações'])]));

  // Pagination block
  const pagBlock = el('div', { class:'settings-block' });
  pagBlock.appendChild(el('h3', {}, ['Paginação']));
  const pagSelect = el('select', { id:'page-size-select' });
  for(const n of [10,50,100]){
    const opt = el('option', { value:String(n) }, [String(n) + ' itens por página']);
    if(State.settings.pageSize === n) opt.setAttribute('selected','true');
    pagSelect.appendChild(opt);
  }
  pagSelect.addEventListener('change', async function(e){
    State.settings.pageSize = parseInt(e.target.value, 10);
    State.ui.filters.movie.page = 1;
    State.ui.filters.series.page = 1;
    State.ui.filters.live.page = 1;
    await IDB.put(STORES.settings, State.settings);
    showToast('Paginação atualizada.', 'success');
    Router.render();
  });
  pagBlock.appendChild(pagSelect);
  container.appendChild(pagBlock);

  // Aparência: cores personalizáveis
  const colorBlock = el('div', { class:'settings-block' });
  colorBlock.appendChild(el('h3', {}, ['Aparência']));
  const colorRow = el('div', { class:'form-row' });
  const currentColors = Object.assign({}, DEFAULT_SETTINGS.colors, State.settings.colors);

  function makeColorPicker(label, key){
    const swatch = el('input', { type:'color' });
    swatch.value = currentColors[key];
    swatch.style.cssText = 'width:44px;height:38px;padding:2px;cursor:pointer;';
    swatch.addEventListener('input', async function(){
      currentColors[key] = swatch.value;
      State.settings.colors = Object.assign({}, currentColors);
      applyThemeColors(State.settings.colors);
      await IDB.put(STORES.settings, State.settings);
    });
    return el('div', { class:'form-group', style:'min-width:120px;flex:none;' }, [
      el('label', {}, [label]), swatch
    ]);
  }

  colorRow.appendChild(makeColorPicker('Cor principal', 'accent'));
  colorRow.appendChild(makeColorPicker('Cor secundária', 'accent2'));
  colorRow.appendChild(makeColorPicker('Cor de favoritos', 'fav'));
  colorRow.appendChild(makeColorPicker('Cor de fundo', 'bg'));
  colorBlock.appendChild(colorRow);

  const resetColorsBtn = el('button', { class:'btn', style:'margin-top:12px;' }, ['Restaurar cores padrão']);
  resetColorsBtn.addEventListener('click', async function(){
    State.settings.colors = Object.assign({}, DEFAULT_SETTINGS.colors);
    applyThemeColors(State.settings.colors);
    await IDB.put(STORES.settings, State.settings);
    Router.render();
  });
  colorBlock.appendChild(resetColorsBtn);
  container.appendChild(colorBlock);

  // Automatic servers block
  const autoBlock = el('div', { class:'settings-block' });
  autoBlock.appendChild(el('h3', {}, ['Servidores Automáticos']));

  const row1 = el('div', { class:'form-row' });
  const rawUrlGroup = el('div', { class:'form-group' }, [
    el('label',{},['URL do Raw (JSON)']),
    (function(){ const i = el('input',{type:'text'}); i.id='raw-url-input'; i.value = DEFAULT_SETTINGS.rawUrl || ''; return i; })(),
    el('div',{class:'hint'},['O JSON deve conter pares chave (nome do servidor) → URL M3U/M3U8.'])
  ]);
  row1.appendChild(rawUrlGroup);
  autoBlock.appendChild(row1);

  const row2 = el('div', { class:'form-row' });
  const userGroup = el('div', { class:'form-group' }, [
    el('label',{},['Usuário']),
    (function(){ const i = el('input',{type:'text'}); i.id='raw-user-input'; i.value = State.settings.rawUser || ''; return i; })()
  ]);
  const passInput = el('input',{type:'password'});
  passInput.id = 'raw-pass-input';
  passInput.value = State.settings.rawPass || '';
  const passWrap = el('div', { style:'position:relative;' }, [passInput]);
  const EYE_OPEN = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.4 20.4 0 0 1 5.06-5.94M9.9 4.24A9.5 9.5 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  const eyeBtn = el('button', { type:'button', style:'position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:2px 6px;display:flex;color:var(--text-2);' });
  eyeBtn.innerHTML = EYE_OPEN;
  eyeBtn.addEventListener('click', function(){
    const show = passInput.type === 'password';
    passInput.type = show ? 'text' : 'password';
    eyeBtn.innerHTML = show ? EYE_OFF : EYE_OPEN;
  });
  passWrap.appendChild(eyeBtn);
  const passGroup = el('div', { class:'form-group' }, [ el('label',{},['Senha']), passWrap ]);
  row2.appendChild(userGroup);
  row2.appendChild(passGroup);
  autoBlock.appendChild(row2);

  const downloadBtn = el('button', { class:'btn primary', style:'margin-top:14px;', id:'download-process-btn' }, ['Baixar e Processar']);
  downloadBtn.addEventListener('click', async function(){
    if(State.ui.isImporting){ showToast('Já existe uma importação em andamento.', 'error'); return; }
    const rawUrl = qs('#raw-url-input', autoBlock).value.trim();
    const user = qs('#raw-user-input', autoBlock).value;
    const pass = qs('#raw-pass-input', autoBlock).value;
    const autoSave = true; // sempre salva (é assim que os servidores automáticos funcionam)

    if(!rawUrl){ showToast('Informe a URL do Raw.', 'error'); return; }

    State.settings.rawUrl = rawUrl;
    State.settings.rawUser = user;
    State.settings.rawPass = pass;
    State.settings.autoSaveServers = autoSave;
    await IDB.put(STORES.settings, State.settings);

    downloadBtn.disabled = true;
    downloadBtn.textContent = 'Baixando JSON...';
    try{
      const json = await RawModule.fetchAndParseRaw(rawUrl);
      const servers = await RawModule.buildServersFromRaw(json, user, pass, rawUrl);
      downloadBtn.disabled = false;
      downloadBtn.textContent = 'Baixar e Processar';
      updateSidebarCounts();
      if(servers.length === 0){
        showToast('Nenhum servidor encontrado no JSON.', 'error');
        return;
      }
      await runImportWithProgressModal(servers);
    }catch(err){
      downloadBtn.disabled = false;
      downloadBtn.textContent = 'Baixar e Processar';
      showToast(err && err.message ? err.message : 'Erro ao baixar/processar Raw.', 'error');
    }
  });
  autoBlock.appendChild(downloadBtn);
  container.appendChild(autoBlock);
}

/* ======================================================================
   ROUTER
   ====================================================================== */
const VIEW_TITLES = {
  dashboard: 'Dashboard',
  live: 'Ao Vivo',
  series: 'Séries',
  'series-detail': 'Série',
  movies: 'Filmes',
  favorites: 'Favoritos',
  continue: 'Continuar Assistindo',
  servers: 'Servidores',
  settings: 'Configurações'
};

const Router = {
  render(){
    const view = State.ui.currentView;
    const contentArea = qs('#content-area');
    contentArea.innerHTML = '';
    const container = el('div');
    contentArea.appendChild(container);

    qs('#page-title').textContent = VIEW_TITLES[view] || '';
    qsa('.nav-item').forEach(function(item){
      const itemView = item.getAttribute('data-view');
      item.classList.toggle('active', itemView === view || (view === 'series-detail' && itemView === 'series'));
    });

    switch(view){
      case 'dashboard': renderDashboardView(container); break;
      case 'live': renderListView('live', 'Ao Vivo', container); break;
      case 'series': renderSeriesListView(container); break;
      case 'series-detail': renderSeriesDetailView(container); break;
      case 'movies': renderListView('movie', 'Filmes', container); break;
      case 'favorites': renderFavoritesView(container); break;
      case 'continue': renderContinueView(container); break;
      case 'servers': container.appendChild(renderServersView()); break;
      case 'settings': renderSettingsView(container); break;
      default: renderDashboardView(container);
    }

    updateSidebarCounts();
  },

  goTo(view){
    State.ui.currentView = view;
    if(view !== 'series-detail') State.ui.activeSeriesKey = null;
    // Restaura os contadores globais ao navegar — se a tela pra onde foi
    // (filme/série/ao vivo) tiver um filtro de servidor ativo, ela mesma
    // sobrescreve seu próprio contador com o valor filtrado logo depois.
    updateSidebarCounts();
    this.render();
    if(window.innerWidth <= 900){
      qs('#sidebar').classList.remove('open');
      qs('#sidebar-overlay').classList.remove('open');
    }
  }
};

async function updateSidebarCounts(){
  qs('#cnt-servers').textContent = State.servers.size;
  qs('#cnt-continue').textContent = ProgressModule.getContinueWatchingCount();
  try{
    const [movieCount, liveCount, seriesCount, favs] = await Promise.all([
      IDB.countByIndexRange(STORES.contents, 'tipo_serverId', QueryModule._typeRange('movie')),
      IDB.countByIndexRange(STORES.contents, 'tipo_serverId', QueryModule._typeRange('live')),
      IDB.count(STORES.seriesSummary),
      IDB.getAll(STORES.favorites)
    ]);
    qs('#cnt-movies').textContent = movieCount;
    qs('#cnt-live').textContent = liveCount;
    qs('#cnt-series').textContent = seriesCount;
    qs('#cnt-favs').textContent = favs.length;
  }catch(e){}
}

/* ======================================================================
   GLOBAL EVENT LISTENERS
   ====================================================================== */
function setupEventListeners(){
  qsa('.nav-item').forEach(function(item){
    item.addEventListener('click', function(){
      Router.goTo(item.getAttribute('data-view'));
    });
  });

  qs('#global-search').addEventListener('input', function(e){
    const val = e.target.value;
    qs('#global-search-clear').style.display = val ? 'block' : 'none';
    if(!val) return;
    openSearchPopup(val); // abre na hora; o próprio popup faz o debounce da busca
  });
  qs('#global-search-clear').addEventListener('click', function(){
    qs('#global-search').value = '';
    qs('#global-search-clear').style.display = 'none';
    if(activeSearchOverlay) activeSearchOverlay.close(false);
  });

  qs('#global-search').addEventListener('focus', function(e){
    const val = e.target.value.trim();
    if(val && !activeSearchOverlay) openSearchPopup(val);
  });

  qs('#menu-toggle').addEventListener('click', function(){
    qs('#sidebar').classList.toggle('open');
    qs('#sidebar-overlay').classList.toggle('open');
  });
  qs('#sidebar-overlay').addEventListener('click', function(){
    qs('#sidebar').classList.remove('open');
    qs('#sidebar-overlay').classList.remove('open');
  });

  qs('#player-close').addEventListener('click', function(){
    PlayerModule.close();
  });

  qs('#player-back').addEventListener('click', function(){
    PlayerModule.goBack();
  });
}

/* ======================================================================
   APP INITIALIZATION
   ====================================================================== */
async function initApp(){
  try{
    State.db = await IDB.open();
  }catch(err){
    showToast('Erro ao abrir IndexedDB. Verifique as permissões do navegador.', 'error');
    return;
  }

  try{
    const settingsList = await IDB.getAll(STORES.settings);
    const existing = settingsList.find(s => s.id === 'app');
    if(existing){
      State.settings = Object.assign({}, DEFAULT_SETTINGS, existing);
    } else {
      State.settings = { ...DEFAULT_SETTINGS };
      await IDB.put(STORES.settings, State.settings);
    }
  }catch(err){
    State.settings = { ...DEFAULT_SETTINGS };
  }
  applyThemeColors(State.settings.colors);

  // Servidores, progresso e favoritos são pequenos — carregam rápido e
  // eager. O conteúdo (que pode ter milhões de itens) NUNCA é carregado
  // por inteiro: cada tela busca só a página que precisa, direto do
  // IndexedDB, então a página abre praticamente instantânea independente
  // do tamanho da biblioteca.
  try{ await ServerModule.loadAllFromDB(); }catch(err){ showToast('Erro ao carregar servidores.', 'error'); }
  try{ await ServerModule.loadProgressFromDB(); }catch(err){}

  setupEventListeners();
  const versionLabel = qs('#app-version-label');
  if(versionLabel) versionLabel.textContent = 'v' + APP_VERSION;
  Router.render();

  // Pré-carrega a página 1 de Filmes/Séries/Ao Vivo em segundo plano (fica
  // no cache), então ao trocar de aba pela primeira vez já está pronto.
  prefetchFirstPages();
}

async function prefetchFirstPages(){
  const pageSize = State.settings.pageSize || PAGE_SIZE_DEFAULT;

  // Ordem pedida: Ao Vivo e Filmes primeiro (mais leves), Séries por
  // último (mais pesado — muitos episódios por trás de cada resumo). Usa
  // a MESMA função que a navegação normal usa (loadTypePageData) — assim,
  // se o usuário clicar numa dessas abas enquanto o pré-carregamento dela
  // ainda está rodando, a tela reaproveita essa mesma busca em vez de
  // disparar outra do zero (dedução automática via pageFetchesInFlight).
  for(const type of ['live', 'movie']){
    const filters = State.ui.filters[type];
    try{
      await loadTypePageData(type, filters, pageSize);
      if(['live','movies'].indexOf(State.ui.currentView) !== -1) Router.render();
    }catch(e){}
  }

  // Séries é o mais pesado — carrega por último, de propósito, pra não
  // atrasar o resto.
  try{
    await loadTypePageData('series', State.ui.filters.series, pageSize);
    if(State.ui.currentView === 'series') Router.render();
  }catch(e){}

  // Favoritos também é pré-carregado — geralmente pequeno (poucas dezenas
  // de itens), então não atrasa nada relevante.
  try{
    await loadFavoritesData();
    if(State.ui.currentView === 'favorites') Router.render();
  }catch(e){}

  // Dashboard e Continuar Assistindo também — completa a lista de telas
  // que devem estar prontas ao clicar, não só Filmes/Séries/Ao
  // Vivo/Favoritos.
  try{
    await loadDashboardData();
    if(State.ui.currentView === 'dashboard') Router.render();
  }catch(e){}
  try{
    await loadContinueWatchingFullList();
    if(State.ui.currentView === 'continue') Router.render();
  }catch(e){}

  // Servidores: já é 100% memória (State.servers, carregado na abertura
  // do app) — não faz nenhuma consulta ao banco, então já está pronto sem
  // precisar de nada extra aqui.

  // Configurações: só faz 1 leitura de um registro pequeno, mas
  // "esquenta" State.settings com antecedência de qualquer jeito, pra
  // completar 100% do menu pré-carregado.
  try{
    const fresh = await IDB.getByKey(STORES.settings, 'app');
    if(fresh) State.settings = Object.assign({}, DEFAULT_SETTINGS, fresh);
  }catch(e){}
}

// Rede de segurança contra "a conexão com o banco caiu" (múltiplas abas do
// app abertas ao mesmo tempo, ou o navegador derrubando a conexão sob
// pressão de memória): em vez de deixar como um erro escondido no console,
// avisa a pessoa com clareza e já tenta reabrir a conexão sozinho em
// segundo plano, pra próxima ação funcionar de novo sem precisar recarregar
// a página manualmente na maioria dos casos.
// Rede de segurança extra: captura QUALQUER erro de script não tratado
// (diferente da de promessa acima) e mostra na tela. Em dispositivos sem
// acesso fácil ao console (ex: TV/projetor Android), isso é o único jeito
// de saber o que realmente quebrou quando algo falha silenciosamente.
window.addEventListener('error', function(e){
  const msg = (e && e.message) ? e.message : 'Erro desconhecido';
  const loc = (e && e.filename) ? (' (linha ' + e.lineno + ')') : '';
  showToast('Erro inesperado: ' + msg + loc, 'error');
});

window.addEventListener('unhandledrejection', function(e){
  const msg = e && e.reason && e.reason.message ? e.reason.message : '';
  const isConnectionClosed = e && e.reason && e.reason.name === 'InvalidStateError'
    && /closing|closed/i.test(msg);
  if(!isConnectionClosed) return;
  e.preventDefault(); // não deixa virar erro vermelho não tratado no console
  if(State.db){ try{ State.db.close(); }catch(err){} }
  State.db = null;
  showToast('A conexão com o banco foi interrompida. Tentando reconectar...', 'error');
  IDB.open().then(function(db){
    State.db = db;
    showToast('Reconectado — pode tentar novamente.', 'success');
  }).catch(function(){
    showToast('Não foi possível reconectar. Recarregue a página.', 'error');
  });
});

window.addEventListener('DOMContentLoaded', initApp);
</script>
