      document.exitFullscreen().catch(()=>{});
    } else if(overlay.requestFullscreen){
      overlay.requestFullscreen().catch(()=>{});
    }
  },

  togglePlayPause(){
    const video = qs('#video-player');
    const willPlay = video.paused;
    if(willPlay) video.play().catch(()=>{});
    else video.pause();
    this._showPlayPauseFeedback(willPlay);
  },

  /** Ícone grande que pisca no centro da tela ao dar play/pause (feedback
   * visual claro do que acabou de acontecer). */
  _showPlayPauseFeedback(isPlaying){
    const indicator = qs('#player-playpause-feedback');
    indicator.innerHTML = isPlaying ? this.ICONS.play : this.ICONS.pause;
    indicator.classList.remove('show');
    void indicator.offsetWidth;
    indicator.classList.add('show');
    clearTimeout(this._playPauseFeedbackTimer);
    this._playPauseFeedbackTimer = setTimeout(() => indicator.classList.remove('show'), 500);
  },

  _updatePlayPauseIcon(){
    const video = qs('#video-player');
    const btn = qs('#player-playpause');
    btn.innerHTML = video.paused ? this.ICONS.play : this.ICONS.pause;
  },

  _formatTime(seconds){
    if(!isFinite(seconds) || seconds < 0) return '00:00';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    const mm = String(m).padStart(2,'0');
    const ss = String(s).padStart(2,'0');
    return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
  },

  _updateSeekUI(){
    const video = qs('#video-player');
    const fill = qs('#player-seek-fill');
    const curEl = qs('#player-time-current');
    const durEl = qs('#player-time-duration');
    if(video.duration && !isNaN(video.duration)){
      fill.style.width = Math.min(100, (video.currentTime/video.duration)*100) + '%';
    }
    curEl.textContent = this._formatTime(video.currentTime);
    durEl.textContent = this._formatTime(video.duration);
  },

  _updateBufferedUI(){
    const video = qs('#video-player');
    const bufferedFill = qs('#player-buffered-fill');
    if(!video.duration || isNaN(video.duration) || video.buffered.length === 0) return;
    const end = video.buffered.end(video.buffered.length - 1);
    bufferedFill.style.width = Math.min(100, (end / video.duration) * 100) + '%';
  },

  _showControls(){
    qs('#player-overlay').classList.remove('controls-hidden');
    this._updatePlayPauseIcon();
  },

  _scheduleHideControls(){
    clearTimeout(this._hideControlsTimer);
    this._hideControlsTimer = setTimeout(() => {
      qs('#player-overlay').classList.add('controls-hidden');
    }, 3000);
  },

  /**
   * Ação compartilhada entre o botão "←" e a tecla ESC: pra série, volta
   * pra tela de detalhes daquela série (evita o "limbo" de quem assistiu
   * pelo Continuar Assistindo); pra filme/ao vivo, só fecha o player.
   */
  goBack(){
    const content = this.currentContent;
    if(content && content.tipo === 'series' && content.seriesKey){
      State.ui.activeSeriesKey = content.seriesKey;
      State.ui.currentView = 'series-detail';
    }
    this.close();
  },

  _ensureVideoListeners(){
    if(this._videoListenersReady) return;
    const video = qs('#video-player');
    video.addEventListener('playing', ()=> this.hideBuffering());
    video.addEventListener('waiting', ()=> this.showBuffering());
    video.addEventListener('timeupdate', ()=>{
      this.lastTimeUpdateAt = Date.now();
      this._updateSeekUI();
    });
    // The stall watchdog only makes sense while the video is actually
    // supposed to be playing. Without this, pausing a live channel for more
    // than ~12s made the watchdog think playback had frozen and it would
    // force a reconnect — which auto-resumed playback ("despausa sozinho").
    video.addEventListener('pause', ()=>{
      this.isUserPaused = true;
      this._updatePlayPauseIcon();
      this._showControls();
      // Pausar não é "travado esperando rede" — sem isso, se o usuário
      // pausasse enquanto o vídeo ainda estava no meio do buffer inicial
      // (evento 'waiting' já disparado), a mensagem "Carregando stream..."
      // ficava presa na tela mesmo já tendo carregado uma parte e estando
      // simplesmente pausado de propósito.
      this.hideBuffering();
    });
    video.addEventListener('play', ()=>{ this.isUserPaused = false; this.lastTimeUpdateAt = Date.now(); this._updatePlayPauseIcon(); this._scheduleHideControls(); });

    // 'loadedmetadata' and 'ended' are attached ONCE here (not per open()/
    // _startPlayback call) and always read this.currentContent/this.playToken
    // at fire-time. Attaching them fresh on every open() without ever
    // removing the previous ones would accumulate duplicate listeners on
    // the same persistent <video> element across sessions (e.g. duplicated
    // "próximo episódio" toasts, duplicated progress saves).
    video.addEventListener('loadedmetadata', ()=>{
      const content = this.currentContent;
      this._updateSeekUI();
      if(!content || content.tipo === 'live') return;
      const prog = ProgressModule.getProgress(content.id);
      if(prog && prog.currentTime && video.duration && prog.currentTime < video.duration - 5){
        video.currentTime = prog.currentTime;
      }
    });

    video.addEventListener('ended', ()=>{
      const content = this.currentContent;
      if(!content || content.tipo === 'live') return;
      if(video.duration && !isNaN(video.duration)){
        ProgressModule.saveProgress(content.id, video.duration, video.duration, content.seriesKey);
      }
      if(content.tipo === 'series' && this.nextEpisodeContent){
        const nextContent = this.nextEpisodeContent;
        const myToken = this.playToken;
        showToast('Reproduzindo próximo episódio...', 'success');
        setTimeout(()=>{
          if(myToken === this.playToken) this.open(nextContent);
        }, 1200);
      }
    });

    this._videoListenersReady = true;
  },

  _startPlayback(content, token){
    if(token !== this.playToken) return; // a newer open()/close() happened meanwhile
    const video = qs('#video-player');
    this.showBuffering();

    const url = resolveContentUrl(content);
    const isLive = content.tipo === 'live';
    const looksHls = /\.m3u8(\?|$)/i.test(url);

    if(looksHls && window.Hls && Hls.isSupported()){
      this.hls = new Hls();
      this.hls.loadSource(url);
      this.hls.attachMedia(video);
      this.hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
        video.play().catch(()=>{});
      });
      this.hls.on(Hls.Events.ERROR, (event, data)=>{
        if(!data || !data.fatal) return;
        if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
          this._retryOrFallback(content, token, 'Falha de rede ao carregar o stream HLS.');
        } else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
          try{ this.hls.recoverMediaError(); }catch(e){ this._retryOrFallback(content, token, 'Erro de mídia no stream HLS.'); }
        } else {
          this._retryOrFallback(content, token, 'Erro ao reproduzir stream HLS.');
        }
      });
    } else if(looksHls && video.canPlayType('application/vnd.apple.mpegurl')){
      // Safari native HLS support
      video.src = url;
      video.addEventListener('error', ()=> this._retryOrFallback(content, token, 'Erro ao reproduzir HLS neste navegador.'), { once:true });
      video.play().catch(()=>{});
    } else if(isLive){
      // Ambiguous case: a "live" item with no .m3u8 manifest. Two very
      // different realities hide behind this in practice:
      //  1) a genuine continuous raw MPEG-TS channel (needs mpegts.js), or
      //  2) an IPTV "movie" URL with no visible extension that actually
      //     redirects to a real, finite MP4/MKV file (common with Xtream
      //     Codes panels) — this plays fine as a normal <video src>.
      // We try native playback first: it's cheap, fails fast on a genuine
      // raw TS stream, and — importantly — native <video> playback does
      // NOT require CORS headers from the server (only JS-based libraries
      // like mpegts.js/hls.js do, since they fetch() the bytes manually to
      // demux them). So trying native first also sidesteps CORS entirely
      // for anything the browser can already play on its own.
      if(this._skipNativeAttempt){
        this._startMpegts(content, token, video, url);
      } else {
        this._tryNativeThenMpegts(content, token, video, url);
      }
    } else {
      // Movies/episodes with a recognized container (mp4/webm/etc.)
      video.src = url;
      video.addEventListener('error', ()=> this._retryOrFallback(content, token, 'Erro ao carregar o arquivo de vídeo.'), { once:true });
      video.play().catch(()=>{});
    }

    if(!isLive){
      this.saveInterval = setInterval(()=>{
        if(video.duration && !isNaN(video.duration)){
          ProgressModule.saveProgress(content.id, video.currentTime, video.duration, content.seriesKey);
        }
      }, 4000);
    }
  },

  _tryNativeThenMpegts(content, token, video, url){
    const onNativeError = ()=>{
      video.removeEventListener('error', onNativeError);
      if(token !== this.playToken) return;
      this._skipNativeAttempt = true; // já sabemos que falha; não tentar de novo nos retries
      video.removeAttribute('src');
      try{ video.load(); }catch(e){}
      this._startMpegts(content, token, video, url);
    };
    video.addEventListener('error', onNativeError, { once:true });
    video.src = url;
    video.play().catch(()=>{});
  },

  _startMpegts(content, token, video, url){
    // Raw MPEG-TS stream (no .m3u8 manifest, and native playback didn't
    // work) — typical of Xtream Codes "output=ts" live channels. Browsers
    // cannot play raw TS via <video src>, so we use mpegts.js which remuxes
    // MPEG-TS into fragmented MP4 via MediaSource Extensions.
    if(window.mpegts && mpegts.isSupported()){
      try{
        this.mpegtsPlayer = mpegts.createPlayer({
          type: 'mpegts',
          isLive: true,
          url: url
        }, {
          enableWorker: true,
          // Prioriza estabilidade sobre latência mínima: "chasing" agressivo da borda
          // ao vivo faz o player forçar saltos/avanços constantes em conexões
          // instáveis, o que aparece como travamentos frequentes.
          liveBufferLatencyChasing: false,
          liveBufferLatencyMaxLatency: 6,
          liveBufferLatencyMinRemain: 2,
          // Buffer inicial maior = mais cushion antes de começar a tocar,
          // reduzindo engasgos por pequenas variações de rede.
          enableStashBuffer: true,
          stashInitialSize: 512 * 1024,
          // Sem isso, o SourceBuffer de um stream ao vivo cresce indefinidamente
          // em memória, deixando o navegador cada vez mais lento/travado quanto
          // mais tempo o canal fica aberto. Isso é a causa mais comum de
          // "trava depois de um tempo assistindo".
          autoCleanupSourceBuffer: true,
          autoCleanupMaxBackwardDuration: 30,
          autoCleanupMinBackwardDuration: 15
        });
        this.mpegtsPlayer.attachMediaElement(video);
        this.mpegtsPlayer.on(mpegts.Events.ERROR, (errType, errDetail, errInfo)=>{
          const msg = this._diagnoseStreamError(errType, errDetail, errInfo);
          this._retryOrFallback(content, token, msg);
        });
        this.mpegtsPlayer.load();
        this.mpegtsPlayer.play().catch(()=>{});

        // Watchdog: alguns travamentos de stream ao vivo não disparam evento de
        // erro nenhum — o vídeo simplesmente para de avançar. Aqui checamos
        // periodicamente se o tempo do vídeo está evoluindo; se ficar parado
        // por muito tempo (e o usuário NÃO tiver pausado manualmente),
        // forçamos uma reconexão automática.
        this.lastTimeUpdateAt = Date.now();
        this.stallWatchdog = setInterval(()=>{
          if(token !== this.playToken){ clearInterval(this.stallWatchdog); return; }
          if(this.isUserPaused) return; // pausa manual não é travamento
          const stalledFor = Date.now() - (this.lastTimeUpdateAt || Date.now());
          if(stalledFor > 12000){
            clearInterval(this.stallWatchdog);
            this.stallWatchdog = null;
            this._retryOrFallback(content, token, 'O stream travou e não retomou sozinho.');
          }
        }, 4000);
      }catch(err){
        this._retryOrFallback(content, token, 'Não foi possível iniciar o player para este canal.');
      }
    } else {
      this.hideBuffering();
      showToast('Seu navegador não suporta reprodução deste formato (MPEG-TS via MSE).', 'error');
      this.showFallbackBar(url, 'Seu navegador não suporta este formato. Copie o link e use um player externo (ex: VLC).');
    }
  },

  /**
   * Tries to distinguish a CORS/network problem (which no client-side library
   * can bypass — it's a browser security restriction controlled by the
   * remote server) from a codec/decoding problem, to give the user an
   * accurate diagnosis instead of a generic error.
   */
  _diagnoseStreamError(errType, errDetail, errInfo){
    const detail = String(errDetail || '').toLowerCase();
    const info = errInfo && errInfo.msg ? String(errInfo.msg).toLowerCase() : '';
    if(detail.indexOf('network') !== -1 || info.indexOf('fetch') !== -1 || info.indexOf('cors') !== -1 || info.indexOf('failed to fetch') !== -1){
      return 'Não foi possível acessar o stream (rede ou CORS). Muitos servidores IPTV não permitem acesso direto do navegador — isso não é um erro do app, é uma restrição do servidor de origem.';
    }
    if(detail.indexOf('codec') !== -1 || detail.indexOf('demux') !== -1 || detail.indexOf('format') !== -1){
      return 'O formato/codec deste canal não é compatível com reprodução no navegador.';
    }
    return 'Não foi possível reproduzir este canal no navegador.';
  },

  _retryOrFallback(content, token, message){
    if(token !== this.playToken) return;
    if(this.retryCount < this.maxRetries){
      this.retryCount++;
      showToast('Tentando reconectar ao stream... (' + this.retryCount + '/' + this.maxRetries + ')', 'error');
      this.cleanup();
      this.retryTimer = setTimeout(()=>{
        if(token !== this.playToken) return;
        this._startPlayback(content, token);
      }, 1500 * this.retryCount);
    } else {
      this.hideBuffering();
      showToast(message, 'error');
      this.showFallbackBar(resolveContentUrl(content), message + ' Copie o link e abra em um player externo (ex: VLC).');
    }
  },

  showBuffering(){
    const b = qs('#player-buffering');
    if(b) b.style.display = 'flex';
  },
  hideBuffering(){
    const b = qs('#player-buffering');
    if(b) b.style.display = 'none';
  },

  showFallbackBar(url, message){
    this.hideBuffering();
    let bar = qs('#player-fallback-bar');
    if(!bar){
      bar = el('div', {
        id: 'player-fallback-bar',
        style: 'position:absolute;bottom:0;left:0;right:0;padding:14px 20px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);display:flex;align-items:center;gap:12px;z-index:2;flex-wrap:wrap;'
      });
      qs('#player-overlay').appendChild(bar);
    }
    bar.innerHTML = '';
    bar.appendChild(el('span', { style:'color:#fff;font-size:13px;max-width:520px;' }, [message || 'Não foi possível reproduzir no navegador. Copie o link e abra em um player externo (ex: VLC).']));
    const copyBtn = el('button', { class:'btn primary small' }, ['Copiar link']);
    copyBtn.addEventListener('click', function(){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(function(){
          showToast('Link copiado.', 'success');
        }).catch(function(){
          showToast('Não foi possível copiar automaticamente. URL: ' + url, 'error');
        });
      } else {
        showToast('URL: ' + url, 'error');
      }
    });
    bar.appendChild(copyBtn);
    const retryBtn = el('button', { class:'btn small' }, ['Tentar novamente'] );
    retryBtn.addEventListener('click', ()=>{
      if(!this.currentContent) return;
      this.retryCount = 0;
      this.hideFallbackBar();
      this.playToken++;
      this.cleanup();
      this._startPlayback(this.currentContent, this.playToken);
    });
    bar.appendChild(retryBtn);
    bar.style.display = 'flex';
  },

  hideFallbackBar(){
    const bar = qs('#player-fallback-bar');
    if(bar) bar.style.display = 'none';
  },

  cleanup(){
    if(this.retryTimer){ clearTimeout(this.retryTimer); this.retryTimer = null; }
    if(this.stallWatchdog){ clearInterval(this.stallWatchdog); this.stallWatchdog = null; }
    if(this._hideControlsTimer){ clearTimeout(this._hideControlsTimer); this._hideControlsTimer = null; }
    const video = qs('#video-player');
    if(this.hls){ try{ this.hls.destroy(); }catch(e){} this.hls = null; }
    if(this.mpegtsPlayer){
      try{ this.mpegtsPlayer.pause(); }catch(e){}
      try{ this.mpegtsPlayer.unload(); }catch(e){}
      try{ this.mpegtsPlayer.detachMediaElement(); }catch(e){}
      try{ this.mpegtsPlayer.destroy(); }catch(e){}
      this.mpegtsPlayer = null;
    }
    if(this.saveInterval){ clearInterval(this.saveInterval); this.saveInterval = null; }
    try{ video.pause(); }catch(e){}
    video.removeAttribute('src');
    try{ video.load(); }catch(e){}
    this.hideBuffering();
  },

  close(){
    this.playToken++; // invalidate any pending retries/callbacks
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    const video = qs('#video-player');
    if(this.currentContent && this.currentContent.tipo !== 'live' && video.duration && !isNaN(video.duration)){
      ProgressModule.saveProgress(this.currentContent.id, video.currentTime, video.duration, this.currentContent.seriesKey);
    }
    this.cleanup();
    this.hideFallbackBar();
    this.nextEpisodeContent = null;
    const nextBtn = qs('#player-next-episode');
    if(nextBtn) nextBtn.style.display = 'none';
    qs('#player-overlay').style.display = 'none';
    this.currentContent = null;
    Router.render();
  }
};

/* ======================================================================
   RENDER HELPERS: cards, pagination, filters
   ====================================================================== */
function getServerName(serverId){
  const s = State.servers.get(serverId);
  return s ? s.nome : 'Desconhecido';
}

let categorySearchDebounceTimer = null;

/**
 * Renders a subcategory <select> together with a small text input above it
 * to filter the option list by name — useful when a server has dozens or
 * hundreds of group-titles. The text field only filters which options are
 * shown; it never touches the actual applied filter (filters.category),
 * which only changes when the user picks an option from the select.
 */
function renderCategorySelectWithFilter(viewKey, filters, allCategories){
  const wrap = el('div', { style:'display:flex;flex-direction:column;gap:6px;min-width:200px;' });
  const searchText = State.ui.categoryFilterText[viewKey] || '';

  const searchInput = el('input', {
    type:'text',
    placeholder:'Filtrar categorias...',
    value: searchText,
    'data-cat-search': viewKey,
    style:'font-size:12.5px;padding:7px 10px;'
  });
  searchInput.addEventListener('input', function(e){
    const val = e.target.value;
    const cursorPos = e.target.selectionStart;
    clearTimeout(categorySearchDebounceTimer);
    categorySearchDebounceTimer = setTimeout(function(){
      State.ui.categoryFilterText[viewKey] = val;
      Router.render();
      // Router.render() rebuilds #content-area from scratch, which destroys
      // and recreates this input — without this, the field loses focus on
      // every keystroke and you'd have to click back into it each time.
      const newInput = document.querySelector('[data-cat-search="'+viewKey+'"]');
      if(newInput){
        newInput.focus();
        if(newInput.setSelectionRange){
          try{ newInput.setSelectionRange(cursorPos, cursorPos); }catch(err){}
        }
      }
    }, 150);
  });
  wrap.appendChild(searchInput);

  const normSearch = normalizeText(searchText);
  let visibleCats = allCategories;
  if(normSearch){
    visibleCats = allCategories.filter(c => normalizeText(c).indexOf(normSearch) !== -1);
    // Always keep the currently-selected category in the list even if it
    // doesn't match the current search text, so the select never silently
    // "loses" the active selection from view.
    if(filters.category !== 'all' && visibleCats.indexOf(filters.category) === -1 && allCategories.indexOf(filters.category) !== -1){
      visibleCats = [filters.category].concat(visibleCats);
    }
  }

  const catSelect = el('select', { onchange:function(e){ filters.category = e.target.value; filters.page=1; Router.render(); } });
  catSelect.appendChild(el('option', { value:'all' }, ['Todas as categorias']));
  for(const c of visibleCats){
    const opt = el('option', { value:c }, [c]);
    if(filters.category === c) opt.setAttribute('selected','true');
    catSelect.appendChild(opt);
  }
  if(filters.category === 'all') catSelect.value = 'all';
  wrap.appendChild(catSelect);

  if(normSearch && visibleCats.length === 0){
    wrap.appendChild(el('div', { style:'font-size:11px;color:var(--text-2);' }, ['Nenhuma categoria encontrada']));
  }

  return wrap;
}

function buildCategoryOptions(type){
  const cats = new Set();
  for(const [key] of State.indexes.contentsByCategory){
    const parts = key.split('::');
    if(parts[0] === type) cats.add(parts.slice(1).join('::'));
  }
  return Array.from(cats).sort();
}

function buildServerOptionsForType(type){
  const serverIds = new Set();
  for(const [key] of State.indexes.contentsByTypeServer){
    const parts = key.split('::');
    if(parts[0] === type) serverIds.add(parts[1]);
  }
  return Array.from(serverIds).map(id => ({ id, nome: getServerName(id) })).sort((a,b)=>a.nome.localeCompare(b.nome));
}

function renderContentCard(content, options){
  options = options || {};
  const card = el('div', { class:'content-card' });
  const thumb = el('div', { class:'thumb' });
  const ownLogo = resolveContentLogo(content); // cobre capa plana (antiga) ou compactada (prefixo+sufixo)
  const nameEl = el('div', { class:'name' }, [resolveContentName(content)]);
  const needsSeriesFallback = content.tipo === 'series' && content.seriesKey && (!ownLogo || !content.nome);
  if(ownLogo){
    const img = el('img', { loading:'lazy' });
    img.src = ownLogo;
    img.onerror = function(){ img.remove(); thumb.appendChild(el('div',{class:'ph'},['🎬'])); };
    thumb.appendChild(img);
  } else if(needsSeriesFallback){
    thumb.appendChild(el('div',{class:'ph'},['🎬']));
  } else {
    thumb.appendChild(el('div',{class:'ph'},['🎬']));
  }
  if(needsSeriesFallback){
    // Falta capa e/ou nome próprio (foram compactados/omitidos) e este
    // card está FORA da tela da série (ex: Continuar Assistindo), onde não
    // temos o resumo da série já em mãos. Uma única busca pontual e leve
    // (1 registro pequeno) resolve os dois de uma vez.
    const placeholder = thumb.querySelector('.ph');
    IDB.getByKey(STORES.seriesSummary, content.seriesKey).then(summary => {
      if(!summary) return;
      if(!ownLogo && summary.logo && placeholder && thumb.contains(placeholder)){
        const img = el('img', { loading:'lazy' });
        img.src = summary.logo;
        img.onerror = function(){ img.remove(); };
        placeholder.remove();
        thumb.insertBefore(img, thumb.firstChild);
      }
      if(!content.nome){
        nameEl.textContent = resolveContentName(content, summary.name);
      }
    }).catch(()=>{});
  }
  if(content.tipo === 'live'){
    thumb.appendChild(el('div', { class:'live-badge' }, ['AO VIVO']));
  }

  const topRightWrap = el('div', { style:'position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:2;' });

  // Download só faz sentido pra arquivo finito (filme ou episódio de série)
  // — ao vivo é um stream contínuo, não um arquivo pra baixar. Fica à
  // esquerda do favorito. No Dashboard fica oculto (options.hideDownload).
  if((content.tipo === 'movie' || content.tipo === 'series') && !options.hideDownload){
    const dlBtn = el('button', { class:'fav-btn', style:'position:static;', title:'Baixar' }, ['⬇']);
    dlBtn.addEventListener('click', function(e){
      e.stopPropagation();
      downloadContentUrl(resolveContentUrl(content), nameEl.textContent);
    });
    topRightWrap.appendChild(dlBtn);
  }

  const favBtn = el('button', { class:'fav-btn' + (content.favorito ? ' active':''), style:'position:static;', onclick: async function(e){
    e.stopPropagation();
    await IndexModule.toggleFavoriteContent(content);
    favBtn.className = 'fav-btn' + (content.favorito ? ' active' : '');
    favBtn.textContent = content.favorito ? '★' : '☆';
    updateSidebarCounts();
    const filteringByFav = (content.tipo === 'movie' && State.ui.currentView === 'movies' && State.ui.filters.movie.favoritesOnly)
      || (content.tipo === 'live' && State.ui.currentView === 'live' && State.ui.filters.live.favoritesOnly)
      || State.ui.currentView === 'favorites';
    if(!content.favorito && filteringByFav) card.remove();
  }}, [content.favorito ? '★' : '☆']);
  topRightWrap.appendChild(favBtn);
  thumb.appendChild(topRightWrap);

  if(options.showRemoveFromContinue){
    const rmBtn = el('button', {
      style:'position:absolute;top:8px;left:8px;width:29px;height:29px;border-radius:50%;background:rgba(10,11,18,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;z-index:2;',
      title:'Remover de Continuar Assistindo'
    }, ['✕']);
    rmBtn.addEventListener('click', async function(e){
      e.stopPropagation();
      await ProgressModule.resetProgress(content.id);
      card.remove();
      updateSidebarCounts();
      if(typeof options.onRemoved === 'function') options.onRemoved();
    });
    thumb.appendChild(rmBtn);
  }

  if(content.tipo !== 'live'){
    const prog = ProgressModule.getProgress(content.id);
    if(prog && prog.porcentagem > 0){
      const pbar = el('div', { class:'progress-bar-mini' }, [el('div',{class:'fill', style:'width:'+Math.min(100,prog.porcentagem)+'%'})]);
      thumb.appendChild(pbar);
    }
  }

  card.appendChild(thumb);
  const info = el('div', { class:'info' });
  info.appendChild(nameEl);
  const meta = el('div', { class:'meta' });
  meta.appendChild(el('span', { class:'server-tag', title: getServerName(content.serverId) }, [getServerName(content.serverId)]));
  info.appendChild(meta);
  card.appendChild(info);

  card.addEventListener('click', function(){
    if(activeSearchOverlay) activeSearchOverlay.close(true);
    PlayerModule.open(content);
  });

  return card;
}

function renderSeriesCard(entry){
  const card = el('div', { class:'content-card' });
  const thumb = el('div', { class:'thumb' });
  if(entry.logo){
    const img = el('img', { loading:'lazy' });
    img.src = entry.logo;
    img.onerror = function(){ img.remove(); thumb.appendChild(el('div',{class:'ph'},['🎬'])); };
    thumb.appendChild(img);
  } else {
    thumb.appendChild(el('div',{class:'ph'},['🎬']));
  }
  const isFav = !!entry.favorito;
  const favBtn = el('button', { class:'fav-btn' + (isFav ? ' active':''), onclick: async function(e){
    e.stopPropagation();
    await IndexModule.toggleFavoriteSeries(entry.key);
    entry.favorito = !isFav;
    favBtn.className = 'fav-btn' + (entry.favorito ? ' active' : '');
    favBtn.textContent = entry.favorito ? '★' : '☆';
    updateSidebarCounts();
    const filteringByFav = (State.ui.currentView === 'series' && State.ui.filters.series.favoritesOnly) || State.ui.currentView === 'favorites';
    if(!entry.favorito && filteringByFav) card.remove();
  }}, [isFav ? '★' : '☆']);
  thumb.appendChild(favBtn);
  card.appendChild(thumb);

  const info = el('div', { class:'info' });
  info.appendChild(el('div', { class:'name' }, [entry.name]));
  const meta = el('div', { class:'meta' });
  meta.appendChild(el('span', { class:'server-tag', title:getServerName(entry.serverId) }, [getServerName(entry.serverId)]));
  const epTempText = entry.seasonCount ? (entry.episodeCount||0) + ' ep. • ' + entry.seasonCount + ' temp.' : (entry.episodeCount||0) + ' ep.';
  meta.appendChild(el('span', { class:'cat-tag' }, [epTempText]));
  info.appendChild(meta);
  card.appendChild(info);

  card.addEventListener('click', function(){
    if(activeSearchOverlay) activeSearchOverlay.close(true);
    State.ui.activeSeriesKey = entry.key;
    State.ui.currentView = 'series-detail';
    Router.render();
  });

  return card;
}

function renderPagination(currentPage, totalPages, onChange){
  const wrap = el('div', { class:'pagination' });
  if(totalPages <= 1) return wrap;
  const maxButtons = 7;
  let start = Math.max(1, currentPage - 3);
  let end = Math.min(totalPages, start + maxButtons - 1);
  start = Math.max(1, end - maxButtons + 1);

  wrap.appendChild(el('button', { disabled: currentPage===1 ? 'true':null, onclick:()=>onChange(1) }, ['«']));
  wrap.appendChild(el('button', { disabled: currentPage===1 ? 'true':null, onclick:()=>onChange(Math.max(1,currentPage-1)) }, ['‹']));
  for(let p=start; p<=end; p++){
    const b = el('button', { class: p===currentPage?'active':'', onclick:((pp)=>()=>onChange(pp))(p) }, [String(p)]);
    wrap.appendChild(b);
  }
  wrap.appendChild(el('button', { disabled: currentPage===totalPages ? 'true':null, onclick:()=>onChange(Math.min(totalPages,currentPage+1)) }, ['›']));
  wrap.appendChild(el('button', { disabled: currentPage===totalPages ? 'true':null, onclick:()=>onChange(totalPages) }, ['»']));
  return wrap;
}

function renderEmptyState(icon, title, msg){
  return el('div', { class:'empty-state' }, [
    el('div', { class:'big-ic' }, [icon]),
    el('h3', {}, [title]),
    el('p', {}, [msg])
  ]);
}

/* ======================================================================
   VIEW: LIST (movies / live) with filters + pagination
   ====================================================================== */
/**
 * Busca servidores+categorias (metadados, cacheados sem depender da
 * página) + a página de itens em si, pro tipo pedido ('movie'|'live'|
 * 'series'). Usada tanto pelo pré-carregamento inicial quanto pela
 * navegação normal — é o MESMO caminho, então se você clicar numa aba
 * enquanto o pré-carregamento dela ainda está em andamento, reaproveita a
 * busca já em curso (via `pageFetchesInFlight`) em vez de disparar outra
 * do zero.
 */
async function loadTypePageData(type, filters, pageSize){
  const metaKey = filterMetaCacheKey(type, filters);
  const pageKey = pageCacheKey(type, filters);

  const cachedMeta = State.pageCache.get(metaKey);
  const cachedPage = State.pageCache.get(pageKey);
  if(cachedMeta && cachedPage){
    return { serverIds: cachedMeta.serverIds, catOptions: cachedMeta.catOptions, pageResult: cachedPage };
  }

  if(State.pageFetchesInFlight.has(pageKey)){
    return State.pageFetchesInFlight.get(pageKey);
  }

  const promise = (async () => {
    const metaPromise = cachedMeta ? Promise.resolve(cachedMeta) : (
      type === 'series'
        ? Promise.all([QueryModule.getServersForSeries(), QueryModule.getCategoriesForSeries()]).then(([s,c]) => ({ serverIds:s, catOptions:c }))
        : Promise.all([QueryModule.getServersForType(type), QueryModule.getCategoriesForType(type)]).then(([s,c]) => ({ serverIds:s, catOptions:c }))
    );
    const pagePromise = type === 'series'
      ? QueryModule.getSeriesPage(filters, filters.page, pageSize)
      : QueryModule.getContentPage(type, filters, filters.page, pageSize);
    const [meta, pageResult] = await Promise.all([metaPromise, pagePromise]);
    State.pageCache.set(metaKey, meta);
    State.pageCache.set(pageKey, pageResult);
    return { serverIds: meta.serverIds, catOptions: meta.catOptions, pageResult };
  })();

  State.pageFetchesInFlight.set(pageKey, promise);
  try{
    return await promise;
  } finally {
    State.pageFetchesInFlight.delete(pageKey);
  }
}

async function renderListView(type, titleLabel, container){
  const filters = State.ui.filters[type];
  container.appendChild(el('div', { class:'section-header' }, [ el('h2', {}, [titleLabel]) ]));

  const pageKey = pageCacheKey(type, filters);
  const alreadyCached = State.pageCache.has(filterMetaCacheKey(type, filters)) && State.pageCache.has(pageKey);
  const alreadyInFlight = State.pageFetchesInFlight.has(pageKey);
  let loading = null;
  if(!alreadyCached && !alreadyInFlight){
    loading = el('div', { class:'loader-inline' }, [el('div',{class:'spinner'}), 'Carregando...']);
    container.appendChild(loading);
  }
  // Mesma função usada pelo pré-carregamento inicial — se ele já estiver
  // buscando exatamente isso, reaproveita a mesma busca em vez de disparar
  // outra do zero.
  const { serverIds, catOptions, pageResult } = await loadTypePageData(type, filters, State.settings.pageSize || PAGE_SIZE_DEFAULT);
  if(State.ui.currentView !== (type === 'movie' ? 'movies' : 'live')) return; // usuário já navegou pra outro lugar
  if(loading) loading.remove();

  if(serverIds.length > 0){
    const chipRow = el('div', { class:'chip-row' });
    chipRow.appendChild(el('button', { class:'chip' + (filters.server==='all'?' active':''), onclick:()=>{ filters.server='all'; filters.page=1; Router.render(); } }, ['Todos']));
    for(const sid of serverIds){
      chipRow.appendChild(el('button', { class:'chip' + (filters.server===sid?' active':''), onclick:((id)=>()=>{ filters.server=id; filters.page=1; Router.render(); })(sid) }, [getServerName(sid)]));
    }
    container.appendChild(chipRow);
  }

  const filterRow = el('div', { class:'filter-row' });
  filterRow.appendChild(renderCategorySelectWithFilter(type, filters, catOptions));
  filterRow.appendChild(el('button', { class:'chip' + (filters.favoritesOnly?' active':''), onclick:()=>{ filters.favoritesOnly = !filters.favoritesOnly; filters.page=1; Router.render(); } }, ['★ Favoritos']));
  container.appendChild(filterRow);

  const pageSize = State.settings.pageSize || PAGE_SIZE_DEFAULT;
  const totalPages = Math.max(1, Math.ceil(pageResult.total / pageSize));
  if(filters.page > totalPages && totalPages >= 1){ filters.page = totalPages; Router.render(); return; }

  const counterEl0 = qs(type === 'movie' ? '#cnt-movies' : '#cnt-live');
  if(counterEl0) counterEl0.textContent = pageResult.total;

  if(pageResult.total === 0){
    container.appendChild(renderEmptyState('📭', 'Nenhum conteúdo encontrado', 'Nenhum conteúdo importado ainda com esses filtros.'));
    return;
  }

  const grid = el('div', { class:'card-grid' });
  for(const content of pageResult.items){ grid.appendChild(renderContentCard(content)); }
  container.appendChild(grid);
  container.appendChild(renderPagination(filters.page, totalPages, (p)=>{ filters.page = p; Router.render(); window.scrollTo(0,0); }));

}

/* ======================================================================
   VIEW: SERIES DETAIL
   ====================================================================== */
async function renderSeriesDetailView(container){
  const key = State.ui.activeSeriesKey;
  const loading = el('div', { class:'loader-inline' }, [el('div',{class:'spinner'}), 'Carregando...']);
  container.appendChild(loading);

  const [entry, episodes, favList] = await Promise.all([
    IDB.getByKey(STORES.seriesSummary, key),
    QueryModule.getEpisodesForSeries(key),
    IDB.getAll(STORES.favorites)
  ]);
  if(State.ui.currentView !== 'series-detail') return;
  loading.remove();

  if(!entry){
    container.appendChild(el('button', { class:'btn', onclick:()=>{ State.ui.currentView='series'; Router.render(); } }, ['← Voltar']));
    container.appendChild(renderEmptyState('❓','Série não encontrada','Esta série pode ter sido removida.'));
    return;
  }

  container.appendChild(el('button', { class:'btn', style:'margin-bottom:16px;', onclick:()=>{ State.ui.currentView='series'; Router.render(); } }, ['← Voltar para Séries']));

  const header = el('div', { class:'series-header' });
  const cover = el('div', { class:'cover' });
  if(entry.logo){
    const img = el('img'); img.src = entry.logo; img.onerror=()=>{img.remove();};
    cover.appendChild(img);
  }
  header.appendChild(cover);

  const info2 = el('div', { class:'sinfo2' });
  info2.appendChild(el('h2', {}, [entry.name]));
  info2.appendChild(el('div', { style:'color:var(--text-2);font-size:13px;margin-bottom:10px;' }, ['Servidor: ' + getServerName(entry.serverId)]));
  const isFav = favList.some(f => f.type==='series' && f.id===entry.key);
  const favDetailBtn = el('button', { class:'btn' + (isFav?' primary':'') }, [(isFav?'★':'☆') + ' Favorito']);
  let favState = isFav;
  favDetailBtn.addEventListener('click', async function(){
    await IndexModule.toggleFavoriteSeries(entry.key);
    favState = !favState;
    favDetailBtn.className = 'btn' + (favState?' primary':'');
    favDetailBtn.textContent = (favState?'★':'☆') + ' Favorito';
    updateSidebarCounts();
  });
  info2.appendChild(favDetailBtn);
  header.appendChild(info2);
  container.appendChild(header);

  const seasons = new Map();
  for(const content of episodes){
    const se = (content.season !== undefined && content.episode !== undefined)
      ? { season: content.season, episode: content.episode }
      : ParserModule.extractSeasonEpisode(content.nome);
    if(!seasons.has(se.season)) seasons.set(se.season, []);
    seasons.get(se.season).push({ content, ep: se.episode });
  }
  const sortedSeasons = Array.from(seasons.keys()).sort((a,b)=>a-b);

  const seasonsWrap = el('div');
  container.appendChild(seasonsWrap);
  // Se houver mais de uma temporada, começa tudo recolhido (o usuário
  // escolhe o que expandir). Com uma única temporada, já abre ela.
  let openSeasonNum = sortedSeasons.length === 1 ? sortedSeasons[0] : null;

  function renderEpisodeRow(content){
    const prog = ProgressModule.getProgress(content.id);
    const row = el('div', { class:'episode-row', onclick:()=>PlayerModule.open(content) });
    const eth = el('div', { class:'eth' });
    // Se o episódio não tem capa própria salva (foi deduplicada por ser
    // igual à da série, ver dedupeSeriesLogos), cai pra capa da série.
    const episodeLogo = resolveContentLogo(content, entry.logo);
    if(episodeLogo){
      const img = el('img'); img.src = episodeLogo; img.onerror=()=>img.remove();
      eth.appendChild(img);
    }
    row.appendChild(eth);
    const episodeName = resolveContentName(content, entry.name);
    row.appendChild(el('div', { class:'ename' }, [episodeName]));
    let statusText = 'Não iniciado';
    let statusClass = '';
    if(prog){
      if(prog.concluido){ statusText = 'Assistido ✓'; statusClass='done'; }
      else if(prog.porcentagem > 0){ statusText = Math.round(prog.porcentagem) + '%'; }
    }
    row.appendChild(el('div', { class:'estatus'+(statusClass?' '+statusClass:'') }, [statusText]));
    row.appendChild(el('div', { class:'eprog' }, [el('div',{class:'f', style:'width:'+(prog?Math.min(100,prog.porcentagem):0)+'%'})]));
    const dlBtn = el('button', {
      style:'width:28px;height:28px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-left:4px;',
      title:'Baixar episódio'
    }, ['⬇']);
    dlBtn.addEventListener('click', function(e){
      e.stopPropagation();
      downloadContentUrl(resolveContentUrl(content), episodeName);
    });
    row.appendChild(dlBtn);
    return row;
  }

  function renderSeasonsAccordion(){
    seasonsWrap.innerHTML = '';
    for(const seasonNum of sortedSeasons){
      const isOpen = openSeasonNum === seasonNum;
      const seasonBlock = el('div', {
        class:'season-block',
        style:'margin-bottom:10px;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;'
      });
      const seasonHeader = el('div', {
        style:'display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:12px 16px;'
      }, [
        el('h4', { style:'margin:0;' }, ['Temporada ' + seasonNum]),
        el('span', { style:'display:flex;align-items:center;gap:10px;color:var(--text-2);font-size:13px;' }, [
          seasons.get(seasonNum).length + ' ep.',
          el('span', { style:'display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--bg-3);color:var(--text-0);font-size:16px;font-weight:700;line-height:1;' }, [isOpen ? '−' : '+'])
        ])
      ]);
      seasonHeader.addEventListener('click', function(){
        openSeasonNum = isOpen ? null : seasonNum; // clicar na mesma fecha; clicar em outra troca
        renderSeasonsAccordion();
      });
      seasonBlock.appendChild(seasonHeader);

      if(isOpen){
        // Indentação + borda à esquerda pra deixar claro que os episódios
        // estão "dentro" da temporada, não soltos na página.
        const epsWrap = el('div', { style:'padding:4px 14px 14px 20px;border-left:3px solid var(--accent);margin:0 14px 14px;' });
        const eps = seasons.get(seasonNum).sort((a,b)=>a.ep-b.ep);
        for(const { content } of eps){ epsWrap.appendChild(renderEpisodeRow(content)); }
        seasonBlock.appendChild(epsWrap);
      }
      seasonsWrap.appendChild(seasonBlock);
    }
  }

  renderSeasonsAccordion();
}

/** Busca os dados do Dashboard (Continuar Assistindo + Adicionados
 * Recentemente), com dedup de buscas em andamento. */
async function loadDashboardData(){
  if(State.dashboardCache) return State.dashboardCache;
  const inFlightKey = 'dashboard';
  if(State.pageFetchesInFlight.has(inFlightKey)) return State.pageFetchesInFlight.get(inFlightKey);

  const promise = (async () => {
    const continueList = await ProgressModule.getContinueWatchingList(12);
    const recentGroups = await getRecentlyAddedGroupedForDashboard(6, 8);
    const result = { continueList, recentGroups };
    State.dashboardCache = result;
    return result;
  })();

  State.pageFetchesInFlight.set(inFlightKey, promise);
  try{
    return await promise;
  } finally {
    State.pageFetchesInFlight.delete(inFlightKey);
  }
}

async function renderDashboardView(container){
  if(State.servers.size === 0){
    container.appendChild(el('div', { class:'section-header' }, [el('h2',{},['Dashboard'])]));
    container.appendChild(renderEmptyState('🚀', 'Vamos começar!', 'Adicione um servidor manual ou configure uma URL Raw em Configurações para importar suas listas M3U/M3U8.'));
    return;
  }

  const alreadyCached = !!State.dashboardCache;
  const alreadyInFlight = State.pageFetchesInFlight.has('dashboard');
  let loading = null;
  if(!alreadyCached && !alreadyInFlight){
    loading = el('div', { class:'loader-inline' }, [el('div',{class:'spinner'}), 'Carregando...']);
    container.appendChild(loading);
  }
  const { continueList, recentGroups } = await loadDashboardData();
  if(State.ui.currentView !== 'dashboard') return;
  if(loading) loading.remove();

  if(continueList.length > 0){
    container.appendChild(el('div', { class:'section-header' }, [
      el('h2', { style:'font-size:15px;' }, ['Continuar Assistindo']),
      el('button', { class:'btn small', onclick:()=>Router.goTo('continue') }, ['Ver tudo'])
    ]));
    const grid2 = el('div', { class:'card-grid' });
    for(const { content } of continueList){ grid2.appendChild(renderContentCard(content, { showRemoveFromContinue:true, hideDownload:true })); }
    container.appendChild(grid2);
  }

  if(recentGroups.length > 0){
    container.appendChild(el('div', { class:'section-header', style: continueList.length > 0 ? 'margin-top:8px;' : '' }, [
      el('h2', { style:'font-size:15px;' }, ['Adicionados Recentemente'])
    ]));
    for(const group of recentGroups){
      container.appendChild(el('div', { style:'font-size:12.5px;font-weight:700;color:var(--text-2);margin:10px 0 8px;' }, [group.serverName]));
      const g = el('div', { class:'card-grid' });
      for(const item of group.items){
        if(item.kind === 'series') g.appendChild(renderSeriesCard(item.data));
        else g.appendChild(renderContentCard(item.data, { hideDownload:true }));
      }
      container.appendChild(g);
    }
  }

  if(continueList.length === 0 && recentGroups.length === 0){
    container.appendChild(renderEmptyState('📭', 'Nada por aqui ainda', 'Assista a algo ou importe conteúdo para ver novidades no Dashboard.'));
  }
}

async function getRecentlyAddedGroupedForDashboard(maxServers, perServerLimit){
  const servers = Array.from(State.servers.values()).slice(0, maxServers);
  const groups = [];
  for(const server of servers){
    const [movies, live, series] = await Promise.all([
      QueryModule.getRecentForServer('movie', server.id, perServerLimit),
      QueryModule.getRecentForServer('live', server.id, perServerLimit),
      QueryModule.getRecentSeriesForServer(server.id, perServerLimit)
    ]);
    const items = [];
    for(const c of movies) items.push({ kind:'content', data:c });
    for(const c of live) items.push({ kind:'content', data:c });
    for(const s of series) items.push({ kind:'series', data:s });
    if(items.length > 0){
      groups.push({ serverId: server.id, serverName: server.nome, items: items.slice(0, perServerLimit) });
    }
  }
  return groups;
}

/** Busca os favoritos (filme/ao vivo/série), com dedup de buscas em
 * andamento — mesmo padrão usado pra Filmes/Séries/Ao Vivo (loadTypePageData). */
async function loadFavoritesData(){
  if(State.favoritesCache) return State.favoritesCache;
  const inFlightKey = 'favorites';
  if(State.pageFetchesInFlight.has(inFlightKey)) return State.pageFetchesInFlight.get(inFlightKey);

  const promise = (async () => {
    const favs = await IDB.getAll(STORES.favorites);
    const favContentEntries = favs.filter(f => f.type !== 'series');
    const favSeriesEntries = favs.filter(f => f.type === 'series');

    const [contents, seriesList] = await Promise.all([
      Promise.all(favContentEntries.map(f => IDB.getByKey(STORES.contents, f.id).catch(()=>null))),
      Promise.all(favSeriesEntries.map(f => IDB.getByKey(STORES.seriesSummary, f.id).catch(()=>null)))
    ]);

    const favMovies = contents.filter(c => c && c.tipo === 'movie');
    const favLive = contents.filter(c => c && c.tipo === 'live');
    const favSeries = seriesList.filter(Boolean).map(s => { s.favorito = true; return s; });
    const result = { favMovies, favLive, favSeries };
    State.favoritesCache = result;
    return result;
  })();

  State.pageFetchesInFlight.set(inFlightKey, promise);
  try{
    return await promise;
  } finally {
    State.pageFetchesInFlight.delete(inFlightKey);
  }
}

async function renderFavoritesView(container){
  container.appendChild(el('div', { class:'section-header' }, [el('h2',{},['Favoritos'])]));

  const alreadyCached = !!State.favoritesCache;
  const alreadyInFlight = State.pageFetchesInFlight.has('favorites');
  let loading = null;
  if(!alreadyCached && !alreadyInFlight){
    loading = el('div', { class:'loader-inline' }, [el('div',{class:'spinner'}), 'Carregando...']);
    container.appendChild(loading);
  }
  const { favMovies, favLive, favSeries } = await loadFavoritesData();
  if(State.ui.currentView !== 'favorites') return;
  if(loading) loading.remove();

  if(favMovies.length===0 && favLive.length===0 && favSeries.length===0){
    container.appendChild(renderEmptyState('★','Nenhum favorito ainda','Marque filmes, séries ou canais como favoritos para vê-los aqui.'));
    return;
  }

  if(favSeries.length){
    container.appendChild(el('div', { class:'server-section-title' }, ['Séries']));
    const grid = el('div', { class:'card-grid' });
    for(const e of favSeries) grid.appendChild(renderSeriesCard(e));
    container.appendChild(grid);
  }
  if(favMovies.length){
    container.appendChild(el('div', { class:'server-section-title' }, ['Filmes']));
    const grid = el('div', { class:'card-grid' });
    for(const c of favMovies) grid.appendChild(renderContentCard(c));
    container.appendChild(grid);
  }
  if(favLive.length){
    container.appendChild(el('div', { class:'server-section-title' }, ['Ao Vivo']));
    const grid = el('div', { class:'card-grid' });
    for(const c of favLive) grid.appendChild(renderContentCard(c));
    container.appendChild(grid);
  }
}

    return list;

let serverActionLocks = new Set();

function renderServersView(){
  const container = el('div');
  container.appendChild(el('div', { class:'section-header' }, [
    el('h2',{},['Servidores']),
    el('button', { class:'btn primary', onclick: ()=>openAddServerModal() }, ['+ Adicionar Servidor']),
    el('button', { class:'btn', onclick: ()=>updateAllServers() }, ['⟳ Atualizar Todos'])
  ]));

  const manual = [];
  const auto = [];
  for(const [,s] of State.servers){
    if(s.tipoOrigem === 'manual') manual.push(s); else auto.push(s);
  }
  manual.sort((a,b)=>a.nome.localeCompare(b.nome));
  auto.sort((a,b)=>a.nome.localeCompare(b.nome));

  container.appendChild(el('div', { class:'server-section-title' }, ['Servidores Manuais']));
  if(manual.length===0){
    container.appendChild(renderEmptyState('🖥️','Nenhum servidor manual','Adicione um servidor manualmente pelo botão acima.'));
  } else {
    const list = el('div', { class:'server-list' });
    for(const s of manual) list.appendChild(renderServerItem(s));
    container.appendChild(list);
  }

  container.appendChild(el('div', { class:'server-section-title' }, ['Servidores Automáticos']));
  if(auto.length===0){
    container.appendChild(renderEmptyState('⚡','Nenhum servidor automático','Configure a URL Raw em Configurações e clique em "Baixar e Processar".'));
  } else {
    const list = el('div', { class:'server-list' });
    for(const s of auto) list.appendChild(renderServerItem(s));
    container.appendChild(list);
  }

  return container;
}

function renderServerItem(s){
  const item = el('div', { class:'server-item' });
  const sinfo = el('div', { class:'sinfo' });

  const isError = s.lastStatus === 'error';
  const isUpdating = State.ui.serversUpdating.has(s.id);
  const dotClass = 'status-dot' + (isError ? ' error' : '') + (isUpdating ? ' updating' : '');
  const dotTitle = isUpdating ? 'Atualizando...' : (isError ? ('Erro na última atualização: ' + (s.lastError || 'desconhecido')) : 'Última atualização OK');

  sinfo.appendChild(el('div', { class:'sname' }, [
    el('span', { class:dotClass, title:dotTitle }),
    s.nome
  ]));
  // URL não é mostrada aqui de propósito (contém usuário/senha na querystring).
  const statsChildren = [
    el('span', {}, ['Cadastrado em ' + new Date(s.dataCadastro).toLocaleDateString()])
  ];
  if(isError){
    statsChildren.push(el('span', { style:'color:var(--danger);' }, ['Erro: ' + (s.lastError || 'falha na última atualização')]));
  }
  sinfo.appendChild(el('div', { class:'sstats' }, statsChildren));
  item.appendChild(sinfo);

  const actions = el('div', { class:'sactions' });
  const updateBtn = el('button', { class:'btn small', onclick: (e)=>updateSingleServer(s.id, e.target) }, ['Atualizar']);
  const deleteBtn = el('button', { class:'btn small danger', onclick: ()=>confirmDeleteServer(s.id) }, ['Excluir']);
  actions.appendChild(updateBtn);
  actions.appendChild(deleteBtn);
  item.appendChild(actions);

  return item;
}

async function updateSingleServer(serverId, btnEl){
  if(serverActionLocks.has(serverId)) return;
  const server = State.servers.get(serverId);
  if(!server) return;
  if(State.ui.isImporting){ showToast('Já existe uma importação em andamento.', 'error'); return; }
  serverActionLocks.add(serverId);
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = 'Atualizando...'; }
  await runImportWithProgressModal([server]);
  serverActionLocks.delete(serverId);
  Router.render();
}

function confirmDeleteServer(serverId){
  const server = State.servers.get(serverId);
  if(!server) return;
  if(!confirm('Excluir o servidor "' + server.nome + '"? Todos os conteúdos relacionados serão removidos permanentemente.')) return;
  ServerModule.deleteServer(serverId).then(()=>{
    showToast('Servidor excluído.', 'success');
    Router.render();
  }).catch(()=>{
    showToast('Erro ao excluir servidor.', 'error');
  });
}

async function updateAllServers(){
  const allServers = Array.from(State.servers.values());
  if(allServers.length === 0){ showToast('Nenhum servidor cadastrado.', 'error'); return; }
  if(State.ui.isImporting){ showToast('Já existe uma importação em andamento.', 'error'); return; }
  await runImportWithProgressModal(allServers);
}
