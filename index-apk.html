<script>

/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */

const RAW_URL =
    "https://raw.githubusercontent.com/matheus-yaml/manager/refs/heads/main/index.html";

const CHECK_INTERVAL =
    15 * 1000;


/* =========================================================
   BANCO DO LOADER
   ========================================================= */

const LOADER_DB_NAME =
    "__ManagerLoaderDB";

const LOADER_DB_VERSION =
    1;

const LOADER_STORE =
    "data";

const KEY_HTML =
    "html";

const KEY_HASH =
    "hash";

const KEY_DATE =
    "date";

let loaderDB = null;


/* =========================================================
   INDEXEDDB
   ========================================================= */

function openLoaderDB(){

    if(loaderDB){

        return Promise.resolve(
            loaderDB
        );
    }

    return new Promise(
        (resolve,reject)=>{

            let request;

            try{

                request =
                    indexedDB.open(
                        LOADER_DB_NAME,
                        LOADER_DB_VERSION
                    );

            }catch(error){

                reject(error);

                return;
            }


            request.onupgradeneeded =
                function(event){

                    const db =
                        event.target.result;

                    if(
                        !db.objectStoreNames
                            .contains(
                                LOADER_STORE
                            )
                    ){

                        db.createObjectStore(
                            LOADER_STORE
                        );
                    }
                };


            request.onsuccess =
                function(event){

                    loaderDB =
                        event.target.result;

                    resolve(
                        loaderDB
                    );
                };


            request.onerror =
                function(){

                    reject(
                        request.error
                    );
                };

        }
    );
}


/* =========================================================
   LER INDEXEDDB
   ========================================================= */

async function dbGet(key){

    try{

        const db =
            await openLoaderDB();

        return await new Promise(
            (resolve,reject)=>{

                const tx =
                    db.transaction(
                        LOADER_STORE,
                        "readonly"
                    );

                const request =
                    tx.objectStore(
                        LOADER_STORE
                    ).get(
                        key
                    );

                request.onsuccess =
                    function(){

                        resolve(
                            request.result
                        );
                    };

                request.onerror =
                    function(){

                        reject(
                            request.error
                        );
                    };

            }
        );

    }catch(error){

        console.warn(
            "[Loader] Erro ao ler IndexedDB:",
            error
        );

        return null;
    }
}


/* =========================================================
   SALVAR INDEXEDDB
   ========================================================= */

async function dbSet(
    key,
    value
){

    try{

        const db =
            await openLoaderDB();

        await new Promise(
            (resolve,reject)=>{

                const tx =
                    db.transaction(
                        LOADER_STORE,
                        "readwrite"
                    );

                tx.objectStore(
                    LOADER_STORE
                ).put(
                    value,
                    key
                );

                tx.oncomplete =
                    resolve;

                tx.onerror =
                    function(){

                        reject(
                            tx.error
                        );
                    };

            }
        );

        return true;

    }catch(error){

        console.warn(
            "[Loader] Erro ao salvar IndexedDB:",
            error
        );

        return false;
    }
}


/* =========================================================
   LOCALSTORAGE
   ========================================================= */

function localKey(key){

    return "__SM_LOADER_" + key;
}


function localGet(key){

    try{

        return localStorage.getItem(
            localKey(key)
        );

    }catch(error){

        return null;
    }
}


function localSet(
    key,
    value
){

    try{

        localStorage.setItem(
            localKey(key),
            value
        );

        return true;

    }catch(error){

        return false;
    }
}

   OBTER HTML

    if(value){

}

async function getHash(){

     */

    const value =
        await dbGet(
            KEY_HASH
        );

    if(value){

        return value;
    }


    /*
     * Se não encontrou no IndexedDB,
     * obrigatoriamente tenta localStorage.
     */

    const localHash =
        localGet(
            KEY_HASH
        );

    if(localHash){

        return localHash;
    }

    return null;
}


/* =========================================================
   SALVAR VERSÃO
   ========================================================= */

async function saveVersion(
    html,
    hash
){

    /*
     * Salva no IndexedDB.
     */

    await dbSet(
        KEY_HTML,
        html
    );

    await dbSet(
        KEY_HASH,
        hash
    );

    await dbSet(
        KEY_DATE,
        Date.now()
    );


    /*
     * Sempre mantém também
     * uma cópia no localStorage.
     */

    localSet(
        KEY_HTML,
        html
    );

    localSet(
        KEY_HASH,
        hash
    );

    localSet(
        KEY_DATE,
        String(
            Date.now()
        )
    );
}


/* =========================================================
   SHA-256
   ========================================================= */

async function sha256(text){

    if(
        typeof crypto !== "undefined" &&
        crypto.subtle
    ){

        const encoder =
            new TextEncoder();

        const data =
            encoder.encode(
                text
            );

        const buffer =
            await crypto.subtle.digest(
                "SHA-256",
                data
            );

        const bytes =
            new Uint8Array(
                buffer
            );

        let result = "";

        for(
            let i = 0;
            i < bytes.length;
            i++
        ){

            result +=
                bytes[i]
                    .toString(16)
                    .padStart(
                        2,
                        "0"
                    );
        }

        return result;
    }


    /*
     * Fallback.
     */

    let hash = 0;

    for(
        let i = 0;
        i < text.length;
        i++
    ){

        hash =
            ((hash << 5) - hash) +
            text.charCodeAt(i);

        hash |= 0;
    }

    return String(
        hash
    );
}

async function downloadRemote(){

    const separator =
        RAW_URL.includes("?")
            ? "&"
            : "?";

    const url =
        RAW_URL +
        separator +
        "__loader_timestamp=" +
        Date.now();


    console.log(
        "[Loader] Baixando versão do GitHub..."
    );


    const response =
        await fetch(
            url,
            {
                method:"GET",
                cache:"no-store",
                credentials:"omit",
                redirect:"follow"
            }
        );


    if(!response.ok){

        throw new Error(
            "GitHub respondeu HTTP " +
            response.status
        );
    }


    const html =
        await response.text();


    if(!html){

        throw new Error(
            "GitHub retornou HTML vazio."
        );
    }


    return html;
}

async function updateNow(){

    const button =
        document.getElementById(
            "__sm_update_now"
        );


    if(button){

        button.disabled =
            true;

        button.style.opacity =
            ".6";

        button.textContent =
            "Baixando atualização...";
    }


    try{

        console.log(
            "[Manager] Baixando nova versão..."
        );


        const newHTML =
            await download();


        console.log(
            "[Manager] Calculando hash da nova versão..."
        );


        const newHash =
            await makeHash(
                newHTML
            );


        console.log(
            "[Manager] Novo hash:",
            newHash
        );


        await saveNewVersion(
            newHTML,
            newHash
        );


        console.log(
            "[Manager] Nova versão salva."
        );


        console.log(
            "[Manager] Recarregando aplicativo..."
        );


        /*
         * O loader original será executado novamente.
         *
         * Como a nova versão já está salva,
         * ele abrirá essa versão.
         */

        location.reload();


    }catch(error){

        console.error(
            "[Manager] Erro ao atualizar:",
            error
        );


        if(button){

            button.disabled =
                false;

            button.style.opacity =
                "1";

            button.textContent =
                "Tentar novamente";
        }


        alert(
            "Não foi possível atualizar o aplicativo.\\n\\n" +
            "Verifique sua conexão com a internet."
        );
    }
}

/* =========================================================
   INJETAR MONITOR
   ========================================================= */

function injectMonitorIntoHTML(html){

    const monitor =
        createMonitorScript();


    if(
        /<\/body\s*>/i.test(html)
    ){

        return html.replace(
            /<\/body\s*>/i,
            monitor +
            "</body>"
        );
    }


    return html +
        monitor;
}


/* =========================================================
   ABRIR APLICAÇÃO
   ========================================================= */

function openApplication(html){

    const executableHTML =
        injectMonitorIntoHTML(
            html
        );


    document.open();


    document.write(
        executableHTML
    );


    document.close();
}

     */

    const cachedHTML =
        await getHTML();


    if(cachedHTML){

        console.log(
            "[Loader] Versão armazenada encontrada."
        );


        console.log(
            "[Loader] Abrindo aplicativo pelo cache."
        );


        openApplication(
            cachedHTML
        );


        return;
    }


    /*
     * Primeira execução.
     */

    try{

        loaderText.textContent =
            "Baixando aplicativo...";


        console.log(
            "[Loader] Nenhuma versão local encontrada."
        );


        console.log(
            "[Loader] Baixando versão do GitHub..."
        );


        const remoteHTML =
            await downloadRemote();


        loaderText.textContent =
            "Preparando aplicativo...";


        /*
         * Calcula o hash do HTML ORIGINAL.
         */

        const remoteHash =
            await sha256(
                remoteHTML
            );


        console.log(
            "[Loader] Hash inicial:",
            remoteHash
        );


        /*
         * Salva a versão original.
         */

        await saveVersion(
            remoteHTML,
            remoteHash
        );


        console.log(
            "[Loader] Versão inicial salva."
        );


        /*
         * Abre o aplicativo.
         */

        openApplication(
            remoteHTML
        );


    }catch(error){

        console.error(
            "[Loader] Erro ao iniciar:",
            error
        );


        loaderText.style.display =
            "none";


        errorElement.style.display =
            "block";
    }
}


/* =========================================================
   INICIAR LOADER
   ========================================================= */

start();

</script>
