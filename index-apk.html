/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */

const RAW_URL =
    "https://raw.githubusercontent.com/matheus-yaml/manager/refs/heads/main/index.html";

const CHECK_INTERVAL =
    15 * 1000;


/* =========================================================
   BANCO DO LOADER
   ========================================================= */

const LOADER_DB_NAME =
    "__ManagerLoaderDB";

const LOADER_DB_VERSION =
    1;

const LOADER_STORE =
    "data";

const KEY_HTML =
    "html";

const KEY_HASH =
    "hash";

const KEY_DATE =
    "date";

let loaderDB = null;


/* =========================================================
   INDEXEDDB
   ========================================================= */

function openLoaderDB(){

    if(loaderDB){

        return Promise.resolve(
            loaderDB
        );
    }

    return new Promise(
        (resolve,reject)=>{

            let request;

            try{

                request =
                    indexedDB.open(
                        LOADER_DB_NAME,
                        LOADER_DB_VERSION
                    );

            }catch(error){

                reject(error);

                return;
            }


            request.onupgradeneeded =
                function(event){

                    const db =
                        event.target.result;

                    if(
                        !db.objectStoreNames
                            .contains(
                                LOADER_STORE
                            )
                    ){

                        db.createObjectStore(
                            LOADER_STORE
                        );
                    }
                };


            request.onsuccess =
                function(event){

                    loaderDB =
                        event.target.result;

                    resolve(
                        loaderDB
                    );
                };


            request.onerror =
                function(){

                    reject(
                        request.error
                    );
                };

        }
    );
}


/* =========================================================
   LER INDEXEDDB
   ========================================================= */

async function dbGet(key){

    try{

        const db =
            await openLoaderDB();

        return await new Promise(
            (resolve,reject)=>{

                const tx =
                    db.transaction(
                        LOADER_STORE,
                        "readonly"
                    );

                const request =
                    tx.objectStore(
                        LOADER_STORE
                    ).get(
                        key
                    );

                request.onsuccess =
                    function(){

                        resolve(
                            request.result
                        );
                    };

                request.onerror =
                    function(){

                        reject(
                            request.error
                        );
                    };

            }
        );

    }catch(error){

        console.warn(
            "[Loader] Erro ao ler IndexedDB:",
            error
        );

        return null;
    }
}


/* =========================================================
   SALVAR INDEXEDDB
   ========================================================= */

async function dbSet(
    key,
    value
){

    try{

        const db =
            await openLoaderDB();

        await new Promise(
            (resolve,reject)=>{

                const tx =
                    db.transaction(
                        LOADER_STORE,
                        "readwrite"
                    );

                tx.objectStore(
                    LOADER_STORE
                ).put(
                    value,
                    key
                );

                tx.oncomplete =
                    resolve;

                tx.onerror =
                    function(){

                        reject(
                            tx.error
                        );
                    };

            }
        );

        return true;

    }catch(error){

        console.warn(
            "[Loader] Erro ao salvar IndexedDB:",
            error
        );

        return false;
    }
}


/* =========================================================
   LOCALSTORAGE
   ========================================================= */

function localKey(key){

    return "__SM_LOADER_" + key;
}


function localGet(key){

    try{

        return localStorage.getItem(
            localKey(key)
        );

    }catch(error){

        return null;
    }
}


function localSet(
    key,
    value
){

    try{

        localStorage.setItem(
            localKey(key),
            value
        );

        return true;

    }catch(error){

        return false;
    }
}


/* =========================================================
   OBTER HTML
   ========================================================= */

async function getHTML(){

    const value =
        await dbGet(
            KEY_HTML

    if(value){

        return value;
    }

    return localGet(

}


/* =========================================================
   OBTER HASH
   ========================================================= */

async function getHash(){

    /*
     * Primeiro tenta IndexedDB.
     */

    const value =
        await dbGet(
            KEY_HASH
        );

    if(value){

        return value;
    }

     * Se não encontrou no IndexedDB,
     * obrigatoriamente tenta localStorage.
     */

    const localHash =
        localGet(
            KEY_HASH
        );

    if(localHash){

        return localHash;
    }

    return null;
}


/* =========================================================
   SALVAR VERSÃO
   ========================================================= */

async function saveVersion(
    html,
    hash
){

    /*
     * Salva no IndexedDB.
     */

    await dbSet(
        KEY_HTML,
        html
    );

    await dbSet(
        KEY_HASH,
        hash
    );

    await dbSet(
        KEY_DATE,
        Date.now()
    );


    /*
     * Sempre mantém também
     * uma cópia no localStorage.
     */

    localSet(
        KEY_HTML,
        html
    );

    localSet(
        KEY_HASH,
        hash
    );

    localSet(
        KEY_DATE,
        String(
            Date.now()
        )
    );
}


/* =========================================================
   SHA-256
   ========================================================= */

async function sha256(text){

    if(
        typeof crypto !== "undefined" &&
        crypto.subtle
    ){

        const encoder =
            new TextEncoder();

        const data =
            encoder.encode(
                text
            );

        const buffer =
            await crypto.subtle.digest(
                "SHA-256",
                data
            );

        const bytes =
            new Uint8Array(
                buffer
            );

        let result = "";

        for(
            let i = 0;
            i < bytes.length;
            i++
        ){

            result +=
                bytes[i]
                    .toString(16)
                    .padStart(
                        2,
                        "0"
                    );
        }

        return result;
    }


    /*
     * Fallback.
     */

    let hash = 0;

    for(
        let i = 0;
        i < text.length;
        i++
    ){

        hash =
            ((hash << 5) - hash) +
            text.charCodeAt(i);

        hash |= 0;
    }

    return String(
        hash
    );
}


/* =========================================================
   BAIXAR GITHUB
   ========================================================= */

async function downloadRemote(){

    const separator =
        RAW_URL.includes("?")
            ? "&"
            : "?";

    const url =
        RAW_URL +
        separator +
        "__loader_timestamp=" +
        Date.now();


    console.log(
        "[Loader] Baixando versão do GitHub..."
    );


    const response =
        await fetch(
            url,
            {
                method:"GET",
                cache:"no-store",
                credentials:"omit",
                redirect:"follow"
            }
        );


    if(!response.ok){

        throw new Error(
            "GitHub respondeu HTTP " +
            response.status
        );
    }


    const html =
        await response.text();


    if(!html){

        throw new Error(
            "GitHub retornou HTML vazio."
        );
    }


    return html;
}

/* =====================================================
   SALVAR NOVA VERSÃO
   ===================================================== */

async function saveNewVersion(
    html,
    hash
){

    let savedIDB =
        false;


    /*
     * Tenta IndexedDB.
     */

    try{

        const db =
            await openDB();


        await new Promise(
            (resolve,reject)=>{

                const tx =
                    db.transaction(
                        STORE,
                        "readwrite"
                    );


                const store =
                    tx.objectStore(
                        STORE
                    );


                store.put(
                    html,
                    "html"
                );


                store.put(
                    hash,
                    "hash"
                );


                store.put(
                    Date.now(),
                    "date"
                );


                tx.oncomplete =
                    resolve;


                tx.onerror =
                    function(){

                        reject(
                            tx.error
                        );
                    };

            }
        );


        savedIDB =
            true;


        console.log(
            "[Manager] Nova versão salva no IndexedDB."
        );


    }catch(error){

        console.warn(
            "[Manager] Falha ao salvar no IndexedDB:",
            error
        );
    }


    /*
     * Sempre salva também no localStorage.
     */

    try{

        localStorage.setItem(
            "__SM_LOADER_html",
            html
        );


        localStorage.setItem(
            "__SM_LOADER_hash",
            hash
        );


        localStorage.setItem(
            "__SM_LOADER_date",
            String(
                Date.now()
            )
        );


        console.log(
            "[Manager] Nova versão salva no localStorage."
        );


    }catch(error){

        console.warn(
            "[Manager] Falha ao salvar no localStorage:",
            error
        );
    }


    return savedIDB;
}

async function makeHash(text){

    if(
        typeof crypto !== "undefined" &&
        crypto.subtle
    ){

        const data =
            new TextEncoder()
                .encode(
                    text
                );


        const buffer =
            await crypto.subtle.digest(
                "SHA-256",
                data
            );


        const bytes =
            new Uint8Array(
                buffer
            );


        let result =
            "";


        for(
            let i = 0;
            i < bytes.length;
            i++
        ){

            result +=
                bytes[i]
                    .toString(16)
                    .padStart(
                        2,
                        "0"
                    );
        }


        return result;
    }


    /*
     * Fallback.
     */

    let hash =
        0;


    for(
        let i = 0;
        i < text.length;
        i++
    ){

        hash =
            ((hash << 5) - hash) +
            text.charCodeAt(i);

        hash |= 0;
    }


    return String(

    );
}

/* =====================================================
   ATUALIZAR (AUTOMÁTICO — sem pedir confirmação)
   -----------------------------------------------------
   Assim que uma versão diferente é detectada, atualiza
   sozinho e só AVISA o usuário (não pede clique). Se der
   erro, não fica insistindo na hora — a própria checagem
   periódica (a cada 15s) tenta tudo de novo naturalmente,
   do zero, na próxima vez.
   ===================================================== */

async function performAutoUpdate(newHTML,newHash){

    showNotification(
        "Nova versão encontrada — atualizando automaticamente...",
        "info"
    );


    try{

        await saveNewVersion(
            newHTML,
            newHash
        );


        console.log(
            "[Manager] Nova versão salva."
        );


        showNotification(
            "Atualizado! Reiniciando o aplicativo...",
            "success"
        );


        updateDebugBadge(
            "atualizado com sucesso, recarregando... " +
            new Date().toLocaleTimeString()
        );


        /*
         * Um instante pra pessoa conseguir ler o aviso antes
         * de recarregar.
         */

        setTimeout(
            function(){

                location.reload();
            },
            1200
        );


    }catch(error){

        console.error(
            "[Manager] Erro ao atualizar:",
            error
        );


        showNotification(
            "Falha ao atualizar — tentando de novo em breve.",
            "error"
        );


        updateDebugBadge(
            "ERRO ao atualizar: " +
            (error && error.message ? error.message : String(error)) +
            " — próxima tentativa em até 15s.",
            true
        );


        /*
         * Some sozinho depois de um tempo — não precisa ficar
         * poluindo a tela até a próxima tentativa.
         */

        setTimeout(
            hideNotification,
            6000
        );
    }
}

async function checkUpdate(){

        console.log(

        );

        return;
    }


    checking =
        true;


    updateDebugBadge(
        "verificando... " +

    );


    console.log(

    console.log(

    console.log(
        "[Manager] Horário:",
        new Date().toLocaleTimeString()
    );


    try{

        /*

        const currentHash =
            await getCurrentHash();


        if(!currentHash){

            "caracteres"
        );


        /*

        const remoteHash =
            await makeHash(

            );

        );


        /*

        if(

        ){

            console.warn(

            );


            console.warn(
                "[Manager] Hash local:",
                currentHash
            );


            console.warn(
                "[Manager] Hash GitHub:",
                remoteHash
            );


            updateDebugBadge(
                "atualização detectada — aplicando automaticamente... " +
                new Date().toLocaleTimeString()
            );


            /*
             * Reaproveita o HTML e o hash que JÁ foram baixados
             * e calculados aqui em cima pra comparar — não
             * precisa baixar tudo de novo.
             */

            performAutoUpdate(
                remoteHTML,
                remoteHash
            );


        }else{

            console.log(
                "[Manager] ✓ Nenhuma alteração encontrada."
            );


            console.log(
                "[Manager] Código local e GitHub são iguais."
            );


            updateDebugBadge(
                "ok, sem mudanças. última checagem: " +
                new Date().toLocaleTimeString()
            );
        }


    }catch(error){

        console.warn(
            "[Manager] Falha na verificação."
        );


        console.warn(
            "[Manager] O aplicativo continuará funcionando normalmente."
        );


        console.warn(
            error
        );


        updateDebugBadge(
            "ERRO na checagem: " +
            (error && error.message ? error.message : String(error)) +
            " (" +
            new Date().toLocaleTimeString() +
            ")",
            true
        );


    }finally{

        checking =
            false;


        console.log(
            "[Manager] Próxima verificação em 15 segundos."
        );


        console.log(
            "=============================================="
        );
    }
}

/* =========================================================
   INJETAR MONITOR
   ========================================================= */

function injectMonitorIntoHTML(html){

    const monitor =
        createMonitorScript();


    if(
        /<\/body\s*>/i.test(html)
    ){

        return html.replace(
            /<\/body\s*>/i,
            monitor +
            "</body>"
        );
    }


    return html +
        monitor;
}


/* =========================================================
   ABRIR APLICAÇÃO
   ========================================================= */

function openApplication(html){

    const executableHTML =
        injectMonitorIntoHTML(
            html
        );


    document.open();


    document.write(
        executableHTML
    );


    document.close();
}


/* =========================================================
   INICIAR
   ========================================================= */

async function start(){

    const loader =
        document.getElementById(
            "loader"
        );


    const loaderText =
        document.getElementById(
            "loaderText"
        );


    const errorElement =
        document.getElementById(
            "error"
        );


    /*
     * Primeiro tenta abrir a versão armazenada.
     */

    const cachedHTML =
        await getHTML();


    if(cachedHTML){

        console.log(
            "[Loader] Versão armazenada encontrada."
        );


        console.log(
            "[Loader] Abrindo aplicativo pelo cache."
        );


        openApplication(
            cachedHTML
        );


        return;
    }


    /*
     * Primeira execução.
     */

    try{

        loaderText.textContent =
            "Baixando aplicativo...";


        console.log(
            "[Loader] Nenhuma versão local encontrada."
        );


        console.log(
            "[Loader] Baixando versão do GitHub..."
        );


        const remoteHTML =
            await downloadRemote();


        loaderText.textContent =
            "Preparando aplicativo...";


        /*
         * Calcula o hash do HTML ORIGINAL.
         */

        const remoteHash =
            await sha256(
                remoteHTML
            );


        console.log(
            "[Loader] Hash inicial:",
            remoteHash
        );


        /*
         * Salva a versão original.
         */

        await saveVersion(
            remoteHTML,
            remoteHash
        );


        console.log(
            "[Loader] Versão inicial salva."
        );


        /*
         * Abre o aplicativo.
         */

        openApplication(
            remoteHTML
        );


    }catch(error){

        console.error(
            "[Loader] Erro ao iniciar:",
            error
        );


        loaderText.style.display =
            "none";


        errorElement.style.display =
            "block";
    }
}
