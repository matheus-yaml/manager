<!--
  ========================= ESQUEMA DO BANCO (IndexedDB "iptv_db") =========================

  listas                 catálogo — 1 linha por lista
    { nome, origem, bytes, blocos_crus, data, processada, formato: 5,
      total:[aoVivo, filmes, episodios], series, blocos_series,
      blocos: [ [nº dos blocos crus que têm ao vivo], [..filmes], [..episódios] ],
      grupos: [ [ [grupo, qtd], ... ] × 3 tipos ] }

  lista_<nome_servidor>  UMA TABELA POR SERVIDOR com a m3u CRUA
    chave 0..n-1 → texto (~1 MB, cortado antes de "#EXTINF"); concatenar = arquivo original

  conteudos              TABELA ESTRUTURADA
    chave [lista, tipo, nº do bloco cru]   tipo: 0 ao vivo | 1 filme | 2 episódio
    valor: texto (ou deflate dele, se "compactar" estava marcado):
      1ª linha: dicionário do bloco em JSON  {"g":[grupos], "b":[bases de url], "l":[bases de logo], "s":[séries]}
      demais linhas (1 item por linha, colunas separadas por TAB):
        0 nome | 1 id_grupo | 2 id_base_url | 3 fim_url | 4 id_base_logo | 5 fim_logo | 6 tvg_id | 7 xui_id
        só episódios: 8 id_serie | 9 temporada | 10 episodio
      url = b[id_base_url] + fim_url      logo = l[id_base_logo] + fim_logo
    Cada bloco tem o próprio dicionário → blocos independentes → dá pra processar em paralelo.

  busca                  índice de busca (ao vivo e filmes), mesma chave, texto puro:
    1 linha por item, mesma posição da linha no bloco: "nome_normalizado\tgrupo"

  series                 chave [lista, bloco] → array de [nome, grupo, logo, qtd_eps, [blocos crus], nome_normalizado]

  FLUXO: ao baixar, cada bloco cru é gravado e, na mesma hora, entregue da memória a um dos
  workers de parse (sem reler do banco). Download e processamento andam juntos. No fim todos
  os workers são encerrados (terminate) e a memória deles volta para o sistema.
-->

<script id="shared-src" type="text/plain">
// ---- código comum (workers + página) ----
var DBN = 'iptv_db', RW = { durability: 'relaxed' };
var ACC = { 'à':'a','á':'a','â':'a','ã':'a','ä':'a','å':'a','è':'e','é':'e','ê':'e','ë':'e','ì':'i','í':'i','î':'i','ï':'i',
  'ò':'o','ó':'o','ô':'o','õ':'o','ö':'o','ù':'u','ú':'u','û':'u','ü':'u','ç':'c','ñ':'n','ý':'y','ÿ':'y' };
var ACC_RE = /[àáâãäåèéêëìíîïòóôõöùúûüçñýÿ]/g, NON_ASCII = /[^\x00-\x7f]/;
function accRep(c) { return ACC[c]; }
function norm(s) {                        // minúsculas sem acento (tabela direta: mais barato que normalize NFD)
  s = s.toLowerCase();
  return NON_ASCII.test(s) ? s.replace(ACC_RE, accRep) : s;
}
function req(r) { return new Promise(function (ok, ko) { r.onsuccess = function () { ok(r.result); }; r.onerror = function () { ko(r.error); }; }); }
function txDone(tx) { return new Promise(function (ok, ko) { tx.oncomplete = ok; tx.onerror = tx.onabort = function () { ko(tx.error); }; }); }
function mb(n) { return (n / 1048576).toFixed(1) + ' MB'; }
function seg(ms) { return (ms / 1000).toFixed(1) + 's'; }
var TEM_COMP = typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined';
function compactar(s) {
  return new Response(new Blob([s]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer();
}
function descompactar(v) {
  if (typeof v === 'string') return Promise.resolve(v);
  return new Response(new Blob([v]).stream().pipeThrough(new DecompressionStream('deflate'))).text();
}
</script>

<!-- ======================= worker de PARSE (N cópias em paralelo) ======================= -->
<script id="parser-src" type="text/plain">
'use strict';
var db = null;
var SE_RE = /^(.*?)[\s._\-|]*S(\d{1,3})[\s._]*E(\d{1,4})/i;
var MOVIE_G = /filme|movie|vod|cinema|lancamento/;
var SERIE_G = /serie|novela|temporada|anime|desenho/;
var VID_RE = /\.(mp4|mkv|avi)(\?|$)/i;
var TABNL = /[\t\n\r]/g;
var ginfo = new Map();                        // classificação por grupo (cache do worker inteiro)
function attr(line, key) {
  var i = line.indexOf(key); if (i < 0) return '';
  var s = i + key.length, e = line.indexOf('"', s);
  return e < 0 ? '' : line.slice(s, e);
}
function limpa(s) { return s.indexOf('\t') >= 0 || s.indexOf('\r') >= 0 ? s.replace(TABNL, ' ') : s; }
function abrir() {
  return new Promise(function (ok, ko) { var r = indexedDB.open(DBN); r.onsuccess = function () { ok(r.result); }; r.onerror = function () { ko(r.error); }; });
}
function novoDic() { return { m: { g: new Map(), b: new Map(), l: new Map(), s: new Map() }, a: { g: [], b: [], l: [], s: [] } }; }
function id(d, k, v) {
  var x = d.m[k].get(v);
  if (x === undefined) { x = d.a[k].length; d.m[k].set(v, x); d.a[k].push(v); }
  return x;
}

async function bloco(lista, i, texto, comp) {
  var T = Date.now(), tl = 0;
  var s = texto;
  if (s == null) { s = await req(db.transaction(lista).objectStore(lista).get(i)); tl = Date.now() - T; }
  T = Date.now();

  var rows = [[], [], []], busca = [[], []], cnt = [0, 0, 0], dic = [novoDic(), novoDic(), novoDic()];
  var grupos = [new Map(), new Map(), new Map()], series = new Map();
  var p = 0, L = s.length, inf = null;
  while (p < L) {
    var e = s.indexOf('\n', p); if (e < 0) e = L;
    var url = s.slice(p, e).trim(); p = e + 1;
    if (!url) continue;
    if (url.charCodeAt(0) === 35) { if (url.lastIndexOf('#EXTINF', 0) === 0) inf = url; continue; }
    if (!inf) continue;

    var q = inf.lastIndexOf('"'), c = inf.indexOf(',', q < 0 ? 8 : q);
    var nome = c >= 0 ? inf.slice(c + 1).trim() : '';
    if (!nome) nome = attr(inf, 'tvg-name="') || url;
    nome = limpa(nome);
    var grupo = attr(inf, 'group-title="') || 'Sem grupo';
    var gi = ginfo.get(grupo);
    if (!gi) { var gk = norm(grupo); ginfo.set(grupo, gi = { g: limpa(grupo), s: SERIE_G.test(gk), m: MOVIE_G.test(gk) }); }
    grupo = gi.g;
    var t, se = null;
    if (url.indexOf('/movie/') > 0) t = 1;
    else if (url.indexOf('/series/') > 0) t = 2;
    else if (gi.s || (se = SE_RE.exec(nome))) t = 2;
    else t = gi.m || VID_RE.test(url) ? 1 : 0;

    var d = dic[t], cu = url.lastIndexOf('/') + 1;
    var logo = attr(inf, 'tvg-logo="'), li = '', ls = '';
    if (logo) { var cl = logo.lastIndexOf('/') + 1; li = id(d, 'l', logo.slice(0, cl)); ls = logo.slice(cl); }
    var row = nome + '\t' + id(d, 'g', grupo) + '\t' + id(d, 'b', url.slice(0, cu)) + '\t' + url.slice(cu) + '\t' +
              li + '\t' + ls + '\t' + attr(inf, 'tvg-id="') + '\t' + attr(inf, 'xui-id="');
    if (t === 2) {
      if (!se) se = SE_RE.exec(nome);
      var sn = se ? (se[1].trim() || nome) : nome;
      row += '\t' + id(d, 's', sn) + '\t' + (se ? +se[2] : 0) + '\t' + (se ? +se[3] : 0);
      var sr = series.get(sn);
      if (!sr) series.set(sn, sr = [sn, grupo, logo, 0]);
      sr[3]++;
    } else busca[t].push(norm(nome) + '\t' + grupo);
    rows[t].push(row);
    var gm = grupos[t]; gm.set(grupo, (gm.get(grupo) || 0) + 1);
    cnt[t]++;
    inf = null;
  }
  s = texto = null;
  var txt = [null, null, null];
  for (var k = 0; k < 3; k++) if (cnt[k]) txt[k] = JSON.stringify(dic[k].a) + '\n' + rows[k].join('\n');
  rows = dic = null;
  var tp = Date.now() - T; T = Date.now();

  var bytes = 0;
  for (k = 0; k < 3; k++) {
    if (!txt[k]) continue;
    if (comp) { txt[k] = await compactar(txt[k]); bytes += txt[k].byteLength; } else bytes += txt[k].length;
  }
  var tc = Date.now() - T; T = Date.now();

  var tx = db.transaction(['conteudos', 'busca'], 'readwrite', RW);
  var cs = tx.objectStore('conteudos'), bs = tx.objectStore('busca');
  for (k = 0; k < 3; k++) {
    var key = [lista, k, i];
    if (cnt[k]) cs.put(txt[k], key); else cs.delete(key);          // sobrescreve; apaga só o que sumiu
    if (k < 2 && cnt[k]) { var b = busca[k].join('\n'); bytes += b.length; bs.put(b, key); } else bs.delete(key);
  }
  txt = busca = null;
  await txDone(tx);
  var tw = Date.now() - T;

  return {
    i: i, cnt: cnt, bytes: bytes, tl: tl, tp: tp, tc: tc, tw: tw,
    grupos: grupos.map(function (g) { return Array.from(g.entries()); }),
    series: Array.from(series.values())
  };
}

self.onmessage = async function (ev) {
  var m = ev.data;
  try {
    if (!db) db = await abrir();
    var r = await bloco(m.lista, m.i, m.texto, m.comp);
    m = null;
    self.postMessage(r);
  } catch (e) {
    self.postMessage({ erro: String(e && e.message || e) });
  }
};
</script>

<!-- ======================= worker COORDENADOR ======================= -->
<script id="worker-src" type="text/plain">
'use strict';
var CH = 1 << 20, BLOCO = 2000;
var criar = null, apagar = null, db = null;
function post(m) { self.postMessage(m); }
function faixa(lista) { return IDBKeyRange.bound([lista], [lista, []]); }   // todas as chaves [lista, ...]

function baseSchema(d) {
  if (!d.objectStoreNames.contains('listas')) d.createObjectStore('listas', { keyPath: 'nome' });
  ['conteudos', 'busca', 'series'].forEach(function (n) { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); });
}
function open(v) {
  return new Promise(function (ok, ko) {
    var r = v ? indexedDB.open(DBN, v) : indexedDB.open(DBN);
    r.onupgradeneeded = function () {
      var d = r.result; baseSchema(d);
      if (criar && !d.objectStoreNames.contains(criar)) d.createObjectStore(criar);
      if (apagar && d.objectStoreNames.contains(apagar)) d.deleteObjectStore(apagar);
    };
    r.onblocked = function () { post({ status: 'Aguardando o banco ser liberado...' }); };
    r.onsuccess = function () { ok(r.result); };
    r.onerror = function () { ko(r.error); };
  });
}
async function alterarSchema(nomeCriar, nomeApagar) {           // criar/apagar tabela exige subir a versão
  if (db) db.close();
  db = await open();
  var precisa = (nomeCriar && !db.objectStoreNames.contains(nomeCriar)) ||
                (nomeApagar && db.objectStoreNames.contains(nomeApagar));
  if (!precisa) return;
  var v = db.version + 1; db.close();
  criar = nomeCriar; apagar = nomeApagar;
  db = await open(v);
  criar = apagar = null;
}

/* ---------- pool de workers de parse ---------- */
function criarPool(N, src, lista, comp, onRes) {
  var url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  var ws = [], livres = [], fila = [], ativos = 0, erro = null, aoFim = null;
  function solta(w) {
    if (fila.length) fila.shift()(w);
    else { livres.push(w); if (!ativos && aoFim) aoFim(); }
  }
  for (var k = 0; k < N; k++) {
    var w = new Worker(url);
    w.onmessage = function (e) {
      ativos--;
      if (e.data.erro) erro = erro || new Error(e.data.erro); else onRes(e.data);
      solta(this);
    };
    w.onerror = function (e) { ativos--; erro = erro || new Error('parser: ' + e.message); solta(this); };
    ws.push(w); livres.push(w);
  }
  return {
    N: N,
    // espera um worker livre (isso limita a memória: no máximo N blocos em processamento)
    enviar: async function (i, texto) {
      var w = livres.length ? livres.pop() : await new Promise(function (r) { fila.push(r); });
      if (erro) { livres.push(w); throw erro; }
      ativos++;
      w.postMessage({ lista: lista, i: i, texto: texto, comp: comp });
    },
    terminar: async function () {
      if (ativos) await new Promise(function (r) { aoFim = r; });
      ws.forEach(function (x) { x.terminate(); });   // libera a memória dos parsers
      ws = livres = null; URL.revokeObjectURL(url);
      if (erro) throw erro;
    }
  };
}

/* ---------- acumulador dos resumos ---------- */
function novoAcc() {
  return { cnt: [0, 0, 0], blocos: [[], [], []], grupos: [new Map(), new Map(), new Map()], series: new Map(),
           feitos: 0, tl: 0, tp: 0, tc: 0, tw: 0, bytes: 0 };
}
function junta(acc, d) {
  acc.feitos++; acc.tl += d.tl; acc.tp += d.tp; acc.tc += d.tc; acc.tw += d.tw; acc.bytes += d.bytes;
  for (var t = 0; t < 3; t++) {
    if (!d.cnt[t]) continue;
    acc.cnt[t] += d.cnt[t]; acc.blocos[t].push(d.i);
    var gm = acc.grupos[t], ga = d.grupos[t];
    for (var j = 0; j < ga.length; j++) gm.set(ga[j][0], (gm.get(ga[j][0]) || 0) + ga[j][1]);
  }
  for (var k = 0; k < d.series.length; k++) {
    var s = d.series[k], x = acc.series.get(s[0]);
    if (!x) acc.series.set(s[0], x = [s[0], s[1], s[2], 0, [], norm(s[0])]);
    x[3] += s[3]; x[4].push(d.i);
  }
}
function porNome(a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; }
function num(a, b) { return a - b; }

// grava séries, apaga sobras de processamentos anteriores e salva o catálogo
async function finalizar(meta, acc) {
  var lista = meta.nome, n = meta.blocos_crus, T = Date.now();
  var arr = Array.from(acc.series.values()); acc.series = null;
  arr.sort(porNome);
  arr.forEach(function (s) { s[4].sort(num); });
  var nsb = 0, tx = db.transaction(['series', 'conteudos', 'busca', 'listas'], 'readwrite', RW);
  var ss = tx.objectStore('series');
  for (var j = 0; j < arr.length; j += BLOCO) ss.put(arr.slice(j, j + BLOCO), [lista, nsb++]);
  ss.delete(IDBKeyRange.bound([lista, nsb], [lista, Infinity]));
  for (var t = 0; t < 3; t++) {
    tx.objectStore('conteudos').delete(IDBKeyRange.bound([lista, t, n], [lista, t, Infinity]));
    tx.objectStore('busca').delete(IDBKeyRange.bound([lista, t, t < 2 ? n : -Infinity], [lista, t, Infinity]));
  }
  meta.processada = true; meta.formato = 5; meta.total = acc.cnt; meta.series = arr.length; meta.blocos_series = nsb;
  meta.blocos = acc.blocos.map(function (b) { return b.sort(num); });
  meta.grupos = acc.grupos.map(function (g) { return Array.from(g.entries()).sort(porNome); });
  tx.objectStore('listas').put(meta);
  await txDone(tx);
  return Date.now() - T;
}
function resumo(meta, acc, N, comp, tF) {
  var c = meta.total;
  return c[0].toLocaleString() + ' ao vivo, ' + c[1].toLocaleString() + ' filmes, ' + c[2].toLocaleString() +
    ' episódios (' + meta.series.toLocaleString() + ' séries) — ' + N + ' workers, ' + (comp ? 'compactado' : 'sem compactação') +
    '\nSoma nos workers: ' + (acc.tl ? 'leitura ' + seg(acc.tl) + ' · ' : '') + 'interpretação ' + seg(acc.tp) +
    (comp ? ' · compactação ' + seg(acc.tc) : '') + ' · gravação ' + seg(acc.tw) + ' · finalização ' + seg(tF) +
    ' · gravado ' + mb(acc.bytes);
}

/* ================= 1) baixar → gravar cru E processar ao mesmo tempo ================= */
async function importar(m) {
  var src = m.src, nome = m.nome, N = m.N, comp = m.comp && TEM_COMP;
  var next, total, rd = null, file = src.file, fr = null, off = 0, origem = src.url || (file && file.name) || 'arquivo';
  var t0 = Date.now();
  if (src.url) {
    var resp = await fetch(src.url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    rd = resp.body.getReader();
    total = +resp.headers.get('content-length') || 0;
    next = function () { return rd.read(); };
    resp = null;
  } else {
    fr = new FileReaderSync(); total = file.size;
    next = function () {
      if (off >= file.size) return Promise.resolve({ done: true });
      var b = fr.readAsArrayBuffer(file.slice(off, off + CH)); off += CH;
      return Promise.resolve({ done: false, value: new Uint8Array(b) });
    };
  }
  await alterarSchema(nome, null);
  var tx0 = db.transaction(nome, 'readwrite', RW); tx0.objectStore(nome).clear(); await txDone(tx0);

  var acc = novoAcc(), pool = criarPool(N, m.parserSrc, nome, comp, function (d) { junta(acc, d); });
  var dec = new TextDecoder(), buf = '', n = 0, bytes = 0, last = 0;
  async function put(s) {
    var tx = db.transaction(nome, 'readwrite', RW);
    tx.objectStore(nome).put(s, n);
    var gravado = txDone(tx);
    await pool.enviar(n, s);          // o mesmo texto vai direto pro parser (sem reler do banco)
    n++;
    await gravado;
  }
  try {
    for (;;) {
      var c = await next();
      if (c.done) break;
      bytes += c.value.byteLength;
      buf += dec.decode(c.value, { stream: true });
      c = null;
      while (buf.length >= CH) {
        var cut = buf.lastIndexOf('\n#EXTINF', CH);
        if (cut <= 0) cut = buf.indexOf('\n#EXTINF', CH);
        if (cut < 0) break;
        await put(buf.slice(0, cut + 1));
        buf = buf.slice(cut + 1);
      }
      if (Date.now() - last > 300) {
        last = Date.now();
        post({ status: 'Baixando/gravando ' + nome + '... ' + mb(bytes) + (total ? ' / ' + mb(total) + ' (' + Math.round(bytes / total * 100) + '%)' : '') +
          ' — ' + acc.feitos + ' blocos processados' });
      }
    }
    buf += dec.decode();
    if (buf) await put(buf);
    buf = dec = rd = next = file = fr = src = null;   // solta tudo do download
    var tD = Date.now() - t0;
    post({ status: 'Download concluído (' + seg(tD) + '). Terminando processamento...' });
  } finally {
    await pool.terminar();
  }
  var meta = { nome: nome, origem: origem, bytes: bytes, blocos_crus: n, data: Date.now() };
  var tF = await finalizar(meta, acc);
  return 'Lista ' + nome + ': ' + mb(bytes) + ' em ' + n + ' blocos — total ' + seg(Date.now() - t0) +
    ' (download+gravação crua ' + seg(tD) + ', processamento junto)\n' + resumo(meta, acc, N, comp, tF);
}

/* ================= 2) reprocessar a partir da tabela crua ================= */
async function processar(m) {
  if (!db) db = await open();
  var lista = m.nome, N = m.N, comp = m.comp && TEM_COMP;
  var meta = await req(db.transaction('listas').objectStore('listas').get(lista));
  if (!meta) throw new Error('Lista não encontrada: ' + lista);
  var t0 = Date.now(), n = meta.blocos_crus, acc = novoAcc();
  var pool = criarPool(N, m.parserSrc, lista, comp, function (d) {
    junta(acc, d);
    post({ status: 'Processando ' + lista + ' com ' + N + ' workers... bloco ' + acc.feitos + '/' + n });
  });
  try { for (var i = 0; i < n; i++) await pool.enviar(i, null); }   // null = o parser lê o bloco do banco
  finally { await pool.terminar(); }
  var tF = await finalizar(meta, acc);
  return 'Processada em ' + seg(Date.now() - t0) + ': ' + resumo(meta, acc, N, comp, tF);
}

/* ================= 3) excluir lista ================= */
async function excluir(lista) {
  if (!db) db = await open();
  var tx = db.transaction(['conteudos', 'busca', 'series', 'listas'], 'readwrite', RW);
  tx.objectStore('conteudos').delete(faixa(lista));
  tx.objectStore('busca').delete(faixa(lista));
  tx.objectStore('series').delete(faixa(lista));
  tx.objectStore('listas').delete(lista);
  await txDone(tx);
  await alterarSchema(null, lista);
  return 'Lista ' + lista + ' excluída.';
}

self.onmessage = async function (ev) {
  var m = ev.data, txt;
  try {
    var cores = self.navigator.hardwareConcurrency || 2;
    m.N = m.nw > 0 ? m.nw : Math.max(1, Math.min(3, cores - 1));
    if (m.cmd === 'importar') txt = await importar(m);
    else if (m.cmd === 'processar') txt = await processar(m);
    else if (m.cmd === 'excluir') txt = await excluir(m.nome);
    if (db) db.close(); db = null;
    post({ fim: true, status: txt });
  } catch (e) {
    if (db) db.close(); db = null;
    post({ erro: String(e && e.message || e) });
  }
};
</script>

<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };
(0, eval)($('shared-src').textContent);        // norm(), req(), descompactar()... comuns com os workers
var LIMIT = 200, FORMATO = 5;
var db = null, lista = '', meta = null, curType = 0, cur = [], curKind = 'item', busy = false, token = 0, st = null;

/* ---------- utilidades ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function status(m) { $('status').textContent = m; }
function nomeTabela(s) { s = norm(s).replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); return 'lista_' + (s || 'sem_nome'); }
function heap() { return performance.memory ? mb(performance.memory.usedJSHeapSize) : null; }

// bloco (texto) → { h: dicionário, rows: linhas }
function abreBloco(txt) {
  var p = txt.indexOf('\n');
  return { h: JSON.parse(p < 0 ? txt : txt.slice(0, p)), rows: p < 0 ? [] : txt.slice(p + 1).split('\n') };
}
// linha → objeto legível (resolve o dicionário do bloco)
function item(l, h, serie) {
  var c = l.split('\t');
  var o = { nome: c[0], grupo: h.g[+c[1]], url: h.b[+c[2]] + c[3], logo: c[4] !== '' ? h.l[+c[4]] + c[5] : '', tvg_id: c[6], xui_id: c[7] };
  if (c.length > 8) { o.serie = h.s[+c[8]]; o.temporada = +c[9]; o.episodio = +c[10]; if (!o.logo && serie) o.logo = serie[2]; }
  return o;
}

/* ---------- banco (thread principal: só leitura) ---------- */
function getDB() {
  if (db) return Promise.resolve(db);
  return new Promise(function (ok, ko) {
    var r = indexedDB.open(DBN);
    r.onupgradeneeded = function () {
      var d = r.result;
      if (!d.objectStoreNames.contains('listas')) d.createObjectStore('listas', { keyPath: 'nome' });
      ['conteudos', 'busca', 'series'].forEach(function (n) { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); });
    };
    r.onsuccess = function () {
      db = r.result;
      db.onversionchange = function () { db.close(); db = null; };   // libera para o worker criar/apagar tabelas
      ok(db);
    };
    r.onerror = function () { ko(r.error); };
  });
}
async function get(store, key) { return req((await getDB()).transaction(store).objectStore(store).get(key)); }
async function lerBloco(t, b) { return abreBloco(await descompactar(await get('conteudos', [lista, t, b]))); }

/* ---------- worker: faz o pesado e é destruído no fim ---------- */
function rodarWorker(msg) {
  if (busy) return; busy = true; setBusy(true);
  if (db) { db.close(); db = null; }
  var antes = heap(), shared = $('shared-src').textContent;
  msg.parserSrc = shared + '\n' + $('parser-src').textContent;
  msg.nw = +$('nw').value; msg.comp = $('comp').checked;
  var url = URL.createObjectURL(new Blob([shared, '\n', $('worker-src').textContent], { type: 'text/javascript' }));
  var w = new Worker(url);
  function fim(txt) {
    w.terminate(); w = null;             // encerra o coordenador (os parsers já foram encerrados por ele)
    URL.revokeObjectURL(url); url = null;
    msg = null;
    $('file').value = '';                // solta a referência ao arquivo escolhido
    busy = false; setBusy(false);
    carregarListas().then(function () {
      status(txt + '\nWorkers encerrados — memória do download/processamento liberada.' +
        (antes ? ' Heap da página: ' + antes + ' antes → ' + heap() + ' agora.' : ''));
    });
  }
  w.onmessage = function (e) {
    var d = e.data;
    if (d.erro) fim('Erro: ' + d.erro + '\n(Se for URL: verifique CORS ou use o botão de arquivo.)');
    else if (d.fim) fim(d.status);
    else if (d.status) status(d.status);
  };
  w.onerror = function (e) { fim('Erro no worker: ' + e.message); };
  w.postMessage(msg);
}
function setBusy(b) { ['btnUrl', 'btnProc', 'btnDel', 'file', 'nw', 'comp'].forEach(function (id) { $(id).disabled = b; }); }

/* ---------- listas ---------- */
async function carregarListas() {
  var todas = await req((await getDB()).transaction('listas').objectStore('listas').getAll());
  if (!todas.some(function (l) { return l.nome === lista; })) lista = todas.length ? todas[0].nome : '';
  var h = todas.length ? '' : '<option value="">(nenhuma lista)</option>';
  meta = null;
  todas.forEach(function (l) {
    if (l.nome === lista) meta = l;
    h += '<option value="' + esc(l.nome) + '"' + (l.nome === lista ? ' selected' : '') + '>' + esc(l.nome) + ' — ' + mb(l.bytes) +
      (l.processada ? ' — ' + l.total[0] + ' ao vivo / ' + l.total[1] + ' filmes / ' + l.series + ' séries' : ' — não processada') + '</option>';
  });
  todas = null;
  $('lista').innerHTML = h;
  loadGroups(); await search();
}

function loadGroups() {
  var h = '<option value="">Todos os grupos</option>';
  if (meta && meta.formato === FORMATO) {
    var gs = meta.grupos[curType];
    for (var i = 0; i < gs.length; i++) h += '<option value="' + esc(gs[i][0]) + '">' + esc(gs[i][0]) + ' (' + gs[i][1] + ')</option>';
  }
  $('grp').innerHTML = h;
}

/* ---------- consultas ---------- */
// Percorre só os blocos que têm o tipo pedido (meta.blocos[t]); st guarda a posição para "Carregar mais".
async function search(more) {
  var my = ++token, t0 = performance.now();
  if (!more) st = { b: 0, i: 0 };
  if (!meta || !meta.processada) { render([], 'item', false); if (!busy) status(lista ? 'Lista não processada.' : 'Nenhuma lista. Cole uma URL ou escolha um arquivo.'); return; }
  if (meta.formato !== FORMATO) { render([], 'item', false); if (!busy) status('Lista em formato antigo: clique em Reprocessar.'); return; }
  var q = norm($('q').value.trim()), g = $('grp').value, out = [], t = curType;
  var series = t === 2, lb = series ? null : meta.blocos[t], nb = series ? meta.blocos_series : lb.length;

  while (st.b < nb && out.length < LIMIT) {
    var i = st.i, n, B;
    if (series) {
      var sr = await get('series', [lista, st.b]); if (my !== token) return;
      for (n = sr.length; i < n && out.length < LIMIT; i++) {
        var s = sr[i];
        if ((!g || s[1] === g) && (!q || s[5].indexOf(q) >= 0)) out.push(s);
      }
    } else if (!q && !g) {
      B = await lerBloco(t, lb[st.b]); if (my !== token) return;
      for (n = B.rows.length; i < n && out.length < LIMIT; i++) out.push(item(B.rows[i], B.h));
    } else {
      var linhas = (await get('busca', [lista, t, lb[st.b]])).split('\n'), hits = []; if (my !== token) return;
      for (n = linhas.length; i < n && out.length + hits.length < LIMIT; i++) {
        var L = linhas[i], tab = L.indexOf('\t');
        if (g && L.slice(tab + 1) !== g) continue;
        if (q) { var k = L.indexOf(q); if (k < 0 || k + q.length > tab) continue; }
        hits.push(i);
      }
      linhas = null;
      if (hits.length) {
        B = await lerBloco(t, lb[st.b]); if (my !== token) return;
        for (var j = 0; j < hits.length; j++) out.push(item(B.rows[hits[j]], B.h));
      }
    }
    if (i >= n) { st.b++; st.i = 0; } else st.i = i;
  }
  var tem = st.b < nb;
  render(out, series ? 'series' : 'item', tem, more);
  if (!busy) status(cur.length + (tem ? '+' : '') + ' resultados em ' + (performance.now() - t0).toFixed(0) + ' ms');
}

async function openSeries(s) {
  var my = ++token, eps = [];
  for (var i = 0; i < s[4].length; i++) {
    var B = await lerBloco(2, s[4][i]); if (my !== token) return;
    var sid = B.h.s.indexOf(s[0]); if (sid < 0) continue;
    var chave = String(sid);
    for (var j = 0; j < B.rows.length; j++) {
      var r = B.rows[j], c = r.split('\t');
      if (c[8] === chave) eps.push(item(r, B.h, s));
    }
  }
  eps.sort(function (a, b) { return a.temporada - b.temporada || a.episodio - b.episodio; });
  render(eps, 'ep', false);
  status(s[0] + ': ' + eps.length + ' episódios');
}

/* ---------- render ---------- */
function render(rows, kind, tem, append) {
  curKind = kind;
  if (!append) cur = [];
  var logos = $('logos').checked, base = cur.length, h = '';
  if (kind === 'ep') h += '<div class="it" tabindex="0" data-back="1">← Voltar</div>';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i], titulo, sub, logo;
    if (kind === 'series') { titulo = r[0]; sub = r[3] + ' episódios — ' + r[1]; logo = r[2]; }
    else { titulo = r.nome; sub = kind === 'ep' && r.temporada ? 'T' + r.temporada + ' E' + r.episodio : r.grupo; logo = r.logo; }
    var img = logos && logo ? '<img loading="lazy" src="' + esc(logo) + '" onerror="this.style.visibility=\'hidden\'">' : '';
    h += '<div class="it" tabindex="0" data-i="' + (base + i) + '">' + img + '<div>' + esc(titulo) + '<small>' + esc(sub) + '</small></div></div>';
  }
  cur = cur.concat(rows);
  if (tem) h += '<div class="it" id="more" tabindex="0" data-more="1">Carregar mais…</div>';
  var old = $('more'); if (old) old.remove();
  if (append) $('list').insertAdjacentHTML('beforeend', h); else $('list').innerHTML = h;
}

function activate(el) {
  if (!el) return;
  if (el.dataset.back) { search(); return; }
  if (el.dataset.more) { search(true); return; }
  var r = cur[+el.dataset.i]; if (!r) return;
  if (curKind === 'series') { openSeries(r); return; }
  $('player').style.display = 'block';
  $('vid').src = r.url;
  $('vlink').href = r.url; $('vlink').textContent = r.nome + ' — ' + r.url;
}

/* ---------- eventos ---------- */
$('list').addEventListener('click', function (e) { activate(e.target.closest('.it')); });
$('list').addEventListener('keydown', function (e) {
  var el = e.target.closest('.it'); if (!el) return;
  if (e.key === 'Enter') activate(el);
  else if (e.key === 'ArrowDown' && el.nextElementSibling) { el.nextElementSibling.focus(); e.preventDefault(); }
  else if (e.key === 'ArrowUp' && el.previousElementSibling) { el.previousElementSibling.focus(); e.preventDefault(); }
});
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
  b.onclick = function () {
    document.querySelector('.tab.on').classList.remove('on'); b.classList.add('on');
    curType = +b.dataset.t; loadGroups(); search();
  };
});
var deb;
$('q').oninput = function () { clearTimeout(deb); deb = setTimeout(search, 250); };
$('grp').onchange = function () { search(); };
$('lista').onchange = function () { lista = this.value; carregarListas(); };
$('logos').onchange = function () { search(); };
if (!TEM_COMP) { $('comp').disabled = true; $('comp').parentNode.title = 'Navegador sem CompressionStream'; }

$('btnUrl').onclick = function () {
  var u = $('url').value.trim(); if (!u) return;
  var host; try { host = new URL(u).hostname; } catch (e) { status('URL inválida'); return; }
  lista = nomeTabela($('nome').value.trim() || host);
  rodarWorker({ cmd: 'importar', src: { url: u }, nome: lista });
};
$('file').onchange = function () {
  var f = this.files[0]; if (!f) return;
  lista = nomeTabela($('nome').value.trim() || f.name.replace(/\.[^.]+$/, ''));
  rodarWorker({ cmd: 'importar', src: { file: f }, nome: lista });
};
$('btnProc').onclick = function () { if (lista) rodarWorker({ cmd: 'processar', nome: lista }); };
$('btnDel').onclick = function () {
  if (lista && confirm('Excluir ' + lista + ' (tabela crua e conteúdos)?')) rodarWorker({ cmd: 'excluir', nome: lista });
};
$('btnClose').onclick = function () { var v = $('vid'); v.pause(); v.removeAttribute('src'); v.load(); $('player').style.display = 'none'; };

(async function () {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  await carregarListas();
})();
</script>
</body>
